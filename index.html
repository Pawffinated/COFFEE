    delBtn.onclick=function(){openModal({type:'confirm',pid:p.id});};
    acts.appendChild(edBtn);acts.appendChild(delBtn);ir.appendChild(acts);

    row.appendChild(ir);
    list.appendChild(row);
  });
  scr.appendChild(list);

  const fab=document.createElement('button');fab.className='add-fab';fab.textContent='+';
  fab.onclick=function(){openModal({type:'prod',prod:null});};
  scr.appendChild(fab);
}

/* ==================================================================== *
 * PREPARATION SCREEN
 * Two views behind one tab: the raw ingredients a shop holds, and the
 * recipes that say how much of each a product consumes when it sells.
 * ==================================================================== */
function renderPrep(scr){
  const onIng=S.prepTab!=='rec';

  const hd=document.createElement('div');hd.className='panel-hd';
  hd.innerHTML='<h2>Preparation</h2>';
  const addb=document.createElement('button');addb.className='abtn';
  addb.textContent=onIng?'+ Ingredient':'+ Recipe';
  const openAdd=function(){
    if(onIng)openModal({type:'ing',ing:null});
    else openModal({type:'recipe',rec:null});
  };
  addb.onclick=openAdd;
  hd.appendChild(addb);scr.appendChild(hd);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'ing',lbl:'Ingredients'},{id:'rec',lbl:'Recipes'}].forEach(function(t){
    const p=document.createElement('button');
    p.className='hpill'+((onIng?'ing':'rec')===t.id?' on':'');
    p.textContent=t.lbl;
    p.onclick=function(){S.prepTab=t.id;render();};
    bar.appendChild(p);
  });
  scr.appendChild(bar);

  /* Outstanding cloud writes are stated plainly. Before this the till gave a
     cheerful "Recipe line added" and there was nowhere to find out that the
     Dashboard had never received it. */
  const pend=prepPendingCount();
  if(pend>0){
    const warn=document.createElement('div');
    warn.style.cssText='margin:0 14px 10px;padding:11px 13px;border-radius:12px;background:var(--wg);border:1px solid var(--wt);display:flex;align-items:center;gap:10px;flex-wrap:wrap';
    const wtxt=document.createElement('div');
    wtxt.style.cssText='flex:1;min-width:150px;font-size:calc(12.5px * var(--fs,1));color:var(--wt);font-weight:600;line-height:1.5';
    wtxt.textContent=pend+' item'+(pend===1?'':'s')+' not yet on the Dashboard'
      +(!navigator.onLine?' — device is offline'
        :(!CLOUD.token||!CLOUD.bizId)?' — not signed in to cloud':'');
    warn.appendChild(wtxt);
    const rbtn=document.createElement('button');
    rbtn.className='abtn';rbtn.style.cssText='font-size:calc(12px * var(--fs,1));padding:8px 14px';
    rbtn.textContent='Sync now';
    rbtn.onclick=async function(){
      if(!CLOUD.token||!CLOUD.bizId){toast('Sign in to the cloud from Admin first');return;}
      if(!navigator.onLine){toast('Still offline — reconnect and try again');return;}
      rbtn.disabled=true;rbtn.textContent='Syncing...';
      const st=await retryPrepSync();
      const left=prepPendingCount();
      toast(left===0?'All prep data synced ✓':(st.ings+st.recipes)+' synced, '+left+' still pending');
      render();
    };
    warn.appendChild(rbtn);
    scr.appendChild(warn);
  }

  if(onIng)renderPrepIngredients(scr);
  else renderPrepRecipes(scr);

  const fab=document.createElement('button');fab.className='add-fab';fab.textContent='+';
  fab.setAttribute('aria-label',onIng?'Add ingredient':'Add recipe');
  fab.onclick=openAdd;
  scr.appendChild(fab);
}

function prepStats(scr,rows){
  const stats=document.createElement('div');stats.className='stats';
  rows.forEach(function(s){
    const d=document.createElement('div');d.className='stat';
    const l=document.createElement('div');l.className='stat-l';l.textContent=s.l;
    const v=document.createElement('div');v.className='stat-v';v.textContent=s.v;
    if(s.c){l.style.color=s.c;v.style.color=s.c;}
    d.appendChild(l);d.appendChild(v);stats.appendChild(d);
  });
  scr.appendChild(stats);
}

function renderPrepIngredients(scr){
  prepStats(scr,[
    {l:'Ingredients',v:S.ings.length,c:''},
    {l:'Low stock',v:lowIngs().length,c:'var(--wt)'},
    {l:'Out of stock',v:outIngs().length,c:'var(--dt)'}
  ]);

  const list=document.createElement('div');list.className='prep-list';

  // The list repaints on its own so typing in the box never loses focus —
  // a full render() would tear the input out of the DOM on every keystroke.
  const paint=function(){
    list.innerHTML='';
    const q=(S.prepSearch||'').trim().toLowerCase();
    const rows=S.ings.filter(function(i){
      if(q&&String(i.name||'').toLowerCase().indexOf(q)<0)return false;
      if(S.ingFilter==='low')return ingLevel(i)==='low';
      if(S.ingFilter==='out')return ingLevel(i)==='out';
      return true;
    });

    if(!rows.length){
      const em=document.createElement('div');em.className='prep-empty';
      if(!S.ings.length){
        em.innerHTML='<strong>No ingredients yet</strong>Add the raw stock you buy — coffee beans, milk, flour — then link it to products under Recipes so it comes off automatically with every sale.';
      } else {
        em.innerHTML='<strong>Nothing matches</strong>Try a different search or filter.';
      }
      list.appendChild(em);return;
    }

    rows.forEach(function(ing){
      const lvl=ingLevel(ing);
      const row=document.createElement('div');row.className='inv-row';

      const ic=document.createElement('div');ic.className='inv-ico';
      ic.textContent=(ing.unit||'ea').slice(0,4).toUpperCase();
      row.appendChild(ic);

      const info=document.createElement('div');info.className='inv-info';
      const nm=document.createElement('div');nm.className='inv-name';nm.textContent=ing.name;
      const sub=document.createElement('div');sub.className='inv-cat';
      const bits=[];
      if(+ing.low>0)bits.push('Alerts at '+ingQtyStr(ing.low,ing.unit));
      if(+ing.cost>0)bits.push(fmt(ing.cost)+' per '+(ing.unit||'unit'));
      const used=S.recipes.filter(function(r){return r.ingId===ing.id;}).length;
      bits.push(used===1?'used in 1 product':'used in '+used+' products');
      sub.textContent=bits.join(' · ');
      info.appendChild(nm);info.appendChild(sub);row.appendChild(info);

      const ir=document.createElement('div');ir.className='inv-r';
      const st=document.createElement('div');st.className='ing-stock';
      st.textContent=ingQtyStr(ing.stock,ing.unit);
      ir.appendChild(st);

      const badge=document.createElement('span');
      badge.className='badge '+(lvl==='out'?'b-out':lvl==='low'?'b-low':'b-ok');
      badge.textContent=lvl==='out'?'out':lvl==='low'?'low':'ok';
      ir.appendChild(badge);

      const acts=document.createElement('div');acts.className='acts';
      const adj=document.createElement('button');adj.className='act';adj.textContent='\u00b1';
      adj.title='Adjust stock';adj.setAttribute('aria-label','Adjust stock for '+ing.name);
      adj.onclick=function(){openModal({type:'ingAdjust',ingId:ing.id});};
      const ed=document.createElement('button');ed.className='act';ed.textContent='ED';
      ed.title='Edit ingredient';ed.setAttribute('aria-label','Edit '+ing.name);
      ed.onclick=function(){openModal({type:'ing',ing:JSON.parse(JSON.stringify(ing))});};
      acts.appendChild(adj);acts.appendChild(ed);ir.appendChild(acts);

      row.appendChild(ir);list.appendChild(row);
    });
  };

  const search=document.createElement('div');search.className='pos-search';
  const si=document.createElement('input');si.placeholder='Search ingredients...';
  si.value=S.prepSearch||'';si.setAttribute('aria-label','Search ingredients');
  si.oninput=function(){S.prepSearch=this.value;paint();};
  search.appendChild(si);scr.appendChild(search);

  const pills=document.createElement('div');pills.className='pos-cats';
  [{id:'all',lbl:'All'},{id:'low',lbl:'Low'},{id:'out',lbl:'Out'}].forEach(function(f){
    const c=document.createElement('button');
    c.className='cat'+(S.ingFilter===f.id?' on':'');
    c.textContent=f.lbl;
    c.onclick=function(){
      S.ingFilter=f.id;
      pills.querySelectorAll('.cat').forEach(function(x){x.classList.remove('on');});
      c.classList.add('on');
      paint();
    };
    pills.appendChild(c);
  });
  scr.appendChild(pills);

  paint();
  scr.appendChild(list);
}

function renderPrepRecipes(scr){

  const names=[];
  S.recipes.forEach(function(r){if(names.indexOf(r.prod)<0)names.push(r.prod);});
  names.sort(function(a,b){return String(a).localeCompare(String(b));});

  /* Products with no recipe lines at all. This screen used to list only the
     products that already had a recipe, so anything still waiting for one
     was invisible here — the one thing you actually come to this screen to
     find out. Not framed as an error: plenty of lines (a bottled drink, a
     pastry bought in) are sold from their own stock count and never need a
     recipe. */
  const missing=S.prods.filter(function(p){
    return !S.recipes.some(function(r){return r.prod===p.name;});
  }).slice().sort(function(a,b){
    return String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
  });

  let blocked=0;
  names.forEach(function(n){if(buildable(n)===0)blocked++;});

  prepStats(scr,[
    {l:'Products linked',v:names.length,c:''},
    {l:'No recipe',v:missing.length,c:missing.length?'var(--wt)':''},
    {l:'Recipe lines',v:S.recipes.length,c:''},
    {l:'Cannot make',v:blocked,c:blocked?'var(--dt)':''}
  ]);

  const list=document.createElement('div');list.className='prep-list';

  if(missing.length){
    const mg=document.createElement('div');mg.className='prep-grp';
    const mgn=document.createElement('div');mgn.className='prep-grp-n';
    mgn.textContent='Needs a recipe · '+missing.length;
    mg.appendChild(mgn);
    const mgy=document.createElement('span');mgy.className='prep-yield low';
    mgy.textContent='own stock';
    mgy.title='These products are not linked to any ingredient, so a sale takes nothing off ingredient stock. That is correct for anything bought in ready to sell.';
    mg.appendChild(mgy);
    list.appendChild(mg);

    missing.forEach(function(p){
      const line=document.createElement('div');line.className='prep-line';
      const ln=document.createElement('div');ln.className='prep-line-n';
      const t=document.createElement('div');t.textContent=p.name;
      ln.appendChild(t);
      const sub=document.createElement('div');sub.className='prep-line-s';
      sub.textContent=(p.cat||'Uncategorised')+' · '+fmt(p.price);
      ln.appendChild(sub);
      line.appendChild(ln);

      const addb=document.createElement('button');
      addb.className='act';          // same class the Edit buttons use
      addb.textContent='ADD';
      addb.title='Link an ingredient to '+p.name;
      addb.onclick=function(){openModal({type:'recipe',rec:null,prod:p.name});};
      line.appendChild(addb);
      list.appendChild(line);
    });
  }

  if(!names.length){
    const em=document.createElement('div');em.className='prep-empty';
    em.innerHTML=S.ings.length
      ? '<strong>No recipes yet</strong>A recipe says how much of an ingredient one sale uses — 18 g of beans per espresso, say. Add one and that stock comes off by itself at checkout.'
      : '<strong>Add ingredients first</strong>Recipes link a product to the raw stock it uses, so there needs to be at least one ingredient to point at.';
    list.appendChild(em);
    scr.appendChild(list);return;
  }

  names.forEach(function(nm){
    const can=buildable(nm);
    const known=S.prods.some(function(p){return p.name===nm;});

    const grp=document.createElement('div');grp.className='prep-grp';
    const gn=document.createElement('div');gn.className='prep-grp-n';gn.textContent=nm;
    grp.appendChild(gn);

    if(!known){
      const warn=document.createElement('span');warn.className='prep-yield out';
      warn.textContent='no such product';
      warn.title='No product is named "'+nm+'". Rename it here or in Inventory so they match.';
      grp.appendChild(warn);
    }
    const y=document.createElement('span');
    // null = every line on this product consumes nothing, so there is no
    // yield to state. Leave it neutral rather than claiming a healthy count.
    y.className='prep-yield'+(can===null?'':can===0?' out':can<=5?' low':' ok');
    y.textContent=can===null?'no yield set':'makes '+can;
    if(can===null)y.title='Every line on this recipe uses a quantity of zero.';
    grp.appendChild(y);
    list.appendChild(grp);

    recipesFor(nm).forEach(function(r){
      const ing=ingById(r.ingId);
      const line=document.createElement('div');line.className='prep-line';

      const ln=document.createElement('div');ln.className='prep-line-n';
      const t=document.createElement('div');
      t.textContent=ing?ing.name:'Missing ingredient';
      if(!ing)t.className='prep-line-miss';
      const s=document.createElement('div');s.className='prep-line-s';
      s.textContent=ing
        ? ingQtyStr(ing.stock,ing.unit)+' in stock'
        : 'This ingredient was deleted — remove the line or point it somewhere else.';
      ln.appendChild(t);ln.appendChild(s);line.appendChild(ln);

      const q=document.createElement('div');q.className='prep-line-q';
      q.textContent=ingQtyStr(r.qty,ing?ing.unit:'')+' each';
      line.appendChild(q);

      const acts=document.createElement('div');acts.className='acts';
      const ed=document.createElement('button');ed.className='act';ed.textContent='ED';
      ed.setAttribute('aria-label','Edit recipe line');
      ed.onclick=function(){openModal({type:'recipe',rec:JSON.parse(JSON.stringify(r))});};
      acts.appendChild(ed);line.appendChild(acts);

      list.appendChild(line);
    });
  });

  scr.appendChild(list);
}

/* ==================================================================== *
 * PAYMENT BREAKDOWN
 * Splits takings by how they were paid. Cash, GCash and Card are always
 * shown so the layout stays put between filters; credit and any legacy
 * tender only appear when there is something to report.
 * ==================================================================== */
/* Card was withdrawn as a tender option. It is deliberately NOT listed here
   any more, but it is not erased either: sales already taken on Card fall
   through to the "unrecognised method" pass at the bottom of methodRows(),
   so historic takings still appear and the totals still balance. Deleting it
   outright would have quietly dropped that money out of every report. */
const PAY_METHODS=[
  {id:'Cash', lbl:'Cash',  c:'var(--st)', always:true},
  {id:'GCash',lbl:'GCash', c:'var(--pt)', always:true},
  /* === NEW: Feature 2 — QR (GCash/Maya/InstaPay scan-to-pay). Listed here
     and every report that reads PAY_METHODS splits it out on its own row
     automatically: tallyByMethod(), methodRows(), the day summary and the
     history export all key off this array. It is NOT folded into GCash
     because the owner needs to reconcile the scanned QR account separately
     from GCash sent by transfer. === */
  {id:'QR',   lbl:'QR / InstaPay', c:'var(--ac)', always:true},
  {id:'Utang',lbl:'Credit',c:'var(--wt)', always:false, credit:true},
];

/* Voided sales are excluded — they took no money. Anything with an
   unrecognised method still gets counted rather than silently dropped. */
function tallyByMethod(txs){
  const t={};
  PAY_METHODS.forEach(function(p){t[p.id]={count:0,total:0};});
  (txs||[]).forEach(function(s){
    if(s.voided)return;
    const k=s.method||'Cash';
    if(!t[k])t[k]={count:0,total:0};
    t[k].count++;
    t[k].total+=(+s.total||0);
  });
  return t;
}

// Ordered list of the methods worth displaying for this set of sales.
function methodRows(tally){
  const rows=[];
  PAY_METHODS.forEach(function(p){
    if(p.always||tally[p.id].count>0)rows.push({...p,d:tally[p.id]});
  });
  Object.keys(tally).forEach(function(k){
    if(PAY_METHODS.some(function(p){return p.id===k;}))return;
    if(tally[k].count>0)rows.push({id:k,lbl:k,c:'var(--t2)',d:tally[k]});
  });
  return rows;
}

function renderPaySummary(scr,txs){
  const tally=tallyByMethod(txs);
  const rows=methodRows(tally);

  const grid=document.createElement('div');grid.className='paysum';
  rows.forEach(function(r){
    const cell=document.createElement('div');
    cell.className='paycell'+(r.credit?' credit':'');
    const l=document.createElement('div');l.className='paycell-l';
    l.style.color=r.c;l.textContent=r.lbl;
    const v=document.createElement('div');v.className='paycell-v';
    v.textContent=fmt(r.d.total);
    const nn=document.createElement('div');nn.className='paycell-n';
    nn.textContent=r.d.count+(r.d.count===1?' sale':' sales');
    cell.appendChild(l);cell.appendChild(v);cell.appendChild(nn);
    grid.appendChild(cell);
  });
  scr.appendChild(grid);

  // Spell out what the collected figure does and does not include.
  const credit=tally['Utang']?tally['Utang'].total:0;
  const collected=rows.reduce(function(a,r){return a+(r.credit?0:r.d.total);},0);
  const note=document.createElement('div');note.className='paysum-note';
  note.textContent=credit>0
    ? 'Collected '+fmt(collected)+' \u00b7 a further '+fmt(credit)+' is on credit and still owed.'
    : 'Collected '+fmt(collected)+' across '+rows.reduce(function(a,r){return a+r.d.count;},0)+' sales. Voided sales are excluded.';
  scr.appendChild(note);
}

// Compact one-line version used under each day heading.
function dayPayLine(txs){
  const tally=tallyByMethod(txs);
  const rows=methodRows(tally).filter(function(r){return r.d.count>0;});
  if(!rows.length)return null;
  const wrap=document.createElement('div');wrap.className='day-pay';
  rows.forEach(function(r){
    const s=document.createElement('span');
    s.textContent=r.lbl+' ';
    const b=document.createElement('b');b.style.color=r.c;b.textContent=fmt(r.d.total);
    s.appendChild(b);
    wrap.appendChild(s);
  });
  return wrap;
}

/* ==================================================================== *
 * CATEGORY BREAKDOWN
 *
 * Sale lines only ever stored name/qty/price, so the category has to be
 * recovered from the product list for anything sold before this build.
 * New sales now carry their own `cat` (see the checkout handlers), which
 * keeps the figures right even after a product is renamed or retired.
 * ==================================================================== */
function catOfSaleItem(it){
  if(it&&it.cat)return it.cat;
  const p=(S.prods||[]).filter(function(x){return x.name===(it&&it.name);})[0];
  return (p&&p.cat)||'Uncategorised';
}

// {cat:{qty,total}} for a set of sales. Voided sales took no money.
function tallyByCategory(txs){
  const map={};
  (txs||[]).forEach(function(s){
    if(s.voided)return;
    (s.items||[]).forEach(function(it){
      const c=catOfSaleItem(it);
      if(!map[c])map[c]={qty:0,total:0};
      map[c].qty+=(+it.qty||0);
      map[c].total+=(+it.price||0)*(+it.qty||0);
    });
  });
  return map;
}

/* Builds the "Sales by category" panel. `title` lets the same builder serve
   both the period summary and the smaller per-day block. */
function catBreakdownBox(txs,title){
  const map=tallyByCategory(txs);
  const rows=Object.entries(map).sort(function(a,b){return b[1].total-a[1].total;});
  if(!rows.length)return null;
  const box=document.createElement('div');
  box.style.cssText='background:var(--bg2);border:1px solid var(--b1);border-radius:12px;padding:10px 12px;margin-bottom:12px';
  const hd=document.createElement('div');
  hd.style.cssText='font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;justify-content:space-between';
  hd.innerHTML='<span>'+esc(title||'Sales by category')+'</span>'
    +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center"><span>Qty</span><span style="text-align:right">Total</span></span>';
  box.appendChild(hd);
  const grand=rows.reduce(function(a,r){return a+r[1].total;},0);
  rows.forEach(function(e){
    const name=e[0],d=e[1];
    const pct=grand>0?Math.round(d.total/grand*100):0;
    const row=document.createElement('div');
    row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b1);font-size:calc(13px * var(--fs,1))';
    row.innerHTML='<span style="color:var(--t1);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name)
      +' <span style="color:var(--t3);font-weight:600;font-size:calc(11px * var(--fs,1))">'+pct+'%</span></span>'
      +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center;flex-shrink:0">'
      +'<span style="color:var(--t2);font-weight:700;text-align:center">'+d.qty+'</span>'
      +'<span style="color:var(--ac);font-weight:700;text-align:right">'+fmt(d.total)+'</span></span>';
    box.appendChild(row);
  });
  const totRow=document.createElement('div');
  totRow.style.cssText='display:flex;justify-content:space-between;padding:6px 0 0;font-size:calc(13px * var(--fs,1));font-weight:800';
  const totQty=rows.reduce(function(a,r){return a+r[1].qty;},0);
  totRow.innerHTML='<span style="color:var(--t1)">Total ('+rows.length+' categor'+(rows.length===1?'y':'ies')+')</span>'
    +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;flex-shrink:0">'
    +'<span style="color:var(--t2);font-weight:800;text-align:center">'+totQty+'</span>'
    +'<span style="color:var(--ac);font-weight:800;text-align:right">'+fmt(grand)+'</span></span>';
  box.appendChild(totRow);
  return box;
}

/* A date input plus a Clear button, shared by History and Expenses. Picking a
   day overrides the range pills; clearing it hands control back to them. */
function dayPickerRow(getVal,setVal){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap';
  const lbl=document.createElement('label');
  lbl.style.cssText='font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px';
  lbl.textContent='Pick a date';
  const inp=document.createElement('input');
  inp.type='date';
  inp.value=getVal()||'';
  // Future days hold nothing, so they are not offerable.
  inp.max=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  inp.style.cssText='flex:1;min-width:140px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(14px * var(--fs,1));outline:none';
  inp.onchange=function(){setVal(inp.value||'');render();};
  lbl.setAttribute('for','dayPick');inp.id='dayPick';
  wrap.appendChild(lbl);wrap.appendChild(inp);
  if(getVal()){
    const clr=document.createElement('button');
    clr.className='abtn';clr.style.cssText='font-size:calc(12px * var(--fs,1));padding:8px 14px';
    clr.textContent='Clear';
    clr.onclick=function(){setVal('');render();};
    wrap.appendChild(clr);
  }
  return wrap;
}

// A local YYYY-MM-DD key. toISOString() would shift the day across UTC.
function dayKey(d){
  const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}

function renderHist(scr){
  const filt=S.sales.filter(s=>{
    const d=new Date(s.date);
    // An explicit date beats the range pills.
    if(S.histDate)return dayKey(d)===S.histDate;
    if(S.histFilter==='today')return d.toDateString()===new Date().toDateString();
    if(S.histFilter==='week'){const w=new Date();w.setDate(w.getDate()-7);return d>=w;}
    if(S.histFilter==='month'){const m=new Date();m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
  const totalAmt=filt.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0);

  const hd=document.createElement('div');hd.className='panel-hd';
  const hdTitle=document.createElement('h2');hdTitle.textContent='History';hd.appendChild(hdTitle);
  const expBtn=document.createElement('button');expBtn.className='abtn';expBtn.style.cssText='font-size:calc(12px * var(--fs,1));padding:7px 12px';expBtn.textContent='CSV';expBtn.onclick=function(){exportCSV(filt);};hd.appendChild(expBtn);
  const hdTot=document.createElement('div');hdTot.style.cssText='text-align:right';
  hdTot.innerHTML='<div style="font-size:calc(16px * var(--fs,1));font-weight:800">'+fmt(totalAmt)+'</div><div style="font-size:calc(11px * var(--fs,1));color:var(--t3)">'+filt.filter(s=>!s.voided).length+' transactions</div>';
  hd.appendChild(hdTot);
  scr.appendChild(hd);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'all',lbl:'All time'},{id:'today',lbl:'Today'},{id:'week',lbl:'This week'},{id:'month',lbl:'This month'}].forEach(f=>{
    // Greyed out while a specific date is active, so it is obvious which
    // control is actually driving the list.
    const p=document.createElement('div');p.className='hpill'+((!S.histDate&&S.histFilter===f.id)?' on':'');p.textContent=f.lbl;
    if(S.histDate)p.style.opacity='0.45';
    p.onclick=function(){S.histFilter=f.id;S.histDate='';render();};
    bar.appendChild(p);

  scr.appendChild(bar);

  scr.appendChild(dayPickerRow(function(){return S.histDate;},function(v){S.histDate=v;}));

  if(S.histDate){
    const noteRow=document.createElement('div');
    noteRow.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;flex-wrap:wrap';
    const note=document.createElement('div');
    note.style.cssText='font-size:calc(12px * var(--fs,1));color:var(--t3);font-weight:600;flex:1;min-width:150px';
    note.textContent='Showing '+new Date(S.histDate+'T00:00:00').toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    noteRow.appendChild(note);
    /* Only offered once a single date is in view, so there is no way to fire
       it at a range by accident. The modal still asks for the password. */
    if(filt.length>0){
      const dbtn=document.createElement('button');
      dbtn.className='abtn';
      dbtn.style.cssText='font-size:calc(12px * var(--fs,1));padding:8px 13px;color:var(--dt)';
      dbtn.textContent='Delete this date';
      dbtn.onclick=function(){openModal({type:'deleteDaySales',date:S.histDate});};
      noteRow.appendChild(dbtn);
    }
    scr.appendChild(noteRow);
  }

  renderPaySummary(scr,filt);

  /* Category totals for whatever period is on screen. Wrapped in the same
     padding as the lists below so it lines up with them. */
  const catWrap=document.createElement('div');catWrap.style.cssText='padding:0 14px';
  const catBox=catBreakdownBox(filt,'Sales by category');
  if(catBox)catWrap.appendChild(catBox);
  else{
    const em=document.createElement('div');
    em.style.cssText='padding:10px 2px 14px;font-size:calc(12.5px * var(--fs,1));color:var(--t3)';
    em.textContent='No category sales in this period.';
    catWrap.appendChild(em);
  }
  scr.appendChild(catWrap);

  const byDay={};
  filt.slice().reverse().forEach(s=>{const k=new Date(s.date).toDateString();if(!byDay[k])byDay[k]=[];byDay[k].push(s);});

  const list=document.createElement('div');list.className='hist-list';
  if(Object.keys(byDay).length===0){const e=document.createElement('div');e.className='hist-empty';e.textContent='No transactions yet.';list.appendChild(e);}
  Object.entries(byDay).forEach(([ds,txs])=>{
    const today=new Date().toDateString(),yest=new Date(Date.now()-86400000).toDateString();
    const lbl=ds===today?'Today':ds===yest?'Yesterday':new Date(ds).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
    const dayTot=txs.reduce((a,s)=>a+s.total,0);
    const dl=document.createElement('div');dl.className='day-lbl';dl.textContent=lbl;list.appendChild(dl);
    const ds2=document.createElement('div');ds2.className='day-sub';ds2.textContent=txs.length+' transaction'+(txs.length!==1?'s':'')+' - '+fmt(dayTot);list.appendChild(ds2);
    const dayPay=dayPayLine(txs);
    if(dayPay)list.appendChild(dayPay);
    txs.forEach(s=>{
      const card=document.createElement('div');card.className='txcard'+(s.voided?' voided':'');
      /* The method lands in a class attribute as well as in text. Stripped to
         letters and digits for the class — a method containing a quote would
         otherwise break out of the attribute — and escaped for the label. */
      const mRaw=s.voided?'Voided':(s.method||'Cash');
      const mCls=String(mRaw).replace(/[^A-Za-z0-9]/g,'');
      card.innerHTML='<div class="txl"><div class="txid">'+esc(s.id)+(s.cashier?' · '+esc(s.cashier):'')+'</div><div class="txitems">'+s.items.map(i=>esc(arroyoItemName(i))+' x'+i.qty).join(', ')+'</div><div class="txtime">'+new Date(s.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div><div class="txr"><div class="txtot">'+fmt(s.total)+'</div><div class="txm m'+mCls+'">'+esc(s.voided?'VOID':mRaw)+'</div></div>';
      card.onclick=function(){openModal({type:'viewtx',tx:s});};
      list.appendChild(card);
    });
    // Per-day category totals, sitting above the item-level detail.
    const dayCat=catBreakdownBox(txs,'Category totals · '+lbl);
    if(dayCat)list.appendChild(dayCat);

    // Items sold breakdown for this day
    const validTxs=txs.filter(s=>!s.voided);
    if(validTxs.length>0){
      const itemMap={};
      validTxs.forEach(s=>s.items.forEach(it=>{
        if(!itemMap[it.name])itemMap[it.name]={qty:0,total:0};
        itemMap[it.name].qty+=it.qty;
        itemMap[it.name].total+=it.price*it.qty;
      }));
      const sorted=Object.entries(itemMap).sort((a,b)=>b[1].qty-a[1].qty);
      const itBox=document.createElement('div');
      itBox.style.cssText='background:var(--bg2);border:1px solid var(--b1);border-radius:12px;padding:10px 12px;margin-bottom:12px';
      const itHd=document.createElement('div');
      itHd.style.cssText='font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;justify-content:space-between';
      itHd.innerHTML='<span>Items sold</span><span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center"><span>Qty</span><span style="text-align:right">Total</span></span>';
      itBox.appendChild(itHd);
      sorted.forEach(([name,d])=>{
        const row=document.createElement('div');
        row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b1);font-size:calc(13px * var(--fs,1))';
        row.innerHTML='<span style="color:var(--t1);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name)+'</span>'
          +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center;flex-shrink:0">'
          +'<span style="color:var(--t2);font-weight:700;text-align:center">'+d.qty+'</span>'
          +'<span style="color:var(--ac);font-weight:700;text-align:right">'+fmt(d.total)+'</span></span>';
        itBox.appendChild(row);
      });
      const totRow=document.createElement('div');
      totRow.style.cssText='display:flex;justify-content:space-between;padding:6px 0 0;font-size:calc(13px * var(--fs,1));font-weight:800';
      const totalItemQty=sorted.reduce((a,[,d])=>a+d.qty,0);
      const validDayTot=validTxs.reduce((a,s)=>a+s.total,0);
      totRow.innerHTML='<span style="color:var(--t1)">Total items sold</span>'
        +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;flex-shrink:0">'
        +'<span style="color:var(--t2);font-weight:800;text-align:center">'+totalItemQty+'</span>'
        +'<span style="color:var(--ac);font-weight:800;text-align:right">'+fmt(validDayTot)+'</span></span>';
      itBox.appendChild(totRow);
      list.appendChild(itBox);
    }
  });
  scr.appendChild(list);
}

/* One lock screen serves Admin, Inventory and Preparation. Everything the
   three differ on is passed in; the password checked is always S.pass. */
function renderLock(scr,opts){
  opts=opts||{};
  const badge=opts.badge||'ADMIN';
  const title=opts.title||'Admin access';
  const sub=opts.sub||'Enter your password to continue.';
  const onUnlock=opts.onUnlock||function(){S.locked=false;render();};

  const w=document.createElement('div');w.className='lock-wrap';
  const card=document.createElement('div');card.className='lock-card';
  const bd=document.createElement('div');bd.className='lock-ico';bd.textContent=badge;
  const h=document.createElement('h2');h.style.cssText='font-size:calc(20px * var(--fs,1));font-weight:700;color:#f0f0ec';h.textContent=title;
  const p=document.createElement('p');p.style.cssText='font-size:calc(14px * var(--fs,1));color:#a8a8a2';p.textContent=sub;
  card.appendChild(bd);card.appendChild(h);card.appendChild(p);

  const inp=document.createElement('input');inp.className='lock-inp';inp.type='password';inp.placeholder='Password';inp.maxLength=30;
  inp.setAttribute('aria-label',title);
  const err=document.createElement('div');err.className='lock-err';err.setAttribute('role','alert');
  const btn=document.createElement('button');btn.className='lock-btn';btn.textContent='Unlock';
  const tryUnlock=function(){
    var wait=lockWaitMs('admin');
    if(wait>0){lockCountdown('admin',err,btn);return;}
    if(inp.value===S.pass){lockClear('admin');onUnlock();}
    else{
      var w=lockFail('admin');
      inp.value='';inp.focus();
      if(w>0)lockCountdown('admin',err,btn);
      else err.textContent='Incorrect password.';
    }
  };
  btn.onclick=tryUnlock;
  inp.onkeydown=function(e){if(e.key==='Enter')tryUnlock();};
  card.appendChild(inp);card.appendChild(err);card.appendChild(btn);

  // A bad custom theme can leave the app unreadable, and Admin is where the
  // colour is changed — so the escape hatch belongs on the Admin lock only.
  if(opts.showThemeReset){
    const resetThemeBtn=document.createElement('button');
    resetThemeBtn.style.cssText='width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#666660;font-size:calc(12px * var(--fs,1));cursor:pointer;margin-top:-4px';
    resetThemeBtn.textContent='Reset to dark theme';
    resetThemeBtn.onclick=function(){S.themeColor='#111110';applyTheme('#111110');save();saveSettingsToCloud();toast('Theme reset to dark');};
    card.appendChild(resetThemeBtn);
  }
  w.appendChild(card);scr.appendChild(w);
  setTimeout(function(){try{inp.focus();}catch(e){}},60);
}

    line.textContent=(ok===true?'✓ ':ok===false?'✗ ':'→ ')+msg;
    syncLog.appendChild(line);syncLog.scrollTop=syncLog.scrollHeight;
  }
  const syncBtn=document.createElement('button');syncBtn.className='abtn';syncBtn.textContent='Sync now';
  syncBtn.onclick=async function(){
    syncLog.innerHTML='';syncLog.style.display='block';
    syncBtn.textContent='Syncing...';syncBtn.style.opacity='0.6';
    logSync('Starting sync...');
    // Check CLOUD state
    logSync('Token: '+(CLOUD.token?'present ('+CLOUD.token.slice(0,12)+'...)':'MISSING'),!!CLOUD.token);
    logSync('BizId: '+(CLOUD.bizId||'MISSING'),!!CLOUD.bizId);

    const offlineCount=queueCount();
    if(offlineCount>0)logSync('Offline queue: '+offlineCount+' item(s) waiting to push');
    if(!CLOUD.token||!CLOUD.bizId){
      logSync('Cannot sync — not connected. Sign out and sign in again.',false);
      toast('Not connected. Sign out and sign in again.');
      syncBtn.textContent='Sync now';syncBtn.style.opacity='1';return;
    }
    // Ensure session is valid — auto-refresh or show inline re-auth (no sign out needed)

    logSync('Session OK',true);
    // Flush offline queue first — push any sales/expenses recorded while offline
    const pending=queueCount();
    if(pending>0){
      logSync('Found '+pending+' offline item(s) to push...');
      await flushSyncQueue(logSync);

      logSync('No offline items pending');

    // Push products

    // Push settings

    log('=== UPDATE SERVER ===');
    try{

function renderModal(app){

      // Quick buttons
      const qg=document.createElement('div');qg.className='qgrid';
      const exact=Math.ceil(tot());

      const r100=Math.ceil(tot()/100)*100;
      const r500=Math.ceil(tot()/500)*500;
      const r1000=Math.ceil(tot()/1000)*1000;
      const sugg=[...new Set([exact,r50,r100,r500,r1000].filter(v=>v>=tot()))].slice(0,4);

      const exactBtn=document.createElement('button');exactBtn.className='qbtn exact';exactBtn.textContent='Exact - '+fmt(tot());
      exactBtn.onclick=function(){cashInp.value=tot().toFixed(2);cashInp.dispatchEvent(new Event('input'));};
      qg.appendChild(exactBtn);

      [{add:50},{add:100},{add:500},{add:1000},{add:0,lbl:'Clear'}].forEach(q=>{
        const b=document.createElement('button');b.className='qbtn';b.textContent=q.lbl||('+'+q.add.toLocaleString());
        b.onclick=function(){
          if(q.add===0){cashInp.value='';cashInp.dispatchEvent(new Event('input'));}

        };
        qg.appendChild(b);
      });
      body.appendChild(qg);

      // Change display
      const changeBox=document.createElement('div');changeBox.className='change-box';
      const changeL=document.createElement('div');changeL.className='change-l';
      const changeLbl=document.createElement('div');changeLbl.className='change-lbl';changeLbl.textContent='Change';
      const changeVal=document.createElement('div');changeVal.className='change-val';changeVal.id='changeVal';
      changeVal.textContent=change>=0?fmt(change):'--';
      changeVal.style.color=change>=0?'var(--st)':'var(--dt)';
      changeL.appendChild(changeLbl);changeL.appendChild(changeVal);
      const changeR=document.createElement('div');changeR.className='change-r';
      changeR.innerHTML='<div class="change-lbl">Total</div><div class="total-val">'+fmt(tot())+'</div>';
      changeBox.appendChild(changeL);changeBox.appendChild(changeR);body.appendChild(changeBox);

      // Confirm button
      const confirmBtn=document.createElement('button');
      confirmBtn.className='confirm-btn'+(ct<tot()?' disabled':'');
      confirmBtn.textContent=ct>=tot()?'Confirm sale':'Enter cash amount';
      body.appendChild(confirmBtn);

      // Receipt
      const det=document.createElement('details');
      const sum=document.createElement('summary');sum.style.cssText='font-size:calc(12px * var(--fs,1));color:var(--t3);cursor:pointer;padding:8px 0;text-align:center;list-style:none';sum.textContent='Show receipt preview';
      const rbox=document.createElement('div');rbox.className='rbox';rbox.style.marginTop='8px';rbox.id='receiptBox';rbox.textContent=receiptStr(m.method,id,'');
      det.appendChild(sum);det.appendChild(rbox);body.appendChild(det);

      cancelBtn.onclick=closeModal;body.appendChild(cancelBtn);

      setTimeout(()=>cashInp.focus(),100);

      confirmBtn.onclick=function(){
        /* v7.7.1 FIX: there was no double-submit guard here. The only check
           was `S.cashTendered<tot()`, and it inverts the moment the first
           click clears the cart: 0 < 0 is false, so a fast double-tap sailed
           through and recorded a SECOND sale with no items and a zero total.
           The database was protected from a double deduction by stock_ledger,
           but nothing stopped the phantom row. Three guards now: a busy flag,
           the button disabling itself, and an empty-cart test. */
        if(confirmBtn.dataset.busy==='1')return;
        if(!S.cart.length){toast('Cart is empty');return;}
        if(S.cashTendered<tot()&&!S.chargeToUtang)return;

        /* Record the delta actually applied on the matching sale line, so a

        const cartCopy=[...S.cart];
        const capturedCash=S.cashTendered;
        if(typeof QUEUE_CFG!=='undefined'&&QUEUE_CFG.enabled){tx.queueNo=S.pendingQueueNo||0;tx.queueStatus='waiting';tx.queueDay=(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();}S.sales.push(tx);S.salesTotal+=tot();S.cart=[];S.disc=0;S.discType='%';S.cashTendered=0;S.cartOpen=false;S.pendingQueueNo=0;if(typeof __qzBadge==='function')__qzBadge();
        S.selectedCustomer=null;S.chargeToUtang=false;
        save();syncSaleToCloud(tx);recordCustomerSale(tx);tx.ingDeltas=consumeIngredients(cartCopy,-1);save();pushProductStock(cartCopy);
        closeModal();

      body.appendChild(totD);
      /* === NEW: Feature 2 — the QR itself. Rendered between the total and

      if(m.method==='QR'){
        const qrBox=document.createElement('div');

          +'flex-direction:column;align-items:center;gap:8px;margin-top:2px';

    const box2=document.createElement('div');

    b2h.textContent='Sales this shift · '+(r.txCount||0)+' transaction'+((r.txCount||0)===1?'':'s');
    box2.appendChild(b2h);
    box2.appendChild(drawerRow('Cash',fmt(r.cashSales||0),{color:'var(--st)'}));
    if(r.gcashSales>0)box2.appendChild(drawerRow('GCash',fmt(r.gcashSales),{color:'var(--pt)'}));
    /* NEW: Feature 2 — older shift records have no qrSales, so this row is
       simply absent for shifts closed before this version. */
    if(r.qrSales>0)box2.appendChild(drawerRow('QR / InstaPay',fmt(r.qrSales),{color:'var(--ac)'}));
    if(r.creditSales>0)box2.appendChild(drawerRow('Credit',fmt(r.creditSales),{color:'var(--wt)'}));
    if(r.otherSales>0)box2.appendChild(drawerRow('Other',fmt(r.otherSales),{color:'var(--t2)'}));
    box2.appendChild(drawerRow('Total sales',fmt(r.totalSales||0),{big:true,rule:true,color:'var(--ac)'}));
    body.appendChild(box2);

    if(r.note||r.closeNote){
      const nb=document.createElement('div');
      nb.style.cssText='margin-top:10px;font-size:calc(12.5px * var(--fs,1));color:var(--t2);line-height:1.6';
      nb.textContent=[r.note?'Open: '+r.note:'',r.closeNote?'Close: '+r.closeNote:''].filter(Boolean).join(' · ');
      body.appendChild(nb);
    }
    if(!r.cloudSynced){
      const sn=document.createElement('div');
      sn.style.cssText='margin-top:10px;font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.5';
      sn.textContent='Held on this device only. It will be retried the next time the cloud is reachable.';
      body.appendChild(sn);
    }
    const btns=document.createElement('div');btns.className='mbtns';
    const cl=document.createElement('button');cl.className='mpri';cl.textContent='Close';cl.onclick=closeModal;
    btns.appendChild(cl);body.appendChild(btns);

  } else if(m.type==='openShift'){
    /* Start of shift: count the float. Nothing else happens until this is
       entered, so every shift has a baseline to reconcile against. */
    const c=m.cashier||S.activeCashier||{name:'Cashier'};
    body.innerHTML='<div class="mbadge">Check in</div><div class="mtitle">Starting cash on hand</div>'
      +'<p style="font-size:calc(13.5px * var(--fs,1));color:var(--t2);line-height:1.6">Count the money in the drawer now, '
      +esc(c.name)+'. This is your float — the end-of-shift check measures the drawer against it.</p>';
    const mf=document.createElement('div');mf.className='mf';
    mf.innerHTML='<label>Cash on hand (PHP)</label>';
    const fi=document.createElement('input');fi.id='sfFloat';fi.type='number';fi.min='0';fi.step='any';
    fi.inputMode='decimal';fi.placeholder='0.00';
    mf.appendChild(fi);
    const fh=document.createElement('div');fh.style.cssText='font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.5';
    fh.textContent='Enter 0 if you are starting with an empty drawer.';
    mf.appendChild(fh);body.appendChild(mf);

    const nf=document.createElement('div');nf.className='mf';nf.style.marginTop='12px';
    nf.innerHTML='<label>Note (optional)</label>';
    const ni=document.createElement('input');ni.id='sfNote';ni.type='text';ni.placeholder='e.g. handed over by Ana';
    nf.appendChild(ni);body.appendChild(nf);

    const btns=document.createElement('div');btns.className='mbtns';
    const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=closeModal;
    const go=document.createElement('button');go.className='mpri';go.textContent='Start shift';
    go.onclick=function(){
      /* v7.7.4: no double-submit guard. Two fast taps ran S.shiftNid++
         twice and fired two cloud POSTs; the second was refused by
         shifts_one_open_per_cashier, so the till reported a started shift
         the database did not have. */
      if(go.dataset.busy==='1')return;
      const raw=(document.getElementById('sfFloat')||{}).value;
      const v=parseFloat(raw);
      // An empty box is a genuine mistake, distinct from a deliberate zero.
      if(raw===''||raw===undefined||isNaN(v)||v<0){toast('Enter the cash you are starting with (0 is allowed)');return;}
      go.dataset.busy='1';go.disabled=true;
      const now=new Date().toISOString();
      S.openShift={
        id:S.shiftNid++,cashier:c.name,cashierId:c.id!==undefined?c.id:null,
        /* S.shiftNid is a per-device counter, so two tills both reach shift 3.
           Sales carry this uid instead, which is unique across devices. */
        shiftUid:c.name+'#'+now,
        supaId:c.supaId||null,startedAt:now,openingFloat:Math.round(v*100)/100,
        note:((document.getElementById('sfNote')||{}).value||'').trim(),endedAt:null
      };
      S.activeCashier=c;S.shiftStart=now;S.alertDismissed=false;
      save();sessionWrite();closeModal();
      /* v7.5 FIX: starting a shift and clocking in were unrelated actions, so
         the Dashboard's hours only ever showed what somebody remembered to
         tap on the Attendance tab. Opening the drawer now clocks the cashier
         in, and the open shift itself is written up so the back office can
         see a drawer in progress rather than only closed ones. Both are
         queued if the till is offline. */
      /* v7.7.1 FIX: these two were fired and forgotten, and the toast claimed
         "clocked in" whether or not either landed. Awaited now, and the
         message reflects the result. The drawer itself is never blocked by a
         failed upload - the till has to keep selling - but the cashier is told
         when the record is only local. */
      (async function(){
        var a=await attClockIn(c);
        var b=await pushOpenShiftToCloud(S.openShift);
        if(b&&b.duplicate){
          toast('Shift started locally — '+c.name+' already has an open drawer on another till');
        } else if((a&&a.queued)||(b&&b.queued)){
          toast('Shift started · float '+fmt(v)+' · clock-in saved, will sync');
        } else {
          toast('Shift started · float '+fmt(v)+' · clocked in');
        }
        render();
      })();
    };
    fi.onkeydown=function(e){if(e.key==='Enter')go.onclick();};
    btns.appendChild(cancel);btns.appendChild(go);body.appendChild(btns);
    setTimeout(function(){try{document.getElementById('sfFloat').focus();}catch(e){}},100);

  } else if(m.type==='closeShift'){
    /* End of shift: the sales for the shift are shown beside the drawer maths
       so the counted cash can be lined up against what was actually sold. */
    const sh=S.openShift;
    if(!sh){body.innerHTML='<div class="mtitle">No open shift</div>';
      const b2=document.createElement('div');b2.className='mbtns';
      const ok2=document.createElement('button');ok2.className='mpri';ok2.textContent='Close';ok2.onclick=closeModal;
      b2.appendChild(ok2);body.appendChild(b2);
    } else {
    let bd=shiftSalesBreakdown(sh);
    const autoPaid=shiftPaidOut(sh);
    body.innerHTML='<div class="mbadge">Check out</div><div class="mtitle">Count the drawer</div>';

    const meta=document.createElement('div');
    meta.style.cssText='font-size:calc(12px * var(--fs,1));color:var(--t3);line-height:1.6;margin-bottom:4px';
    meta.textContent=sh.cashier+' · started '+new Date(sh.startedAt).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    body.appendChild(meta);

    // Sales for the shift, so the drawer can be read against the takings.
    const sales=document.createElement('div');
    sales.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:12px;padding:11px 13px;margin:8px 0';
    /* Redrawable, so that if bd is refreshed at commit time the panel does
       not keep showing the figures it was first built with. */
    const fillSales=function(){
      sales.innerHTML='';
      const sHd=document.createElement('div');
      sHd.style.cssText='font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px';
      sHd.textContent='Sales this shift · '+bd.count+' transaction'+(bd.count===1?'':'s');
      sales.appendChild(sHd);
      sales.appendChild(drawerRow('Cash',fmt(bd.cash),{color:'var(--st)'}));
      if(bd.gcash>0)sales.appendChild(drawerRow('GCash (not in drawer)',fmt(bd.gcash),{color:'var(--pt)'}));
      if(bd.qr>0)sales.appendChild(drawerRow('QR / InstaPay (not in drawer)',fmt(bd.qr),{color:'var(--ac)'}));   /* NEW: Feature 2 */
      if(bd.credit>0)sales.appendChild(drawerRow('Credit (not in drawer)',fmt(bd.credit),{color:'var(--wt)'}));
      if(bd.other>0)sales.appendChild(drawerRow('Other (not in drawer)',fmt(bd.other),{color:'var(--t2)'}));
      sales.appendChild(drawerRow('Total sales',fmt(bd.total),{big:true,rule:true,color:'var(--ac)'}));
      if(bd.voided>0){
        const vn=document.createElement('div');
        vn.style.cssText='font-size:calc(11px * var(--fs,1));color:var(--t3);padding-top:6px';
        vn.textContent=bd.voided+' voided sale'+(bd.voided===1?'':'s')+' excluded.';
        sales.appendChild(vn);
      }
    };
    fillSales();
    body.appendChild(sales);

    // Itemized expenses during this shift
    const shiftFrom=new Date(sh.startedAt).getTime();
    const shiftTo=sh.endedAt?new Date(sh.endedAt).getTime():Date.now();
    const shiftExps=(S.expenses||[]).filter(function(e){
      const t=new Date(e.date).getTime();
      return !isNaN(t)&&t>=shiftFrom&&t<=shiftTo;
    });

    if(shiftExps.length>0){
      const ef=document.createElement('div');
      ef.style.cssText='background:var(--wg);border:1.5px solid var(--wt);border-radius:12px;padding:11px 13px;margin:8px 0';
      const eh=document.createElement('div');
      eh.style.cssText='font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--wt);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px';
      eh.textContent='Expenses this shift (deducted from drawer)';
      ef.appendChild(eh);
      shiftExps.forEach(function(e){
        const er=document.createElement('div');
        er.style.cssText='display:flex;justify-content:space-between;align-items:center;font-size:calc(12.5px * var(--fs,1));padding:3px 0;border-bottom:1px solid rgba(122,78,16,0.15)';
        const el=document.createElement('span');
        el.style.cssText='color:var(--t2);flex:1;padding-right:8px';
        el.textContent=e.name+(e.note?' · '+e.note:'');
        const ev=document.createElement('span');
        ev.style.cssText='font-weight:700;color:var(--wt);flex-shrink:0';
        ev.textContent='− '+fmt(+e.amount||0);
        er.appendChild(el);er.appendChild(ev);ef.appendChild(er);
      });
      const et=document.createElement('div');
      et.style.cssText='display:flex;justify-content:space-between;font-size:calc(13px * var(--fs,1));font-weight:800;color:var(--wt);padding-top:7px;margin-top:3px;border-top:1.5px solid var(--wt)';
      et.innerHTML='<span>Total expenses</span><span>− '+fmt(autoPaid)+'</span>';
      ef.appendChild(et);
      body.appendChild(ef);
    }

    // Paid out — prefilled from expenses, cashier can adjust if some weren't from drawer
    const pf=document.createElement('div');pf.className='mf';pf.style.marginTop='4px';
    pf.innerHTML='<label>Cash paid out of drawer (PHP)</label>';
    const pi=document.createElement('input');pi.id='csPaid';pi.type='number';pi.min='0';pi.step='any';
    pi.inputMode='decimal';pi.value=autoPaid?String(Math.round(autoPaid*100)/100):'0';
    pf.appendChild(pi);
    const ph=document.createElement('div');ph.style.cssText='font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.5';
    ph.textContent=autoPaid>0
      ?'Pre-filled from '+fmt(autoPaid)+' of expenses above. Adjust if any were not paid from the drawer.'
      :'No expenses logged this shift. Enter manually if cash was paid out.';
    pf.appendChild(ph);body.appendChild(pf);

    // Expected cash — recomputed live
    const calc=document.createElement('div');
    calc.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:12px;padding:11px 13px;margin:12px 0';
    body.appendChild(calc);

    const cf=document.createElement('div');cf.className='mf';
    cf.innerHTML='<label>Counted cash on hand now (PHP)</label>';
    const ci=document.createElement('input');ci.id='csCount';ci.type='number';ci.min='0';ci.step='any';
    ci.inputMode='decimal';ci.placeholder='0.00';
    cf.appendChild(ci);body.appendChild(cf);

    const verdict=document.createElement('div');
    verdict.style.cssText='margin-top:12px;padding:13px;border-radius:12px;text-align:center';
    body.appendChild(verdict);

    const nf2=document.createElement('div');nf2.className='mf';nf2.style.marginTop='12px';
    nf2.innerHTML='<label>Note (optional)</label>';
    const ni2=document.createElement('input');ni2.id='csNote';ni2.type='text';ni2.placeholder='e.g. 20 short, checked twice';
    nf2.appendChild(ni2);body.appendChild(nf2);

    const repaint=function(){
      const paid=parseFloat(pi.value)||0;
      const exp=expectedDrawer(sh,paid);
      calc.innerHTML='';
      const ch=document.createElement('div');
      ch.style.cssText='font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px';
      ch.textContent='Expected cash in drawer';
      calc.appendChild(ch);
      calc.appendChild(drawerRow('Opening float',fmt(sh.openingFloat||0)));
      calc.appendChild(drawerRow('+ Cash sales',fmt(bd.cash),{color:'var(--st)'}));
      calc.appendChild(drawerRow('− Expenses / paid out',fmt(paid),{color:paid>0?'var(--wt)':'var(--t2)'}));
      calc.appendChild(drawerRow('= Expected cash',fmt(exp),{big:true,rule:true,color:'var(--ac)'}));

      const raw=ci.value;
      if(raw===''||raw===undefined||isNaN(parseFloat(raw))){
        verdict.style.background='var(--bg2)';verdict.style.border='1px solid var(--b1)';
        verdict.innerHTML='<div style="font-size:calc(12.5px * var(--fs,1));color:var(--t3)">Enter the counted cash to see short or over.</div>';
        return;
      }
      const counted=parseFloat(raw);
      const v=Math.round((counted-exp)*100)/100;
      const vl=varianceLabel(v);
      verdict.style.background='var(--bg2)';verdict.style.border='1.5px solid '+vl.color;
      verdict.innerHTML='<div style="font-size:calc(19px * var(--fs,1));font-weight:800;color:'+vl.color+'">'+esc(vl.text)+'</div>'
        +'<div style="font-size:calc(11.5px * var(--fs,1));color:var(--t3);margin-top:4px;line-height:1.5">'+esc(vl.detail)+'</div>';
    };
    pi.oninput=repaint;ci.oninput=repaint;repaint();

    const btns=document.createElement('div');btns.className='mbtns';
    const cancel=document.createElement('button');cancel.textContent='Back';cancel.onclick=closeModal;
    const fin=document.createElement('button');fin.className='mpri';fin.textContent='End shift';
    fin.onclick=function(){
      const raw=ci.value;
      if(raw===''||isNaN(parseFloat(raw))||parseFloat(raw)<0){toast('Enter the counted cash on hand');return;}
      /* bd was captured when this modal opened. If anything landed in
         S.sales since then the figures on screen are stale, and recording
         them would store a variance the cashier never actually saw. */
      const live=shiftSalesBreakdown(sh);
      if(Math.abs(live.total-bd.total)>=0.005||Math.abs(live.cash-bd.cash)>=0.005){

      const paid=parseFloat(pi.value)||0;
      const counted=Math.round(parseFloat(raw)*100)/100;
      const exp=Math.round(expectedDrawer(sh,paid)*100)/100;
      const v=Math.round((counted-exp)*100)/100;
      const vl=varianceLabel(v);
      const finish=function(){
        const rec=Object.assign({},sh,{
          endedAt:new Date().toISOString(),paidOut:paid,expected:exp,
          countedCash:counted,variance:v,
          cashSales:bd.cash,gcashSales:bd.gcash,qrSales:bd.qr,creditSales:bd.credit,
          otherSales:bd.other,totalSales:bd.total,txCount:bd.count,
          closeNote:((document.getElementById('csNote')||{}).value||'').trim(),
          cloudSynced:false
        });

           who to clock out. */
        const _who=S.activeCashier;
        S.openShift=null;S.activeCashier=null;S.shiftStart=null;sessionWrite();
        save();closeModal();
        toast('Shift closed · '+vl.text+' · clocked out');
        render();
        finalizeShift(rec,_who);
      };
      /* A discrepancy is confirmed out loud rather than slipping past, but it
         is never blocked — the count is what it is. */
      if(Math.abs(v)>=0.005){
        uiConfirm(vl.text+'. Record the shift with this discrepancy?',function(__ok){if(__ok)finish();},{tone:'warn'});
      } else finish();
    };
    btns.appendChild(cancel);btns.appendChild(fin);body.appendChild(btns);
    setTimeout(function(){try{document.getElementById('csCount').focus();}catch(e){}},100);
    }

  } else if(m.type==='deleteDaySales'){
    /* Irreversible, so the modal states exactly what will go before asking
       for the admin password — same bar as a void, which is a far smaller
       action than this. */
    const key=m.date||dayKey(new Date());
    const sum=daySummaryFor(key);
    const nice=new Date(key+'T00:00:00').toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    dl.textContent=nice;

    if(sum.count===0){

      em.textContent='There are no sales recorded on this date, so there is nothing to delete.';
      body.appendChild(em);
      const b0=document.createElement('div');b0.className='mbtns';
      const c0=document.createElement('button');c0.className='mpri';c0.textContent='Close';c0.onclick=closeModal;
      b0.appendChild(c0);body.appendChild(b0);
    } else {
    const box=document.createElement('div');
    box.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:12px;padding:11px 13px';
    box.appendChild(drawerRow('Transactions',String(sum.count)));
    if(sum.voided>0)box.appendChild(drawerRow('of which voided',String(sum.voided),{color:'var(--t3)'}));
    box.appendChild(drawerRow('Items sold',String(sum.items)));
    box.appendChild(drawerRow('Revenue removed',fmt(sum.total),{big:true,rule:true,color:'var(--dt)'}));
    if(sum.expenses.length>0)
      box.appendChild(drawerRow('Expenses that day',sum.expenses.length+' · '+fmt(sum.expTotal),{color:'var(--t3)'}));
    body.appendChild(box);

    // Optional extras, both off by default so the action does only what it says.

    opts.style.cssText='display:flex;flex-direction:column;gap:9px;margin-top:12px';

    const mkCheck=function(id,label,hint){
      const w=document.createElement('label');
      w.style.cssText='display:flex;gap:9px;align-items:flex-start;cursor:pointer';
      const cb=document.createElement('input');cb.type='checkbox';cb.id=id;
      cb.style.cssText='margin-top:2px;width:17px;height:17px;flex-shrink:0;accent-color:var(--ac)';
      const tw=document.createElement('div');
      tw.innerHTML='<div style="font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--t1)">'+esc(label)+'</div>'

      w.appendChild(cb);w.appendChild(tw);
      return w;
    };
    /* v7.5: no longer a choice. Deleting a sale row reverses its stock
       movement in the database, so the products and recipe ingredients it

       overrules would just be a lie on the screen. */
    const stockNote=document.createElement('div');
    stockNote.style.cssText='font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.5';
    stockNote.textContent='Stock is returned automatically: the products and recipe ingredients these sales consumed go back to the shelf.';
    opts.appendChild(stockNote);
    if(sum.expenses.length>0)
      opts.appendChild(mkCheck('dsExp','Also delete that day\u2019s expenses',
        sum.expenses.length+' expense entr'+(sum.expenses.length===1?'y':'ies')+' totalling '+fmt(sum.expTotal)+'.'));
    body.appendChild(opts);

    const pf=document.createElement('div');pf.className='mf';pf.style.marginTop='12px';
    pf.innerHTML='<label>Admin password</label>';
    const pi=document.createElement('input');pi.id='dsPw';pi.type='password';pi.placeholder='Admin password';
    pf.appendChild(pi);
    const perr=document.createElement('div');perr.style.cssText='font-size:calc(12.5px * var(--fs,1));color:var(--dt);min-height:17px';
    pf.appendChild(perr);body.appendChild(pf);

    const cloudNote=document.createElement('div');
    cloudNote.style.cssText='font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.6';
    cloudNote.textContent=(!CLOUD.token||!CLOUD.bizId)
      ?'Not signed in to the cloud — this removes the sales from this device only. If a signed-in device still holds them they will come back on the next sync.'
      :(!navigator.onLine
        ?'This device is offline. The sales cannot be removed from the cloud yet, so they may return on the next sync. Reconnect and repeat this to clear the cloud copy.'
        :'The cloud copy for this date will be deleted too, so the sales will not come back on the next sync.');
    body.appendChild(cloudNote);

    const btns=document.createElement('div');btns.className='mbtns';
    const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=closeModal;
    const del=document.createElement('button');del.className='mpri';del.style.background='var(--df)';
    del.textContent='Delete '+sum.count+' sale'+(sum.count===1?'':'s');
    del.onclick=async function(){
      if(pi.value!==S.pass){perr.textContent='Incorrect admin password.';pi.value='';pi.focus();return;}
      perr.textContent='';

      const alsoExp=!!(document.getElementById('dsExp')||{}).checked;

         cloud rows, and queues the delete if it cannot be done now — so the

// ── CLOUD BANNER (shown when back online with pending items, or session expired) ──
let _bannerDismissed=false;
function renderCloudBanner(app){
  const pending=queueCount();
  const offline=!navigator.onLine;
  // Only show banner when online and there are pending items to push
  if(offline||pending===0||_bannerDismissed||!CLOUD.token||!CLOUD.bizId)return;
  const banner=document.createElement('div');banner.className='cloud-banner save';
  const ico=document.createTextNode('☁️ ');
  const lbl=document.createElement('span');lbl.textContent=pending+' offline item'+(pending>1?'s':'')+' — tap to save to cloud';
  const cls=document.createElement('button');cls.className='cloud-banner-close';cls.innerHTML='&times;';
  cls.onclick=function(e){e.stopPropagation();_bannerDismissed=true;banner.remove();};
  banner.onclick=async function(){
    banner.className='cloud-banner saving';lbl.textContent='Saving to cloud…';
    const authed=await ensureAuth();
    if(!authed){lbl.textContent='Session expired — sign in again';setTimeout(()=>banner.remove(),2500);return;}
    const n=await flushSyncQueue(null);
    _bannerDismissed=true;
    toast('Saved '+pending+' item'+(pending>1?'s':'')+' to cloud ✓');
    banner.remove();
    await loadCloudData(true);render();
  };
  banner.appendChild(ico);banner.appendChild(lbl);banner.appendChild(cls);
  app.appendChild(banner);
}

// ── PROACTIVE TOKEN REFRESH — schedule refresh before JWT expiry ──
function scheduleTokenRefresh(){
  if(!CLOUD.token)return;
  try{
    // Parse JWT exp claim (no library needed — it's base64url)
    const payload=JSON.parse(atob(CLOUD.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!payload.exp)return;
    const msUntilExpiry=(payload.exp*1000)-Date.now();
    // Refresh 5 minutes before expiry (or immediately if already within 5 min)
    const refreshIn=Math.max(0,msUntilExpiry-5*60*1000);
    console.log('[Arroyo] Token refresh scheduled in '+(refreshIn/1000/60).toFixed(1)+'m');
    setTimeout(async function(){
      if(!CLOUD.token)return;
      const ok=await refreshSession();
      if(ok){
        console.log('[Arroyo] Proactive token refresh succeeded');
        scheduleTokenRefresh(); // schedule next refresh
      } else {
        // Refresh failed — show re-auth when user next tries an action
        // Don't interrupt them silently — they'll get the re-auth modal on next sync/action
        console.warn('[Arroyo] Proactive token refresh failed — will re-auth on next action');
        // Show a subtle notification dot change
        const dot=document.getElementById('netDot');
        const lbl=document.getElementById('netLbl');
        if(dot){dot.style.background='var(--wt)';}
        if(lbl){lbl.textContent='SESSION';}
      }
    },refreshIn);
  }catch(e){console.warn('[Arroyo] scheduleTokenRefresh error:',e);}
}

// ── ONLINE / OFFLINE EVENT HANDLERS ──
window.addEventListener('offline',function(){
  const dot=document.getElementById('netDot');

window.addEventListener('online',async function(){
  const dot=document.getElementById('netDot');
  const lbl=document.getElementById('netLbl');
  if(dot){dot.className='net-dot online';}
  if(lbl){lbl.textContent='';}

  if(!CLOUD.token||!CLOUD.bizId)return;

  const pending=queueCount();
  if(pending>0){
    // Reset banner dismissed state so the banner shows again
    _bannerDismissed=false;
    render(); // re-render shows the cloud banner
  } else {
    // No pending items — just silently pull latest from cloud
    toast('Back online — syncing…');
    const authed=await ensureAuth();
    if(authed){await loadCloudData(true);render();toast('Synced ✓');}
  }
  /* Ingredients and recipe lines written while offline sit outside the sales
     queue, so they need their own nudge here or they would wait until the
     next manual full sync. */
  const ps=await retryPrepSync();
  if(ps&&(ps.ings||ps.recipes)){render();toast('Synced '+(ps.ings+ps.recipes)+' prep item(s)');}
  await retryShiftSync();
});

/* Closed shifts that never reached the cloud are pushed again here. Kept
   separate from the sales queue so a missing `shifts` table can never block
   sales from syncing. */
async function retryShiftSync(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return 0;
  const pend=(S.shiftLog||[]).filter(function(r){return !r.cloudSynced;});
  let n=0;
  for(let i=0;i<pend.length;i++){
    const ok=await pushShiftToCloud(pend[i]);
    if(ok)n++;
  }
  if(n)render();
  return n;
}

/* ==================================================================== *
 * v7.7.1 — CROSS-TILL FRESHNESS, OVERSELL WARNING, ABANDONED DRAWERS
 *
 * The v7.7.0 migration created a realtime publication for ten tables and
 * neither app ever subscribed to anything, so "the Dashboard and POS reflect
 * each other's changes" was only ever true after somebody pressed Sync. A
 * websocket subscription is the nicer answer but it needs a live socket the
 * moment the tablet wakes from sleep, and these tills spend their day on
 * intermittent mobile data. A short interval poll of the three things that go
 * stale in a way the cashier can see is more robust and costs three small
 * reads a minute:
 *
 *   - stock, which another till may have moved;
 *   - deletions made elsewhere, so a voided-and-deleted sale leaves History
 *     here too rather than waiting for a full sync;
 *   - oversell shortfalls, which used to be silently swallowed: both the till
 *     and the database clamped stock at zero and neither recorded the
 *     difference, so selling 5 of something with 2 left simply lost 3 and no
 *     count ever reconciled again.
 *
 * Paused while the tab is hidden, and skipped entirely when a modal is open so
 * a figure never changes under the cashier's hand mid-transaction.
 * ==================================================================== */
var _xtBusy=false,_xtShortSince=null,_xtLastAuto=0;

async function warnOnOversell(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  var since=_xtShortSince||new Date(Date.now()-120000).toISOString();
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/stock_shortfalls?biz_id=eq.'+CLOUD.bizId
      +'&created_at=gt.'+encodeURIComponent(since)
      +'&select=item_name,shortfall,created_at&order=created_at.desc&limit=5',
      {headers:cloudHeaders()});
    /* A 404 means this database has not had the v7.7.1 script run yet. Not an
       error worth showing anyone - the rest of the app works without it. */
    if(!r.ok)return;
    var rows=await r.json();
    if(!Array.isArray(rows)||!rows.length)return;
    _xtShortSince=rows[0].created_at;
    var names=rows.map(function(x){
      return (x.item_name||'item')+' short by '+(+x.shortfall||0);
    }).join(', ');
    toast('Stock went below zero: '+names+' \u2014 recount before the next order');
  }catch(e){}
}

async function autoCloseStaleShifts(){
  /* Abandoned drawers: app closed, tablet died, browser crashed. The database
     closes the shift and the matching clock-in at the last moment there is
     evidence for, so nobody is paid for a drawer nobody closed. Asked for at
     most twice an hour. */
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(Date.now()-_xtLastAuto<1800000)return;
  _xtLastAuto=Date.now();
  try{
    await fetch(SUPA_URL+'/rest/v1/rpc/arroyo_autoclose_stale_shifts',
      {method:'POST',headers:cloudHeaders(),body:JSON.stringify({p_hours:16})});
  }catch(e){}
  /* And this device's own copy, which the server cannot reach into. */
  try{
    if(S.openShift&&S.openShift.startedAt){
      var age=Date.now()-new Date(S.openShift.startedAt).getTime();
      if(isFinite(age)&&age>16*3600000&&!S.openShift.staleWarned){
        S.openShift.staleWarned=true;save();
        toast('This drawer has been open over 16 hours \u2014 close it so the shift and the clock-out are recorded');
      }
    }
  }catch(e){}
}

async function crossTillRefresh(){
  if(_xtBusy)return;
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(S.modal)return;                       /* never move numbers mid-modal */
  _xtBusy=true;
  try{
    await loadTombstonesFromCloud();
    /* Honour a deletion made on another till straight away rather than at the
       next full sync. Same rule reconcileSales() uses. */
    var tm=tombMap(),before=(S.sales||[]).length;
    S.sales=(S.sales||[]).filter(function(s){return !tm[String(s.id)];});
    if(S.sales.length!==before){
      S.salesTotal=S.sales.filter(function(s){return !s.voided;})
        .reduce(function(a,s){return a+(+s.total||0);},0);
      save();render();
    }
    await refreshStockFromCloud();
    await warnOnOversell();
    await autoCloseStaleShifts();
    if(queueCount()>0)await flushSyncQueue(null);
  }catch(e){}
  _xtBusy=false;
}

setInterval(function(){
  if(typeof document!=='undefined'&&document.hidden)return;
  crossTillRefresh();
},45000);

if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden)crossTillRefresh();
  });
}

/* Slow safety net: anything still outstanding is retried in the background
   so a recipe never silently stays local. Quiet unless it clears something. */
setInterval(async function(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(prepPendingCount()>0){
    const ps=await retryPrepSync();
    if(ps&&(ps.ings||ps.recipes))render();
  }
  if((S.shiftLog||[]).some(function(r){return !r.cloudSynced;}))await retryShiftSync();
},60000);

// ── BARCODE SCANNER INPUT ────────────────────────────────────
// USB / Bluetooth scanners act as keyboards: they type the code
// very fast then send Enter. We buffer keystrokes and resolve on
// Enter. Typing into a form field is never intercepted.
let _scanBuf='',_scanLast=0;
function findByBarcode(code){
  const c=String(code||'').trim().toLowerCase();
  if(!c)return null;
  return S.prods.find(function(p){return (p.barcode||'').trim().toLowerCase()===c;})||null;
}
function scanAddToCart(p){
  if(p.stock!==999&&p.stock<=0){toast(p.name+' is out of stock');return;}
  if(p.variants&&p.variants.length>0){openModal({type:'variantPick',prod:p});return;}
  const effPrice=arroyoEffPrice(p);   /* NEW: Feature 1 — was inline pct-only */
  /* v7.7.4: a scanner fires far faster than a finger, so this was the
     easiest path of all to push past the shelf count. Same ceiling, and the
     grid holds its place between scans. */
  captureScroll();
  /* === NEW: Feature 3/4/5 — the scanner is the fifth add-to-cart path and
     gets the same picker, otherwise a scanned Fries lands with no flavour. === */
  if(arroyoHasMods(p)){
    openModal({type:'modPick',prod:p,variantLabel:'',basePrice:effPrice,
      origPrice:arroyoOnSale(p)?p.price:null,salePct:p.salePct||0,saleAmt:p.saleAmt||0});
    return;
  }
  if(cartAdd(p,null,{id:p.id,name:p.name,price:effPrice,qty:1,note:'',cat:p.cat||'Uncategorised',origPrice:arroyoOnSale(p)?p.price:null,salePct:p.salePct||0,saleAmt:p.saleAmt||0}))toast('\u2713 '+p.name+' \u00b7 scanned');
  render();
}
document.addEventListener('keydown',function(e){
  // Never hijack real typing
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  // Only on the POS product grid, with no modal open
  if(S.screen!=='pos'||S.cartOpen||S.modal)return;
  const now=Date.now();
  if(now-_scanLast>300)_scanBuf='';
  _scanLast=now;
  if(e.key==='Enter'){
    const code=_scanBuf;_scanBuf='';
    if(code.length<3)return;
    const p=findByBarcode(code);
    if(p){e.preventDefault();scanAddToCart(p);}
    else toast('No product with barcode '+code);
    return;
  }
  if(e.key.length===1)_scanBuf+=e.key;
});
// ── END BARCODE SCANNER ──────────────────────────────────────

load();render();
// Auto-sync from cloud on every app open if signed in
(async function(){
  if(CLOUD.token&&CLOUD.bizId){
    // Proactively refresh token on every app open, then schedule future refreshes
    if(CLOUD.refresh){
      await refreshSession();
    } else {
      await ensureAuth();
    }
    scheduleTokenRefresh();
    // Flush any offline queue first before pulling from cloud
    const pending=queueCount();
    if(pending>0){
      console.log('[Arroyo] Auto-flushing '+pending+' offline item(s) on app open...');
      await flushSyncQueue(null);
      toast('Synced '+pending+' offline item'+(pending>1?'s':'')+' ✓');
    }
    await loadCloudData(true);
    /* v7.7.4: the till may hold a cart from before the refresh while another
       till has since sold the same units, so trim it to what is actually on
       the shelf before the cashier reaches the payment screen. */
    var _trim=reconcileCartToStock();
    if(_trim.length){save();toast('Cart adjusted \u2014 stock changed for '+_trim[0]+(_trim.length>1?' +'+(_trim.length-1)+' more':''));}
    await restoreOpenShiftFromCloud();
    render();
  }
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
