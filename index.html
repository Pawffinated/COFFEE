/* ==================== NEW: Feature 3/4/5 — ENGINE ======================
   All of this is new and self-contained. The only existing functions that
   had to change are cartLineQty/cartAdd/cartSetQty/reconcileCartToStock,
   and each change is marked at its own site.
======================================================================== */

/* Lowercase, alphanumerics only. "Grilled Ham & Cheese Sandwich w/ fries"
   becomes "grilledhamcheesesandwichwfries", which survives punctuation and
   spacing drift between the menu board and the product list. */
/* === NEW: Feature 1 — per-item peso sale.
   The expression `(p.salePct>0)?p.price*(1-p.salePct/100):p.price` was
   written out at three separate add-to-cart sites (tile, inventory row,
   barcode scan). Adding a second kind of sale to three copies is how they
   drift apart, so the arithmetic lives here once and those three sites call
   it instead.

   ORDER OF OPERATIONS, and the reason for it: the percentage comes off
   first, then the peso amount. A product marked "20% off" and "P5 off" at
   P100 sells for P75, not P76. Percent-then-peso is the order a cashier
   reads the two fields in, and it is the order that makes the peso figure
   mean exactly what it says on the tile. The result is floored at 0 so a
   peso sale larger than the price can never produce a negative line. === */
function arroyoEffPrice(p){
  if(!p)return 0;
  var base=+p.price||0;
  var pct=+p.salePct||0;
  var amt=+p.saleAmt||0;
  if(pct>0)base=base*(1-Math.min(pct,100)/100);
  if(amt>0)base=base-amt;
  return +Math.max(0,base).toFixed(2);
}
/* True when the product is discounted by either mechanism — used to decide
   whether to show the struck-through original price and the SALE badge. */
function arroyoOnSale(p){return !!p&&((+p.salePct||0)>0||(+p.saleAmt||0)>0);}
/* The badge text: "-20%", "-P5.00", or both. */
function arroyoSaleBadge(p){
  if(!p)return '';
  var bits=[];
  if((+p.salePct||0)>0)bits.push('-'+p.salePct+'%');
  if((+p.saleAmt||0)>0)bits.push('-'+fmt(p.saleAmt));
  return bits.join(' ');
}

function arroyoNorm(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'');}

/* Which modifier groups a product should ask about. Pure function of the
   product's name and category, so it needs no stored configuration on the
   product row and nothing in Supabase changes. */
function arroyoModGroupsFor(p){
  if(!p||!p.name)return [];
  var n=arroyoNorm(p.name),c=arroyoNorm(p.cat||''),g=[];
  if(ARROYO_MOD_SKIP.indexOf(n)>-1)return [];
  /* Trio is checked before plain fries so "Trio Fries" gets the 3-pick
     group and not the single-pick one. */
  if(n.indexOf('fries')>-1){
    if(n.indexOf('trio')>-1)g.push('friesTrio');else g.push('friesFlavor');
  }
  if(n.indexOf('burger')>-1)g.push('patty');
  /* 7.8.4 — every meal gets the priced add-ons (Extra Egg / Extra Rice). The
     free with-or-without question is asked ONLY of meals whose own name says
     an egg is already in the price, because that is the only case where there
     is an egg to decline. "...without Egg" is excluded: that product IS the
     eggless version.

     The product NAME therefore still matters, but only for the free
     preference and no longer for the price. Sisig with Egg, Spam with Egg,
     Tocino with Egg and a Pancit Canton stored as "Pancit Canton w/ Egg &
     Toasted bread" all ring at menu price and can decline the egg; a plain
     "Pancit Canton" simply is not asked. Either way an extra egg is P30. */
  var includesEgg=function(nm){
    return nm.indexOf('egg')>-1&&nm.indexOf('withoutegg')<0;
  };
  /* Flavour first: it is the pack the cook reaches for, and the egg and
     bread questions read as follow-ups to it. Egg handled by the same rule
     the rice meals use, so whether the P70 includes an egg is decided by the
     product's name rather than by a second hardcoded branch. */
  if(n.indexOf('pancit')>-1){
    g.push('pancitFlavor');
    if(includesEgg(n))g.push('eggPref');
    g.push('toast');
    g.push('mealAddons');
  }
  var isRice=c.indexOf('ricemeal')>-1||ARROYO_RICE_NAMES.indexOf(n)>-1;
  if(isRice){
    if(includesEgg(n)&&g.indexOf('eggPref')<0)g.push('eggPref');
    if(g.indexOf('mealAddons')<0)g.push('mealAddons');
  }
  var isDrink=c.indexOf('icedcoffee')>-1||c.indexOf('noncoffee')>-1
            ||c.indexOf('iceblended')>-1||ARROYO_DRINK_NAMES.indexOf(n)>-1;
  if(isDrink){g.push('sugar');g.push('addons');}
  return g;
}
function arroyoHasMods(p){return arroyoModGroupsFor(p).length>0;}
/* === NEW 7.8.2: the one way an item is named on a receipt, an export, a
   history row or a reprint. AUDIT FINDING: every one of those sites already
   charged the right money — `price` has always carried the add-on upcharge —
   but each printed only `it.name`, so a P125 latte billed at P205 came out as
   "Cafe Latte ... 205.00" with nothing to explain the extra P80. The customer
   and the owner both read that as the add-on price going missing.
   Works on a cart line and on a stored sale item alike. `plain` drops the
   markup for the fixed-width text receipt. */
function arroyoItemName(it,plain){
  if(!it)return '';
  var n=String(it.name||'');
  if(it.variantLabel)n+=' ('+it.variantLabel+')';
  if(!it.modLabel)return n;
  return plain?n+' - '+it.modLabel:n+' \u00b7 '+it.modLabel;
}

/* The selection itself is {groupKey:[values]}. Kept as a plain object so it
   drops straight into the sale item JSON with no encoding step. */
function arroyoModDefaults(groups){
  var sel={};
  (groups||[]).forEach(function(k){
    var d=ARROYO_MOD_GROUPS[k];
    if(!d)return;
    sel[k]=(d.mode==='single'&&d.required&&d.def)?[d.def]:[];
  });
  return sel;
}
/* Stable identity for a selection, so two lines of the same product differ
   in the cart when and only when their modifiers differ. Sorted on both
   axes: the cashier tapping Cheese then BBQ must land on the same line as
   the cashier who tapped BBQ then Cheese. */
function arroyoModKey(sel){
  if(!sel)return '';
  return Object.keys(sel).sort().map(function(k){
    var v=(sel[k]||[]).slice().sort();
    return v.length?k+'='+v.join('+'):'';
  }).filter(Boolean).join('|');
}
/* Cart / receipt summary: "BBQ / Cheese · Less Sugar · +Extra Whip (+P40)" */
/* `bare` omits the per-option peso amounts. The screen wants them (the
   cashier is deciding), but a 28-column receipt does not: the line total
   already accounts for every upcharge, and the extra "(+PHP40.00)" beside
   each add-on pushed real add-on names into a second wrapped line. */
function arroyoModLabel(sel,bare){
  if(!sel)return '';
  var parts=[];
  Object.keys(sel).forEach(function(k){
    var d=ARROYO_MOD_GROUPS[k],v=sel[k]||[];
    if(!d||!v.length)return;
    /* 7.8.4 — was `k==='addons'`, which hard-coded the drink group. Any
       multi-select group whose options carry a price now reads as a list of
       "+Item (+P30.00)" entries, so meal add-ons and drink add-ons look the
       same on the cart and the receipt. friesTrio has no deltas and keeps
       its "BBQ / Cheese / Sour Cream" form. */
    if(d.mode==='multi'&&d.options.some(function(o){return o.delta;})){
      v.forEach(function(x){
        var o=d.options.find(function(y){return y.v===x;});
        parts.push('+'+x+((!bare&&o&&o.delta)?' (+'+fmt(o.delta).replace(/\s/g,'')+')':''));
      });
    } else {
      var seg=v.join(' / ');
      var extra=v.reduce(function(a,x){
        var o=d.options.find(function(y){return y.v===x;});
        return a+((o&&o.delta)||0);
      },0);
      parts.push(seg+((!bare&&extra)?' (+'+fmt(extra).replace(/\s/g,'')+')':''));
    }
  });
  return parts.join(' · ');
}
/* Peso added to the unit price by the selection. */
function arroyoModDelta(sel){
  if(!sel)return 0;
  var t=0;
  Object.keys(sel).forEach(function(k){
    var d=ARROYO_MOD_GROUPS[k];
    if(!d)return;
    (sel[k]||[]).forEach(function(x){
      var o=d.options.find(function(y){return y.v===x;});
      if(o&&o.delta)t+=+o.delta||0;
    });
  });
  return t;
}
/* The ingredient lines a selection consumes, summed per ingredient name so
   three flavours that share a seasoning deduct it three times as one entry.
   This list is written onto the sale item, which is what lets the database
   apply the same deduction without knowing the flavour config. */
function arroyoModIngs(sel){
  if(!sel)return [];
  var acc={};
  Object.keys(sel).forEach(function(k){
    (sel[k]||[]).forEach(function(x){
      (ARROYO_MOD_INGREDIENTS[x]||[]).forEach(function(r){
        var key=arroyoNorm(r.name)+'|'+(r.unit||'');
        if(acc[key])acc[key].qty=ingRound(acc[key].qty+(+r.qty||0));
        else acc[key]={name:r.name,qty:+r.qty||0,unit:r.unit||''};
      });
    });
  });
  return Object.keys(acc).map(function(k){return acc[k];});
}
/* Validation, in the cashier's words. Returns '' when the selection is
   good, otherwise the message to show inline. */
function arroyoModError(sel,groups){
  for(var i=0;i<(groups||[]).length;i++){
    var k=groups[i],d=ARROYO_MOD_GROUPS[k];
    if(!d)continue;
    var v=(sel&&sel[k])||[];
    var min=d.mode==='multi'?(d.min||0):(d.required?1:0);
    if(v.length<min)return 'Choose '+(min>1?min+' ':'')+'a '+d.label.toLowerCase();
    if(d.mode==='multi'&&d.max&&v.length>d.max)return 'Maximum '+d.max+' flavours';
  }
  return '';
}

function availUnits(p,variantLabel){
  if(!p)return 0;
  if(variantLabel&&p.variants&&p.variants.length){
    var v=p.variants.find(function(x){return x.label===variantLabel;});
    /* A variant deleted since it went in the cart falls through to the
       parent figure, the same way applyStockDelta() does. */
    if(v)return v.stock===999?Infinity:Math.max(0,parseInt(v.stock)||0);
  }
  return p.stock===999?Infinity:Math.max(0,parseInt(p.stock)||0);
}
/* Matched on id AND variant, so two variants of one product hold separate
   ceilings instead of sharing the parent's. */
function cartLineQty(id,variantLabel){
  /* v7.8 CHANGE (Feature 3/4/5): was a .find() returning one line's qty.
     Modifiers split one product across several cart lines — French Fries
     BBQ and French Fries Cheese are two lines drawing on ONE stock figure —
     so a per-line answer let 5 in stock be sold as 5 + 5. This sums every
     line of the same product/variant regardless of modifier, which is also
     what the old single-line case returns. */
  return S.cart.reduce(function(s,i){
    return s+((i.id===id&&(i.variantLabel||'')===(variantLabel||''))?(+i.qty||0):0);
  },0);
}
function stockMsg(cap,name,variantLabel){
  return cap<=0
    ?name+(variantLabel?' ('+variantLabel+')':'')+' is out of stock'
    :'Only '+cap+' '+name+(variantLabel?' ('+variantLabel+')':'')+' in stock';
}
/* true  = the line was added or incremented
   false = the ceiling refused it and the cashier has been told why.
   Callers use the result to decide whether to confirm the add. */
function cartAdd(p,variantLabel,line,step){
  if(!p)return false;
  step=step||1;
  var cap=availUnits(p,variantLabel);
  if(cartLineQty(p.id,variantLabel)+step>cap){
    toast(stockMsg(cap,p.name,variantLabel));
    return false;
  }
  /* v7.8 CHANGE (Feature 3/4/5): modKey added to the match. Without it a
     second flavour of the same product incremented the first flavour's line
     instead of opening its own. */
  var mk=(line&&line.modKey)||'';
  var ex=S.cart.find(function(i){return i.id===p.id&&(i.variantLabel||'')===(variantLabel||'')&&(i.modKey||'')===mk;});
  if(ex)ex.qty=(+ex.qty||0)+step;else S.cart.push(line);
  return true;
}
/* The cart's own +/- buttons. The ceiling applies to +; - removes the line
   when it reaches zero. */
function cartSetQty(idx,delta){
  var it=S.cart[idx];
  if(!it)return false;
  if(delta>0){
    var p=S.prods.find(function(x){return x.id===it.id;});
    var cap=availUnits(p,it.variantLabel);
    /* v7.8 CHANGE (Feature 3/4/5): was (+it.qty||0)+delta, this line only.
       With modifiers the ceiling belongs to the product, so the + button has
       to count every flavour line already in the cart. */
    if(cartLineQty(it.id,it.variantLabel)+delta>cap){toast(stockMsg(cap,it.name,it.variantLabel));return false;}
  }
  it.qty=(+it.qty||0)+delta;
  if(it.qty<=0)S.cart.splice(idx,1);
  return true;
}
/* Called after a cloud stock pull. Another till selling the last two units
   must not leave this cart holding three, or the cashier reaches the
   payment screen with a total that cannot be fulfilled. Trims quietly and
   reports what it changed so the caller can say so once. */
function reconcileCartToStock(){
  /* v7.8 CHANGE (Feature 3/4/5): the cap is now shared. Each modifier line
     used to be trimmed against the full figure, so three flavour lines of a
     product with 2 left survived as 2 + 2 + 2. `seen` carries the units
     already granted; later lines in the cart are served first, which is
     arbitrary but deterministic. */
  var trimmed=[],seen={};
  for(var i=S.cart.length-1;i>=0;i--){
    var it=S.cart[i];
    var p=S.prods.find(function(x){return x.id===it.id;});
    var cap=availUnits(p,it.variantLabel);
    if(!isFinite(cap))continue;
    var key=it.id+'|'+(it.variantLabel||'');
    var used=seen[key]||0;
    var room=Math.max(0,cap-used);
    var q=+it.qty||0;
    if(q>room){
      trimmed.push(it.name+(it.variantLabel?' ('+it.variantLabel+')':'')+(it.modLabel?' - '+it.modLabel:''));
      if(room<=0){S.cart.splice(i,1);q=0;}else{it.qty=room;q=room;}
    }
    seen[key]=used+q;
  }
  return trimmed;
}

function sub(){return S.cart.reduce((s,i)=>s+i.price*i.qty,0);}
function damt(){const s=sub();const d=Math.max(0,S.disc||0);return S.discType==='%'?s*Math.min(d,100)/100:Math.min(d,s);}
function tamt(){return 0;}
function tot(){return sub()-damt()+tamt();}
function txId(){
  // Timestamp (base36) + 4 random chars = globally unique across devices
  const ts=Date.now().toString(36).toUpperCase();
  const rnd=Math.random().toString(36).substr(2,4).toUpperCase();
  return'TXN-'+ts+'-'+rnd;
}
function cc(){return S.cart.reduce((s,i)=>s+i.qty,0);}

function initBiz(id){
  const b=BT.find(x=>x.id===id);
  S.biz=id;S.bizName=b.label;
  S.prods=JSON.parse(JSON.stringify(DP[id]||[]));
  const cs=[...new Set(S.prods.map(p=>p.cat))];
  S.cats=['All',...cs];S.nid=S.prods.length+1;S.screen='pos';
  save();render();
}

/* v7.7.4: addToCart() and chgQty() lived here. Both were dead code — one
   occurrence each, their own definitions — left behind when the product grid
   moved to an inline handler and the cart to indexed +/- buttons. They are
   removed rather than repaired because they were an active hazard: they are
   exactly where a maintainer would add a stock cap, and doing so would have
   changed nothing at all. The live paths now go through cartAdd() and
   cartSetQty() above. */

function receiptStr(method,id,refNum){
  const now=new Date(),w=28;
  const lp=(s,n)=>String(s).length>=n?String(s).slice(0,n):String(s)+' '.repeat(n-String(s).length);
  const rp=(s,n)=>String(s).length>=n?String(s).slice(0,n):' '.repeat(n-String(s).length)+String(s);
  const line='-'.repeat(w);
  var rows;
  if(typeof QUEUE_CFG!=='undefined'&&QUEUE_CFG.enabled&&S.pendingQueueNo){
    var qlab=(typeof __qzLabel==='function')?__qzLabel(S.pendingQueueNo):String(S.pendingQueueNo);
    var ctr=function(t){var pad=Math.max(0,Math.floor((w-String(t).length)/2));return ' '.repeat(pad)+t;};
    rows=[ctr(S.bizName),line,
          ctr('YOUR NUMBER'),
          ctr('*  '+qlab+'  *'),
          ctr('Please wait to be called'),
          line,'Date: '+now.toLocaleString(),'TXN:  '+id,line];
  } else {
    rows=[lp(S.bizName,w),line,'Date: '+now.toLocaleString(),'TXN:  '+id,line];
  }
  /* === NEW 7.8.2 — was `i.name`, which named neither the variant nor the
     add-ons. A 28-column receipt cannot hold "Cafe Latte - Less Sugar, +Extra
     Whip" on one line, so the item and its amount stay on the first row and
     the variant detail wraps onto indented continuation rows beneath it. === */
  S.cart.forEach(i=>{
    const r=fmt(i.price*i.qty);
    rows.push(lp(i.name+' x'+i.qty,w-r.length)+r);
    const detail=[];
    if(i.variantLabel)detail.push(i.variantLabel);
    /* Bare label: names only, no per-add-on peso amounts. Falls back to the
       stored modLabel for a cart restored from a save that predates `mods`. */
    var ml=i.mods?arroyoModLabel(i.mods,true):(i.modLabel||'');
    if(ml)ml.split(' · ').forEach(function(x){detail.push(x);});
    if(i.qty>1)detail.push('@ '+fmt(i.price)+' each');
    if(detail.length){
      /* Wrapped on whole segments, never on words: "Extra Espresso" must not
         be split across two lines. A segment wider than the paper falls back
         to a hard slice, which only a pathological option name would reach. */
      var cur='';
      detail.forEach(function(seg){
        if(seg.length>w-2){
          if(cur){rows.push('  '+cur);cur='';}
          rows.push('  '+seg.slice(0,w-2));
          return;
        }
        if((cur?cur+', '+seg:seg).length>w-2){rows.push('  '+cur);cur=seg;}
        else cur=cur?cur+', '+seg:seg;
      });
      if(cur)rows.push('  '+cur);
    }
  });
  rows.push(line);
  const ar=(l,r)=>rows.push(lp(l,w-r.length)+r);
  ar('Subtotal:',fmt(sub()));
  if(S.disc>0)ar('Discount:','-'+fmt(damt()));
  // VAT already included in price - no separate VAT line
  rows.push(line);
  ar('TOTAL:',fmt(tot()));
  rows.push('Payment: '+method);
  if(refNum)rows.push('Ref No:  '+refNum);
  if(method==='Cash'&&S.cashTendered>=tot()){
    ar('Cash:',fmt(S.cashTendered));
    ar('Change:',fmt(S.cashTendered-tot()));
  }
  rows.push(line);
  rows.push(rp('Powered by Arroyo POS',w));
  return rows.join('\n');
}

// ── CODE 128 BARCODE GENERATOR ──────────────────────────────
// Generates a pure SVG Code 128B barcode — no external library needed
function code128SVG(text,opts){
  opts=opts||{};
  const height=opts.height||60;
  const quiet=opts.quiet||10;

  // Code 128B encoding table (value → bar pattern)
  const C128={
    ' ':11011001100,'!':11001101100,'"':11001100110,'#':10010011000,
    '$':10010001100,'%':10001001100,'&':10011001000,"'":10011000100,
    '(':10001100100,')':11001001000,'*':11001000100,'+':11000100100,
    ',':10110011100,'-':10011011100,'.':10011001110,'/':10111001100,
    '0':10011101100,'1':10011100110,'2':11001110010,'3':11001011100,
    '4':11001001110,'5':11011100100,'6':11001110100,'7':11101101110,
    '8':11101001100,'9':11100101100,':':11100100110,';':11101100100,
    '<':11100110100,'=':11100110010,'>':11011011000,'?':11011000110,
    '@':11000110110,'A':10100011000,'B':10001011000,'C':10001000110,
    'D':10110001000,'E':10001101000,'F':10001100010,'G':11010001000,
    'H':11000101000,'I':11000100010,'J':10110111000,'K':10110001110,
    'L':10001101110,'M':10111011000,'N':10111000110,'O':10001110110,
    'P':11101110110,'Q':11010001110,'R':11000010010,'S':11001010000,
    'T':11110101000,'U':11110100010,'V':11110010010,'W':11011110100,
    'X':11011110010,'Y':11110110100,'Z':11010111000,
    '[':11010100010,'\\':11010010000,']':11011010000,'^':11011001010,
    '_':10000110100,'`':10000110010,'a':10011010000,'b':10011001010,
    'c':10000101100,'d':10000100110,'e':10110010000,'f':10110000100,
    'g':10011000010,'h':10000011010,'i':10000010110,'j':10110100000,
    'k':10110010100,'l':10110000010,'m':11000010100,'n':11001010100,
    'o':10111100010,'p':11001001010,'q':10010011110,'r':10011110010,
    's':10011110100,'t':10111001110,'u':10111100100,'v':10001111010,
    'w':10011011110,'x':10001111100,'y':10111011110,'z':10111101110,
    '{':11110010100,'|':11110010010,'}':11011110100,'~':11011101000
  };

  // Start Code B = pattern 11010010000, value=104
  const START_B=11010010000;
  const STOP=11000111010;
  const startVal=104;

  // Build bar pattern string
  let patterns=[START_B.toString()];
  let checksum=startVal;
  const chars=[...text];
  chars.forEach(function(ch,i){
    const pat=C128[ch];
    if(!pat)return;
    patterns.push(pat.toString());
    // checksum: startVal + sum(charVal * position)
    // Code128B: space=0, !..~ = 1..94
    const v=ch.charCodeAt(0)-32; // space=0, A=33, etc.
    checksum+=v*(i+1);
  });

  // Check character (value mod 103)
  const checkVal=checksum%103;
  // Find the character for checkVal in Code128B
  // checkVal maps to ASCII: checkVal+32 for B set
  const checkChar=String.fromCharCode(checkVal+32);
  const checkPat=C128[checkChar];
  if(checkPat)patterns.push(checkPat.toString());

  patterns.push(STOP.toString());

  // Convert patterns to bar widths
  // Each digit in pattern = 1 unit wide bar or space
  // 1=bar, 0=space (alternating, starting with bar)
  let bars=[];
  patterns.forEach(function(p){
    const digits=p.split('');
    digits.forEach(function(d){bars.push(parseInt(d));});
  });

  // Build SVG
  const unitW=opts.unitW||2; // px per unit — 2px good for thermal
  let x=quiet;
  let rects='';
  let isBar=true;
  bars.forEach(function(w){
    if(isBar&&w>0){
      rects+='<rect x="'+x+'" y="0" width="'+(w*unitW)+'" height="'+height+'" fill="#000"/>';
    }
    x+=w*unitW;
    isBar=!isBar;
  });
  const totalW=x+quiet;

  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+totalW+'" height="'+(height+20)+'" viewBox="0 0 '+totalW+' '+(height+20)+'">'
    +'<rect width="'+totalW+'" height="'+(height+20)+'" fill="#fff"/>'
    +rects
    +'<text x="'+(totalW/2)+'" y="'+(height+14)+'" text-anchor="middle" font-family="monospace" font-size="9" fill="#000">'+text+'</text>'
    +'</svg>';
}

// ── PRINT RECEIPT WINDOW ─────────────────────────────────────
function printReceipt(tx){
  // Build thermal-friendly HTML receipt
  const isWide=S.thermalWidth==='80'||false; // default 58mm
  const mmW=isWide?80:58;
  const pxW=isWide?302:219; // 80mm≈302px, 58mm≈219px at 96dpi

  // Generate barcode SVG for the TXN ID
  const barSVG=code128SVG(tx.id,{height:50,unitW:isWide?2:1.5,quiet:6});

  // Build items rows
  let itemsHtml='';
  (tx.items||[]).forEach(function(it){
    const sub=(it.price*it.qty).toFixed(2);
    /* NEW 7.8.2 — had the variant but not the add-ons. Escaped now too:
       this string goes into an HTML table and a product named "Ham & Cheese"
       was being written as raw markup. */
    const name=esc(arroyoItemName(it));
    itemsHtml+='<tr>'
      +'<td style="text-align:left">'+name+'</td>'
      +'<td style="text-align:center">x'+it.qty+'</td>'
      +'<td style="text-align:right">'+it.price.toFixed(2)+'</td>'
      +'<td style="text-align:right">'+sub+'</td>'
      +'</tr>';
  });

  // Subtotal, discount, total
  const subtotal=tx.items.reduce(function(a,i){return a+(i.price*i.qty);},0);
  const discAmt=subtotal-tx.total;
  let totalsHtml='<tr><td colspan="3" style="text-align:right">Subtotal</td><td style="text-align:right">'+subtotal.toFixed(2)+'</td></tr>';
  if(discAmt>0.01){
    totalsHtml+='<tr><td colspan="3" style="text-align:right">Discount</td><td style="text-align:right">-'+discAmt.toFixed(2)+'</td></tr>';
  }
  totalsHtml+='<tr style="font-weight:700;border-top:1px solid #000"><td colspan="3" style="text-align:right">TOTAL</td><td style="text-align:right">'+tx.total.toFixed(2)+'</td></tr>';

/* ===== RENDER ===== */
/* ===== SCROLL PRESERVATION =====
   render() rebuilds the screen with app.innerHTML='', which destroys the
   element that was doing the scrolling. .prod-grid is itself the scroll
   container, so adding an item to the cart sent the grid back to the top and
   the cashier had to scroll down again to find the next one.

   Position is recorded as the user scrolls, not at render time: by the time
   render() runs, S.cat may already hold the NEW category, so capturing then
   would file the old position under the new key. Recording on scroll stores
   it against the key that was actually in effect.

   The key includes the screen and category, so scrolling is remembered
   within a list but correctly starts at the top when you switch category,
   change screen, or open the cart. */
const SCROLL_KEEP=['prod-grid','inv-list','hist-list','admin-scroll','exp-list','cart-items'];
let SCROLL_POS={};
function scrollKey(cls){
  /* The search term belongs in the key: filtering the grid shortens the
     list, so a position remembered from the unfiltered view would land in
     the wrong place or be clamped away. */
  return S.screen+'|'+(S.cartOpen?'cart':'main')+'|'+(S.cat||'')+'|'+(S.search||'')+'|'+(S.sort||'')+'|'+cls;
}
/* v7.7.2: record where every kept list is RIGHT NOW, under the key currently
   in effect. Called immediately before an action that rebuilds the DOM without
   changing which list is on screen - tapping a product, for instance. The
   scroll listener below already did this, but only when the user actually
   scrolled. Arrive at a position via a restore rather than a swipe and no
   scroll event fires, so nothing was recorded and the next tap went back to
   the top. Capturing explicitly removes the guesswork. */
function captureScroll(){
  SCROLL_KEEP.forEach(function(cls){
    const el=document.querySelector('.'+cls);
    if(el)SCROLL_POS[scrollKey(cls)]=el.scrollTop;
  });
}
function keepScroll(){
  SCROLL_KEEP.forEach(function(cls){
    const el=document.querySelector('.'+cls);
    if(!el)return;
    const key=scrollKey(cls);
    const want=SCROLL_POS[key]||0;
    if(want>0){
      /* scrollTop silently clamps to whatever scrollHeight allows at the
         moment it is set - and scrollHeight is still growing here: flex
         children may not be laid out on the first frame, and product PHOTOS
         have not decoded, so the rows holding them are still short. A single
         re-apply was enough for text-only tiles and is not enough once a tile
         can contain an image. Re-apply across a few frames, and again as each
         photo finishes loading. */
      const apply=function(){
        if(el.scrollTop<want&&el.scrollHeight>el.clientHeight)el.scrollTop=want;
      };
      el.scrollTop=want;
      requestAnimationFrame(apply);
      setTimeout(apply,60);
      setTimeout(apply,240);
      const imgs=el.querySelectorAll?el.querySelectorAll('img'):[];
      for(let i=0;i<imgs.length;i++){
        if(!imgs[i].complete)imgs[i].addEventListener('load',apply,{once:true});
      }
    }
    el.addEventListener('scroll',function(){
      SCROLL_POS[key]=el.scrollTop;
    },{passive:true});
  });
}
/* Dropped when the data behind a list changes enough that a remembered
   offset would point somewhere misleading. */
function resetScroll(){SCROLL_POS={};}

function render(){
  const app=document.getElementById('app');
  const tc=document.getElementById('toasts');
  app.innerHTML='';
  if(tc)app.appendChild(tc);

  if(!S.installed){renderInstall(app);return;}

  // Cloud auth gate — show login if not signed in
  if(!CLOUD.token){renderCloudAuth(app);if(S.modal)renderModal(app);return;}

  if(S.screen==='biz'){renderBiz(app);return;}
  if(S.screen==='wizard'){renderWizard(app);return;}

  // Cashier gate
  if(S.cashiers.length>0&&!S.activeCashier&&S.screen!=='admin'){
    renderCashierLogin(app);if(S.modal)renderModal(app);return;
  }

  renderTopNav(app);
  renderCloudBanner(app);

  const scr=document.createElement('div');
  scr.className='screen';

  if(S.screen==='pos'){
    if(S.cartOpen)renderCart(scr);
    else renderPOS(scr);
  }
  else if(S.screen==='inv'){S.stockLocked?renderStockLock(scr):renderInv(scr);}
  else if(S.screen==='prep')renderPrep(scr);
  else if(S.screen==='hist')renderHist(scr);
  else if(S.screen==='exp')renderExp(scr);
  else if(S.screen==='att'){renderAtt(scr);}
  else if(S.screen==='admin'){S.locked?renderLock(scr,{showThemeReset:true}):renderAdmin(scr);}
  else if(S.screen==='about')renderAbout(scr);

  app.appendChild(scr);
  if(S.modal)renderModal(app);
  keepScroll();
}

             the throw was swallowed by the catch below, so the localStorage
             write on the next line never ran: finishing the setup wizard left
             the cloud session unsaved and the till looked signed out after a
             reload. */
          save();
          localStorage.setItem('arroyo_cloud',JSON.stringify({user:CLOUD.user,token:CLOUD.token,refresh:CLOUD.refresh,bizId:CLOUD.bizId,email:S.cloudEmail,bizName:WIZ.bizName}));

      }
      S.screen='pos';save();render();toast('Welcome to '+S.bizName+'! 🎉');
      // Sync products: push only if we have local products, otherwise pull from cloud
      if(S.prods.length>0){
        await saveProductsToCloud();
      } else {
        await loadCloudData(true);
      }
    }
  };
  foot.appendChild(next);
  w.appendChild(foot);
  app.appendChild(w);
}

/* ==================================================================== *
 * CASH DRAWER — FLOAT, SHIFT RECONCILIATION, SHORT / OVER
 *
 * A shift opens with a counted float (the "cash on hand" the cashier starts
 * with) and closes with a second count. What the drawer should hold is
 * derived, never typed:
 *
 *   expected = opening float + cash sales - cash paid out
 *
 * Only Cash sales move the drawer: GCash and Credit take no notes, so
 * folding them in would have made every shift look short by the value of
 * its cashless trade. Voided sales are excluded for the same reason.
 * ==================================================================== */

/* Sales taken during a shift, split by tender.
   Time alone is not enough to identify a shift's sales. loadFromCloud()
   replaces S.sales with every sale for the business, from every till, so a
   window-only filter folded a second till's cash into this drawer and made
   the shift read short by the other till's takings. Match the cashier too.
   Shifts opened before this build carry no shiftId, so fall back to the
   cashier name, and only fall all the way back to time-only when the shift
   has no cashier recorded at all. */
function shiftSalesBreakdown(sh){
  /* === NEW: Feature 2 — `qr` added. expectedDrawer() reads ONLY out.cash,
     so QR is excluded from the cash count by construction, exactly as GCash
     already was. === */
  const out={cash:0,gcash:0,qr:0,credit:0,other:0,total:0,count:0,voided:0};
  if(!sh)return out;
  const from=new Date(sh.startedAt).getTime();
  const to=sh.endedAt?new Date(sh.endedAt).getTime():Date.now();
  const mine=function(s){
    if(sh.shiftUid&&s.shiftId)return s.shiftId===sh.shiftUid;
    if(!sh.cashier)return true;
    return (s.cashier||'')===sh.cashier;
  };
  (S.sales||[]).forEach(function(s){
    const t=new Date(s.date).getTime();
    if(isNaN(t)||t<from||t>to)return;
    if(!mine(s))return;
    if(s.voided){out.voided++;return;}
    const amt=+s.total||0;
    out.count++;out.total+=amt;
    const m=s.method||'Cash';
    if(m==='Cash')out.cash+=amt;
    else if(m==='GCash')out.gcash+=amt;
    else if(m==='QR')out.qr+=amt;
    else if(m==='Utang')out.credit+=amt;
    else out.other+=amt;
  });
  return out;
}

// Expenses recorded during a shift — the default assumption is drawer cash.
function shiftPaidOut(sh){
  if(!sh)return 0;
  const from=new Date(sh.startedAt).getTime();
  const to=sh.endedAt?new Date(sh.endedAt).getTime():Date.now();
  return (S.expenses||[]).filter(function(e){
    const t=new Date(e.date).getTime();
    return !isNaN(t)&&t>=from&&t<=to;
  }).reduce(function(a,e){return a+(+e.amount||0);},0);
}

function expectedDrawer(sh,paidOut){
  if(!sh)return 0;
  const b=shiftSalesBreakdown(sh);
  const po=(paidOut===undefined||paidOut===null)?shiftPaidOut(sh):(+paidOut||0);
  return (+sh.openingFloat||0)+b.cash-po;
}

/* Pushes a closed shift up if the table exists. Written defensively: an
   install whose Supabase has no `shifts` table simply keeps the record on
   the device instead of throwing an error at the cashier. */
async function pushShiftToCloud(sh){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return false;
  /* cash_sales used to be recomputed here while expected_cash and variance
     came from the figures frozen when the close-out modal opened. The two
     windows differ (the modal's ends at "now", this one at endedAt), so the
     cloud row could hold arithmetic that does not close:
     float + cash_sales - paid_out != expected_cash. Prefer the figure the
     cashier was actually shown and agreed to; only recompute for old records
     that predate cashSales being stored. */
  const b=(sh.cashSales===undefined||sh.cashSales===null)?shiftSalesBreakdown(sh):{cash:+sh.cashSales||0};
  /* The opening note and the close-out note are different fields. Only
     sh.note was sent, so closeNote - the one that explains a short drawer -
     never left the device. Send both. */
  const noteOut=[sh.note?'Open: '+sh.note:'',sh.closeNote?'Close: '+sh.closeNote:'']
    .filter(Boolean).join(' · ');
  const full={biz_id:CLOUD.bizId,cashier:sh.cashier||'',employee_id:sh.supaId||null,
    shift_uid:sh.shiftUid||null,
    started_at:sh.startedAt,ended_at:sh.endedAt,
    opening_float:+sh.openingFloat||0,cash_sales:b.cash,paid_out:+sh.paidOut||0,
    expected_cash:+sh.expected||0,
    /* `+sh.countedCash||0` turned a null (drawer never counted) into 0, and
       the Dashboard splits counted from uncounted on `counted_cash === null`
       - so an abandoned drawer arrived as "counted, variance 0" and rendered
       as Balanced, the false clean shift varianceLabel() exists to prevent. */
    counted_cash:(sh.countedCash===undefined||sh.countedCash===null)?null:+sh.countedCash,
    variance:+sh.variance||0,note:sh.note||''};
  const lean={biz_id:CLOUD.bizId,cashier:sh.cashier||'',started_at:sh.startedAt,
    ended_at:sh.endedAt,opening_float:+sh.openingFloat||0,
    counted_cash:(sh.countedCash===undefined||sh.countedCash===null)?null:+sh.countedCash,
    variance:+sh.variance||0};
  const last={status:0,msg:''};
  try{
    /* v7.5: if the drawer was announced when it opened, complete that row
       rather than inserting a second one — otherwise the Cash drawer page
       shows every shift twice, once open and once closed. */
    if(sh.cloudId){
      try{
        const up=await fetch(SUPA_URL+'/rest/v1/shifts?id=eq.'+encodeURIComponent(sh.cloudId),
          {method:'PATCH',headers:cloudHeaders(),body:JSON.stringify(full)});
        if(up.ok){sh.cloudSynced=true;save();return true;}
      }catch(e){}
    }
    let a=await prepAttempt('POST','/rest/v1/shifts',full,last);
    if(!a.ok)a=await prepAttempt('POST','/rest/v1/shifts',lean,last);
    if(!a.ok){sh.cloudSynced=false;save();return false;}
    sh.cloudSynced=true;save();
    return true;
  }catch(e){sh.cloudSynced=false;save();return false;}
}

function drawerRow(label,value,opts){

    +(opts.tight?'4px':'7px')+' 0'+(opts.rule?';border-top:1px solid var(--b2);margin-top:4px;padding-top:9px':'');
  const l=document.createElement('span');

    +';font-weight:'+(opts.big?'800':'600');
  l.textContent=label;
  const v=document.createElement('span');
  v.style.cssText='font-size:calc('+(opts.big?'16':'13.5')+'px * var(--fs,1));font-weight:'+(opts.big?'800':'700')
    +';color:'+(opts.color||'var(--t1)');

/* Short / over, phrased the way a cashier would say it out loud. `rec` is
   optional; passing a shift record lets an abandoned drawer report itself as
   uncounted instead of showing a variance of zero as "Balanced", which would
   have read as a clean shift when in fact nobody ever counted it. */
function varianceLabel(v,rec){
  if(rec&&(rec.unreconciled||rec.countedCash===null||rec.countedCash===undefined))
    return{text:'NOT COUNTED',color:'var(--t3)',detail:'This drawer was never counted, so no short/over can be worked out.'};
  const a=Math.abs(v);
  if(a<0.005)return{text:'Balanced',color:'var(--st)',detail:'The drawer matches exactly.'};
  if(v>0)return{text:'OVER '+fmt(a),color:'var(--wt)',detail:'There is more cash in the drawer than the sales account for.'};
  return{text:'SHORT '+fmt(a),color:'var(--dt)',detail:'There is less cash in the drawer than the sales account for.'};
}

/* Sales taken on a given local day, ignoring voided ones. Used so the
   Expenses tab can show net profit for whichever day is selected rather than
   always comparing against today's takings. */
/* A day's takings split by tender. Needed because only Cash actually puts
   notes in the till — GCash and credit are revenue but never cash on hand, so
   a cash figure that included them would never reconcile against the drawer. */
function salesOnDayBreakdown(key){
  /* === NEW: Feature 2 — `qr` added, same reasoning as shiftSalesBreakdown. === */
  const out={cash:0,gcash:0,qr:0,credit:0,other:0,total:0,count:0};
  (S.sales||[]).forEach(function(s){
    if(s.voided)return;
    if(dayKey(s.date)!==key)return;
    const amt=+s.total||0;
    out.total+=amt;out.count++;
    const m=s.method||'Cash';
    if(m==='Cash')out.cash+=amt;
    else if(m==='GCash')out.gcash+=amt;
    else if(m==='QR')out.qr+=amt;
    else if(m==='Utang')out.credit+=amt;
    else out.other+=amt;
  });
  return out;
}

function salesOnDay(key){
  return salesOnDayBreakdown(key).total;
}

function renderExp(scr){
  const hd=document.createElement('div');hd.className='panel-hd';hd.innerHTML='<h2>Expenses</h2>';
  const addb=document.createElement('button');addb.className='abtn';addb.textContent='+ Add';
  // A chosen day is passed through so the new entry lands on that date.
  addb.onclick=function(){openModal({type:'expense',date:S.expDate||''});};
  hd.appendChild(addb);scr.appendChild(hd);

  /* The stat row now follows the selection. It used to be hard-wired to
     today, so picking another period left three figures on screen that had
     nothing to do with the list underneath them. */
  const selKey=S.expDate||dayKey(new Date());
  const isToday=selKey===dayKey(new Date());
  const dayExpAmt=S.expenses.filter(function(e){return dayKey(e.date)===selKey;}).reduce(function(a,e){return a+(+e.amount||0);},0);
  const bdown=salesOnDayBreakdown(selKey);
  const daySalesAmt=bdown.total;
  const dayNet=daySalesAmt-dayExpAmt;
  /* Cash on hand is cash takings less what was paid out — GCash and credit are
     deliberately left out. They are real revenue (so they belong in Net
     profit) but no notes ever entered the till, so counting them here would
     make the figure impossible to match against a physical count. */
  const cashOnHand=bdown.cash-dayExpAmt;
  const statLbl=isToday?'Today':new Date(selKey+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric'});

  const stats=document.createElement('div');stats.className='stats';
  const statRows=[
    {l:statLbl+' sales',v:fmt(daySalesAmt),c:'color:var(--st)'},
    {l:statLbl+' expenses',v:fmt(dayExpAmt),c:'color:var(--wt)'},
    {l:'Net profit',v:fmt(dayNet),c:dayNet>=0?'color:var(--st)':'color:var(--dt)'},
    {l:'Cash sales',v:fmt(bdown.cash),c:'color:var(--st)'},
    {l:'GCash',v:fmt(bdown.gcash),c:'color:var(--pt)'},
    /* === NEW: Feature 2 — QR gets its own tile beside Cash and GCash. === */
    {l:'QR / InstaPay',v:fmt(bdown.qr),c:'color:var(--ac)'},
    {l:'Cash on hand',v:fmt(cashOnHand),c:cashOnHand>=0?'color:var(--ac)':'color:var(--dt)'}
  ];
  // Credit only earns a tile on days it was actually used.
  if(bdown.credit>0)statRows.push({l:'Credit (unpaid)',v:fmt(bdown.credit),c:'color:var(--wt)'});
  if(bdown.other>0)statRows.push({l:'Other tender',v:fmt(bdown.other),c:'color:var(--t2)'});
  statRows.forEach(function(s){
    const d=document.createElement('div');d.className='stat';
    d.innerHTML='<div class="stat-l">'+esc(s.l)+'</div><div class="stat-v" style="font-size:calc(14px * var(--fs,1));'+s.c+'">'+s.v+'</div>';
    stats.appendChild(d);
  });
  scr.appendChild(stats);

  /* Spells out the arithmetic, because "cash on hand" is otherwise easy to
     read as "everything I took today minus expenses". */
  const cohNote=document.createElement('div');
  cohNote.style.cssText='margin:0 16px 4px;font-size:calc(11.5px * var(--fs,1));color:var(--t3);line-height:1.6';
  const excluded=[];
  if(bdown.gcash>0)excluded.push('GCash '+fmt(bdown.gcash));
  if(bdown.qr>0)excluded.push('QR '+fmt(bdown.qr));   /* NEW: Feature 2 */
  if(bdown.credit>0)excluded.push('credit '+fmt(bdown.credit));
  if(bdown.other>0)excluded.push('other tender '+fmt(bdown.other));
  cohNote.textContent='Cash on hand = cash sales '+fmt(bdown.cash)+' − expenses '+fmt(dayExpAmt)+'.'
    +(excluded.length?' Excludes '+excluded.join(' and ')+' — no notes changed hands.':'')
    +(S.openShift&&dayKey(S.openShift.startedAt)===selKey
      ? ' Add the opening float of '+fmt(S.openShift.openingFloat||0)+' for the full drawer — see Attendance.'
      : '');
  scr.appendChild(cohNote);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'today',lbl:'Today'},{id:'week',lbl:'This week'},{id:'month',lbl:'This month'},{id:'all',lbl:'All time'}].forEach(function(f){
    const p=document.createElement('div');p.className='hpill'+((!S.expDate&&S.expFilter===f.id)?' on':'');p.textContent=f.lbl;
    if(S.expDate)p.style.opacity='0.45';
    p.onclick=function(){S.expFilter=f.id;S.expDate='';render();};
    bar.appendChild(p);
  });
  scr.appendChild(bar);

  scr.appendChild(dayPickerRow(function(){return S.expDate;},function(v){S.expDate=v;}));

  const filtered=S.expenses.filter(function(e){
    const d=new Date(e.date);
    if(S.expDate)return dayKey(d)===S.expDate;
    if(S.expFilter==='today')return d.toDateString()===new Date().toDateString();
    if(S.expFilter==='week'){const w=new Date();w.setDate(w.getDate()-7);return d>=w;}
    if(S.expFilter==='month'){const m=new Date();m.setDate(m.getDate()-30);return d>=m;}
    return true;
  }).slice().reverse();

  // Total for everything currently listed, whatever the period.
  const periodTot=filtered.reduce(function(a,e){return a+(+e.amount||0);},0);
  const ptot=document.createElement('div');
  ptot.style.cssText='display:flex;justify-content:space-between;align-items:center;margin:12px 14px 0;padding:11px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--b1)';
  ptot.innerHTML='<span style="font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px">Total shown</span>'
    +'<span style="font-size:calc(16px * var(--fs,1));font-weight:800;color:var(--wt)">'+fmt(periodTot)+'</span>';
  scr.appendChild(ptot);

  /* Grouped by day with a running subtotal per day, which is what "total
     daily" needs — a flat reversed list gave no way to read a day's spend. */
  const byDay={};
  filtered.forEach(function(e){
    const k=dayKey(e.date);
    if(!byDay[k])byDay[k]=[];
    byDay[k].push(e);
  });
  const dayKeys=Object.keys(byDay).sort().reverse();

  const list=document.createElement('div');list.className='exp-list';
  if(!filtered.length){
    const em=document.createElement('div');em.className='hist-empty';
    em.textContent=S.expDate?'No expenses on this date.':'No expenses recorded.';
    list.appendChild(em);
  }

  dayKeys.forEach(function(k){
    const rows=byDay[k];
    const dTot=rows.reduce(function(a,e){return a+(+e.amount||0);},0);
    const tk=dayKey(new Date()),yk=dayKey(new Date(Date.now()-86400000));
    const lbl=k===tk?'Today':k===yk?'Yesterday'
      :new Date(k+'T00:00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});

    const dh=document.createElement('div');
    dh.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px';
    dh.innerHTML='<span style="font-size:calc(13px * var(--fs,1));font-weight:800;color:var(--t1)">'+esc(lbl)+'</span>'
      +'<span style="font-size:calc(13px * var(--fs,1));font-weight:800;color:var(--wt)">'+fmt(dTot)+'</span>';
    list.appendChild(dh);

    const dsub=document.createElement('div');
    dsub.style.cssText='font-size:calc(11px * var(--fs,1));color:var(--t3);padding:0 2px 8px;line-height:1.6';
    const dayBd=salesOnDayBreakdown(k);
    const parts=[rows.length+' entr'+(rows.length===1?'y':'ies')];
    if(dayBd.total>0){
      parts.push('sales '+fmt(dayBd.total));
      parts.push('net '+fmt(dayBd.total-dTot));
      // The cash line is what a drawer count for that day should come back to.
      parts.push('cash on hand '+fmt(dayBd.cash-dTot));
      if(dayBd.gcash>0)parts.push('GCash '+fmt(dayBd.gcash));
      if(dayBd.qr>0)parts.push('QR '+fmt(dayBd.qr));   /* NEW: Feature 2 */
      if(dayBd.credit>0)parts.push('credit '+fmt(dayBd.credit));
    }
    dsub.textContent=parts.join(' · ');
    list.appendChild(dsub);

    rows.forEach(function(e){
      const row=document.createElement('div');row.className='exp-row';
      row.innerHTML='<div class="exp-dot"></div><div class="exp-info"><div class="exp-name">'+esc(e.name)+'</div>'
        +'<div class="exp-meta">'+esc(e.cat||'General')+' · '
        +new Date(e.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div>'
        +'<div class="exp-amt">'+fmt(e.amount)+'</div>';
      const del=document.createElement('button');del.className='exp-del';del.innerHTML='&times;';
      del.onclick=function(){
        uiConfirm('Delete this expense?',function(__ok){
          if(!__ok)return;
          syncExpenseDeleteToCloud(e);
          S.expenses=S.expenses.filter(function(x){return x.id!==e.id;});
          save();render();
        },{tone:'dang'});
      };
      row.appendChild(del);list.appendChild(row);
    });
  });
  scr.appendChild(list);
}

  if(S.activeCashier){

    cb.title='Tap to check out and count the drawer';

    cb.onclick=function(){
      if(S.openShift)openModal({type:'closeShift'});
      else{
        uiConfirm('End shift for '+S.activeCashier.name+'? No opening float was recorded, so the drawer cannot be reconciled.',function(__ok){
          if(!__ok)return;
          /* v7.5 FIX: this path nulled the cashier out and left them clocked
             in for the rest of the day, which is where most of the runaway
             hours on the Dashboard came from. */
          const _who=S.activeCashier;
          S.activeCashier=null;S.shiftStart=null;save();render();
          attClockOut(_who);
        },{tone:'warn'});
      }
    };
    brand.appendChild(cb);
  }
  nav.appendChild(brand);

  const tabs=document.createElement('div');tabs.className='topnav-tabs';
  [
    {id:'pos',lbl:'POS'},
    {id:'inv',lbl:'Inventory'},
    {id:'prep',lbl:'Prep'},
    {id:'hist',lbl:'History'},
    {id:'exp',lbl:'Expenses'},
    {id:'att',lbl:'Attendance'},
    {id:'admin',lbl:'Admin'},
    {id:'about',lbl:'About'},
  ].forEach(t=>{

    btn.textContent=t.lbl;
    btn.onclick=function(){
      if(t.id==='admin')S.locked=true;
      // Inventory re-locks the moment it is left. Prep is no longer behind
      // the password, so stepping across to it counts as leaving.
      if(t.id!=='inv')S.stockLocked=true;
      S.screen=t.id;S.cartOpen=false;render();
    };
    tabs.appendChild(btn);
  });
  nav.appendChild(tabs);
  app.appendChild(nav);
}

function renderPOS(scr){
  const sq=(S.search||'').toLowerCase();
  const items=S.prods.filter(p=>(S.cat==='All'||p.cat===S.cat)&&(!sq||p.name.toLowerCase().includes(sq)||(p.barcode||'').toLowerCase().includes(sq)));
  /* Order the grid. slice() first — sort() mutates in place, and S.prods is
     the live product list, so sorting it directly would quietly reorder the
     saved data and every other screen along with it.
     Names are compared with localeCompare and numeric:true so "Item 2" comes
     before "Item 10", and case does not split the alphabet in two. */
  const byName=function(a,b){
    return String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
  };
  const priceOf=function(p){
    /* A product with variants has no single price; the tile shows the
       cheapest, so sort on that to match what the cashier sees. A missing or
       junk price sorts as 0 rather than throwing the comparison off. */
    if(p.variants&&p.variants.length){
      const ps=p.variants.map(function(v){var n=Number(v.price);return isFinite(n)?n:0;});
      return ps.length?Math.min.apply(null,ps):0;
    }
    const n=Number(p.price);
    return isFinite(n)?n:0;
  };
  const sorted=items.slice();
  if(S.sort==='price-asc')sorted.sort(function(a,b){return priceOf(a)-priceOf(b)||byName(a,b);});
  else if(S.sort==='price-desc')sorted.sort(function(a,b){return priceOf(b)-priceOf(a)||byName(a,b);});
  else sorted.sort(byName);
  const n=cc();

  // Low stock alert
  const lowItems=lowStockItems();const outItems=outStockItems();
  if((lowItems.length||outItems.length)&&!S.alertDismissed){
    const al=document.createElement('div');al.className='stock-alert';
    const parts=[];if(outItems.length)parts.push(outItems.length+' out of stock');if(lowItems.length)parts.push(lowItems.length+' running low');
    const sp=document.createElement('span');sp.textContent='⚠ '+parts.join(' · ')+' — tap to view';
    const cl=document.createElement('button');cl.className='stock-alert-close';cl.innerHTML='&times;';
    cl.onclick=function(e){e.stopPropagation();S.alertDismissed=true;render();};
    al.appendChild(sp);al.appendChild(cl);al.onclick=function(){S.screen='inv';render();};
    scr.appendChild(al);
  }

  const search=document.createElement('div');search.className='pos-search';
  const inp=document.createElement('input');inp.placeholder='Search products...';inp.value=S.search;
  inp.oninput=function(){S.search=this.value;render();};
  search.appendChild(inp);scr.appendChild(search);

  // Daily goal bar
  if(S.dailyGoal>0){
    const ts=todaySales();const pct=Math.min(100,(ts/S.dailyGoal)*100);const done=pct>=100;
    const gb=document.createElement('div');gb.className='goal-bar';
    gb.innerHTML='<div class="goal-track"><div class="goal-fill" style="width:'+pct+'%'+(done?';background:var(--st)':'')+'"></div></div>'
      +'<div class="goal-labels"><span>'+(done?'🎉 Goal reached!  ':'')+fmt(ts)+' / '+fmt(S.dailyGoal)+'</span><span>'+Math.round(pct)+'%</span></div>';
    scr.appendChild(gb);
  }

  const cats=document.createElement('div');cats.className='pos-cats';
  S.cats.forEach(c=>{
    const pill=document.createElement('div');
    pill.className='cat'+(S.cat===c?' on':'');
    pill.textContent=c;
    pill.onclick=function(){S.cat=c;render();};
    cats.appendChild(pill);
  });
  scr.appendChild(cats);

  /* Sort control. Sits under the category pills so the two filters read as
     one row of controls rather than competing for the header. */
  const sortRow=document.createElement('div');sortRow.className='pos-sort';
  const sortLbl=document.createElement('span');sortLbl.className='pos-sort-l';
  sortLbl.textContent='Sort';
  sortRow.appendChild(sortLbl);
  [['name','Name A–Z'],['price-asc','Price ↑'],['price-desc','Price ↓']].forEach(function(o){
    const b=document.createElement('button');
    b.className='sortb'+(S.sort===o[0]?' on':'');
    b.textContent=o[1];
    b.setAttribute('aria-pressed',S.sort===o[0]?'true':'false');
    b.onclick=function(){
      if(S.sort===o[0])return;
      S.sort=o[0];
      save();          // remembered between sessions
      render();
    };
    sortRow.appendChild(b);
  });
  scr.appendChild(sortRow);

  const grid=document.createElement('div');grid.className='prod-grid';
  grid.style.paddingBottom=n>0?'100px':'12px';
  sorted.forEach(p=>{
    const out=p.stock!==999&&p.stock<=0,low=p.stock!==999&&p.stock>0&&p.stock<=5;
    const effPrice=arroyoEffPrice(p);   /* NEW: Feature 1 — was inline pct-only */
    const card=document.createElement('div');
    card.className='pcard'+(low?' low':'')+(out?' out':'')+(arroyoOnSale(p)?' on-sale':'');
    const inner=document.createElement('div');inner.className='pcard-inner';
    if(arroyoOnSale(p)){const sb=document.createElement('div');sb.className='sale-badge';sb.textContent='SALE '+arroyoSaleBadge(p);inner.appendChild(sb);}
    if(p.img){
      const im=document.createElement('img');im.src=p.img;im.className='pimg';im.onerror=function(){this.style.display='none';};inner.appendChild(im);
    } else {
      const ico=document.createElement('div');ico.className='pico';ico.textContent=p.icon;inner.appendChild(ico);
    }
    const pnm=document.createElement('div');pnm.className='pname';pnm.textContent=p.name;inner.appendChild(pnm);
    if(arroyoOnSale(p)){
      const po=document.createElement('div');po.className='pprice-orig';po.textContent=fmt(p.price);inner.appendChild(po);
      const ps=document.createElement('div');ps.className='pprice-sale';ps.textContent=fmt(effPrice);inner.appendChild(ps);
    } else {
      const pp2=document.createElement('div');pp2.className='pprice';pp2.textContent=fmt(p.price);inner.appendChild(pp2);
    }
    const pst=document.createElement('div');pst.className='pstock';pst.textContent=p.stock===999?'unlimited':out?'out of stock':low?p.stock+' left':p.stock+' in stock';inner.appendChild(pst);
    if(p.variants&&p.variants.length>0){const vh=document.createElement('div');vh.style.cssText='font-size:calc(9px * var(--fs,1));color:var(--pt);font-weight:700;margin-top:2px';vh.textContent=p.variants.length+' variants';inner.appendChild(vh);}
    card.appendChild(inner);
    card.onclick=function(){
      /* v7.7.2: hold this spot in the list. render() throws the grid away and
         builds a new one, which starts at the top, so the cashier had to
         scroll back down to find the next item on the order. */
      captureScroll();
      if(p.variants&&p.variants.length>0){openModal({type:'variantPick',prod:p});return;}
      /* v7.7.4: out of stock is refused HERE, not only by
         .pcard.out{pointer-events:none}. A CSS-only guard is one overridden
         rule away from selling stock that does not exist, and this very
         selector is already re-declared further down the stylesheet to
         restore its opacity — so the protection was sitting on a rule that
         another rule was editing. The tile is still styled as disabled;
         this is the part that actually enforces it. */
      if(availUnits(p,null)<=0){toast(p.name+' is out of stock');return;}
      /* === NEW: Feature 3/4/5 — ask the modifier questions before the line
         reaches the cart. Placed AFTER the out-of-stock refusal so a sold-out
         product never opens a flavour picker the cashier cannot complete. === */
      if(arroyoHasMods(p)){
        openModal({type:'modPick',prod:p,variantLabel:'',basePrice:effPrice,
          origPrice:arroyoOnSale(p)?p.price:null,salePct:p.salePct||0,saleAmt:p.saleAmt||0});
        return;
      }
      if(cartAdd(p,null,{id:p.id,name:p.name,price:effPrice,qty:1,note:'',cat:p.cat||'Uncategorised',origPrice:arroyoOnSale(p)?p.price:null,salePct:p.salePct||0,saleAmt:p.saleAmt||0}))toast(p.name+' added');
      render();
    };
    grid.appendChild(card);
  });
  scr.appendChild(grid);

  if(n>0){
    const fab=document.createElement('button');fab.className='cart-fab';
    fab.innerHTML='<div class="fab-info"><div class="fab-count">'+n+' item'+(n>1?'s':'')+' in cart</div><div class="fab-total">'+fmt(tot())+'</div></div><div class="fab-lbl">View cart</div>';
    fab.onclick=function(){S.cartOpen=true;render();};
    scr.appendChild(fab);
  }
}

function renderCart(scr){
  const n=cc();

  const hd=document.createElement('div');hd.className='cart-hd';
  const back=document.createElement('button');back.className='cart-back';back.textContent='Back';
  back.onclick=function(){S.cartOpen=false;render();};
  const title=document.createElement('div');title.className='cart-title';title.textContent='Cart ('+n+')';
  hd.appendChild(back);hd.appendChild(title);
  if(n>0){
    const clr=document.createElement('button');clr.className='cart-clear';clr.textContent='Clear';
    clr.onclick=function(){S.cart=[];S.disc=0;S.discType='%';S.cashTendered=0;S.cartOpen=false;render();};
    hd.appendChild(clr);
  }
  scr.appendChild(hd);

  const items=document.createElement('div');items.className='cart-items';
  if(n===0){const e=document.createElement('div');e.className='cart-empty';e.textContent='Cart is empty';items.appendChild(e);}
  S.cart.forEach((it,idx)=>{
    const row=document.createElement('div');row.className='ci';
    const info=document.createElement('div');info.className='ci-info';
    const nm=document.createElement('div');nm.className='ci-name';nm.textContent=it.name+(it.variantLabel?' ('+it.variantLabel+')':'');
    const pr=document.createElement('div');pr.className='ci-price';pr.textContent=fmt(it.price)+' each';
    info.appendChild(nm);info.appendChild(pr);
    /* === NEW: Feature 3/4/5 — variant summary on its own line, above the
       note, so a long flavour list does not push the price out of view. === */
    if(it.modLabel){
      const md=document.createElement('div');
      md.style.cssText='font-size:calc(11px * var(--fs,1));font-weight:600;color:var(--pt);margin-top:2px;line-height:1.35';
      md.textContent=it.modLabel;info.appendChild(md);
    }
    if(it.note){const nt=document.createElement('div');nt.className='ci-note';nt.textContent='📝 '+it.note;info.appendChild(nt);}
    const nb=document.createElement('button');nb.className='ci-note-btn';nb.textContent=it.note?'edit note':'+ note';nb.onclick=function(){openModal({type:'itemNote',idx});};
    info.appendChild(nb);
    row.appendChild(info);
    const qty=document.createElement('div');qty.className='ci-qty';
    const bm=document.createElement('button');bm.className='qb';bm.textContent='-';
    bm.onclick=(function(i){return function(){captureScroll();cartSetQty(i,-1);render();};})(idx);
    const num=document.createElement('span');num.className='qnum';num.textContent=it.qty;
    const bp=document.createElement('button');bp.className='qb';bp.textContent='+';
    bp.onclick=(function(i){return function(){captureScroll();cartSetQty(i,1);render();};})(idx);
    qty.appendChild(bm);qty.appendChild(num);qty.appendChild(bp);
    const sub2=document.createElement('div');sub2.className='ci-sub';sub2.textContent=fmt(it.price*it.qty);
    row.appendChild(qty);row.appendChild(sub2);
    items.appendChild(row);
  });
  scr.appendChild(items);

  const foot=document.createElement('div');foot.className='cart-foot';

  // Discount input + type selector
  const dw=document.createElement('div');dw.className='disc-wrap';
  const di=document.createElement('input');di.type='number';di.min='0';di.placeholder='Discount amount';di.value=S.disc||'';di.id='discInp';
  const ds=document.createElement('select');ds.id='discTypeSel';
  ['%','flat'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===S.discType)o.selected=true;ds.appendChild(o);});
  dw.appendChild(di);dw.appendChild(ds);foot.appendChild(dw);

  // Quick % shortcut buttons
  const dq=document.createElement('div');dq.className='disc-quick';
  [5,10,15,20,25,30,50].forEach(pct=>{
    const qb=document.createElement('button');
    qb.className='disc-qbtn'+(S.disc===pct&&S.discType==='%'?' active':'');
    qb.textContent=pct+'%';
    qb.onclick=function(){
      if(S.disc===pct&&S.discType==='%'){S.disc=0;di.value='';}
      else{S.disc=pct;S.discType='%';di.value=pct;ds.value='%';}
      buildPreview(S.disc,S.discType);
      dq.querySelectorAll('.disc-qbtn').forEach(b=>{b.className='disc-qbtn'+(b.textContent===S.disc+'%'&&S.discType==='%'?' active':'');});
    };
    dq.appendChild(qb);
  });
  foot.appendChild(dq);

  // Live preview box
  const prev=document.createElement('div');prev.className='disc-preview';
  function buildPreview(discVal,discTypeVal){
    discVal=Math.max(0,discVal||0);
    const s2=sub();
    const da=discTypeVal==='%'?s2*Math.min(discVal,100)/100:Math.min(discVal,s2);
    const total2=s2-da;
    prev.innerHTML='';
    const r1=document.createElement('div');r1.className='disc-row-live';
    r1.innerHTML='<span>Subtotal</span><span>'+fmt(s2)+'</span>';prev.appendChild(r1);
    if(da>0){
      const r2=document.createElement('div');r2.className='disc-row-live saving';
      const label='Discount '+(discTypeVal==='%'?'('+Math.min(Math.round(discVal),100)+'%)':'(flat)');
      r2.innerHTML='<span>'+label+'</span><span>- '+fmt(da)+'</span>';prev.appendChild(r2);
    }

  scr.appendChild(ahd);

  // Load cloud employees for this business
  const empList=S.cloudAttEmployees||[];

  if(!CLOUD.token||!CLOUD.bizId){
    const msg=document.createElement('div');msg.style.cssText='padding:8px 16px 28px;text-align:center;color:var(--t3);font-size:calc(14px * var(--fs,1))';msg.textContent='Sign in to cloud to use attendance tracking.';scr.appendChild(msg);return;
  }

  // Show current status of each employee

  const stHd=document.createElement('div');stHd.style.cssText='font-size:calc(13px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px';stHd.textContent='Today\'s status';
  statusCard.appendChild(stHd);

  if(!empList.length){
    statusCard.appendChild(document.createTextNode('No employees found. Add employees in the dashboard first.'));
  }
  empList.forEach(function(e){
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b1)';
    const info=document.createElement('div');
    const dot=document.createElement('span');dot.style.cssText='display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:'+(e.clockedIn?'var(--st)':'var(--t3)');
    const name=document.createElement('span');name.style.cssText='font-size:calc(15px * var(--fs,1));font-weight:600';name.textContent=e.name;
    const sub=document.createElement('div');sub.style.cssText='font-size:calc(12px * var(--fs,1));color:var(--t3);margin-top:3px;margin-left:16px';
    sub.textContent=e.clockedIn?'Clocked in at '+e.timeIn:'Not clocked in';
    info.appendChild(dot);info.appendChild(name);info.appendChild(sub);
    const btn=document.createElement('button');
    btn.style.cssText='padding:10px 18px;border-radius:10px;border:none;font-size:calc(13px * var(--fs,1));font-weight:700;cursor:pointer;'+(e.clockedIn?'background:var(--dg);color:var(--dt)':'background:var(--sg);color:var(--st)');
    btn.textContent=e.clockedIn?'Clock Out':'Clock In';
    btn.onclick=async function(){
      btn.disabled=true;btn.style.opacity='0.5';
      const h2={...cloudHeaders(),'Prefer':'return=representation'};
      /* v7.7.1 FIX: was the UTC date; attendance rows are keyed on the local
         one, so early-morning records were invisible to this lookup. */
      const today=todayKeyLocal();
      if(e.clockedIn){
        // Clock out - find the open attendance record
        const attRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&employee_id=eq.'+e.id+'&date=eq.'+today+'&time_out=is.null&order=time_in.desc&limit=1',{headers:h2});
        const attData=await attRes.json();
        if(attData&&attData[0]){
          const timeIn=new Date(attData[0].time_in);const timeOut=new Date();
          const hrs=Math.round((timeOut-timeIn)/36000)/100;
          await fetch(SUPA_URL+'/rest/v1/attendance?id=eq.'+attData[0].id,{method:'PATCH',headers:h2,body:JSON.stringify({time_out:timeOut.toISOString(),hours_worked:hrs})});
        }
        e.clockedIn=false;e.timeIn='';
        toast(e.name+' clocked out');
      } else {
        // Check if already clocked in today (prevent duplicates)
        const checkRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&employee_id=eq.'+e.id+'&date=eq.'+today+'&time_out=is.null',{headers:h2});
        const existing=await checkRes.json();
        if(existing&&existing.length>0){toast(e.name+' is already clocked in!');btn.disabled=false;btn.style.opacity='1';return;}
        // Clock in
        await fetch(SUPA_URL+'/rest/v1/attendance',{method:'POST',headers:h2,body:JSON.stringify({biz_id:CLOUD.bizId,employee_id:e.id,employee_name:e.name,time_in:new Date().toISOString(),date:today})});
        e.clockedIn=true;e.timeIn=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        toast(e.name+' clocked in');
      }
      btn.disabled=false;btn.style.opacity='1';
      btn.textContent=e.clockedIn?'Clock Out':'Clock In';
      btn.style.background=e.clockedIn?'var(--dg)':'var(--sg)';
      btn.style.color=e.clockedIn?'var(--dt)':'var(--st)';
      sub.textContent=e.clockedIn?'Clocked in at '+e.timeIn:'Not clocked in';
      dot.style.background=e.clockedIn?'var(--st)':'var(--t3)';
    };
    row.appendChild(info);row.appendChild(btn);statusCard.appendChild(row);
  });
  scr.appendChild(statusCard);

  // Refresh button to reload employees
  const refBtn=document.createElement('button');refBtn.className='abtn';refBtn.textContent='Refresh employees';
  refBtn.style.cssText='width:100%;padding:14px;font-size:calc(14px * var(--fs,1));font-weight:700;border-radius:12px;cursor:pointer';
  refBtn.onclick=async function(){
    refBtn.textContent='Loading...';refBtn.disabled=true;
    toast('Loading employees...');
    try{
      await loadAttEmployees();
      if(S.cloudAttEmployees&&S.cloudAttEmployees.length>0){
        toast('Found '+S.cloudAttEmployees.length+' employee(s)');
      } else {
        toast('No employees found in Supabase');
      }
    }catch(e){toast('Error: '+e.message);}
    render();
  };
  scr.appendChild(refBtn);
}

async function loadAttEmployees(){
  if(!CLOUD.token){toast('Not signed in to cloud');return;}
  if(!CLOUD.bizId){
    try{
      const h2={...H,'Authorization':'Bearer '+CLOUD.token};
      const bizRes=await fetch(SUPA_URL+'/rest/v1/businesses?user_id=eq.'+CLOUD.user,{headers:h2});
      const bizData=await bizRes.json();
      if(bizData&&bizData[0]){CLOUD.bizId=bizData[0].id;save();}
      else{toast('No business found for this account');return;}
    }catch(e){toast('Could not find business');return;}
  }
  try{
    // Use authenticated headers so RLS allows reading employees
    const h2=cloudHeaders();
    /* v7.7.1 FIX: same UTC-vs-local defect on the attendance list itself. A
       cashier who clocked in at 06:00 showed as "Not clocked in" until 08:00. */
    const today=todayKeyLocal();
    const empRes=await fetch(SUPA_URL+'/rest/v1/employees?biz_id=eq.'+CLOUD.bizId+'&active=eq.true&order=name',{headers:h2});
    const emps=await empRes.json();
    if(!Array.isArray(emps)||emps.length===0){
      toast('BizID: '+CLOUD.bizId+' — 0 employees');
      S.cloudAttEmployees=[];return;
    }
    const attRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&date=eq.'+today,{headers:h2});
    const att=await attRes.json();
    S.cloudAttEmployees=emps.map(function(e){
      const todayAtt=Array.isArray(att)?att.filter(function(a){return a.employee_id===e.id&&!a.time_out;}):[];
      const latest=todayAtt.length>0?todayAtt[todayAtt.length-1]:null;
      return{id:e.id,name:e.name,role:e.role,clockedIn:!!latest,timeIn:latest?new Date(latest.time_in).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''};
    });
    // Auto-sync Cashier-role employees into the local cashiers list
    const cashierEmps=emps.filter(function(e){return e.role&&e.role.toLowerCase()==='cashier';});
    cashierEmps.forEach(function(e){
      const alreadyExists=S.cashiers.some(function(c){return c.name===e.name;});
      if(!alreadyExists){
        S.cashiers.push({id:S.cashierNid++,name:e.name,supaId:e.id});
        save();
      }
    });
    // Also remove from cashiers list if removed from Supabase (was cashier but no longer active)
    const allNames=emps.filter(function(e){return e.role&&e.role.toLowerCase()==='cashier';}).map(function(e){return e.name;});
    S.cashiers=S.cashiers.filter(function(c){
      // Keep manually added cashiers (no supaId) and active Supabase cashiers
      return !c.supaId||allNames.includes(c.name);
    });
    // If the active cashier was deactivated in Supabase, end their shift now
    if(S.activeCashier&&S.activeCashier.supaId&&!allNames.includes(S.activeCashier.name)){
      /* The drawer is deliberately NOT discarded. An open float that vanishes
         because someone edited the employee list on the Dashboard would erase
         the only record of what the cashier was holding, so the shift is
         closed as unreconciled and kept for review. */
      if(S.openShift){
        const b=shiftSalesBreakdown(S.openShift);
        const po=shiftPaidOut(S.openShift);
        S.shiftLog.push(Object.assign({},S.openShift,{
          endedAt:new Date().toISOString(),paidOut:po,
          expected:Math.round(expectedDrawer(S.openShift,po)*100)/100,
          countedCash:null,variance:0,unreconciled:true,
          cashSales:b.cash,gcashSales:b.gcash,qrSales:b.qr,creditSales:b.credit,
          otherSales:b.other,totalSales:b.total,txCount:b.count,
          closeNote:'Cashier deactivated on the Dashboard — drawer never counted',
          cloudSynced:false
        }));
        S.openShift=null;
      }
      /* Same as the Remove path: end the shift *and* the clock-in. */
      var _who=S.activeCashier;
      S.activeCashier=null;S.shiftStart=null;
      attClockOut(_who);
      if(S.shiftLog.length)finalizeShift(S.shiftLog[S.shiftLog.length-1],_who);
    }
    save();
  }catch(e){toast('Error loading employees: '+e.message);}
}

      const sl=document.createElement('div');sl.style.cssText='font-size:calc(9px * var(--fs,1));color:var(--df);font-weight:700';sl.textContent=arroyoSaleBadge(p)+' SALE';
      pd.appendChild(po);pd.appendChild(ps);pd.appendChild(sl);ir.appendChild(pd);
    } else {
      const pr2=document.createElement('div');pr2.className='inv-price';pr2.textContent=fmt(p.price);ir.appendChild(pr2);
    }

    // Stock badge
    const badge=document.createElement('span');
    badge.className='badge '+(out?'b-out':low?'b-low':'b-ok');
    badge.textContent=p.stock===999?'inf':out?'out':low?p.stock+' low':p.stock;
    ir.appendChild(badge);

    // Edit + Delete buttons — created with proper onclick, no querySelectorAll needed
    const acts=document.createElement('div');acts.className='acts';
    const edBtn=document.createElement('button');edBtn.className='act';edBtn.textContent='ED';
    edBtn.onclick=function(){openModal({type:'prod',prod:JSON.parse(JSON.stringify(p))});};
