/* v7.7.1: this function used to write the utang charge and the loyalty points
   from the till:

     credit_balance: cust.credit_balance + tx.total

   a read-modify-write of an absolute figure, taken from whatever this device
   last pulled, with an empty catch around it. Two tills serving the same
   customer lost one charge every time, a failure was invisible, and NOTHING
   reversed either the charge or the points when the sale was voided or
   deleted - so a customer's balance drifted permanently.

   The sale row now carries customer_id and the database does all of it in the
   same transaction as the sale (arroyo_customer_apply), keyed on txn_id so a
   replayed upload cannot charge twice, and reversed by the void and delete
   triggers. The local mirror is refreshed instead of written. */
async function recordCustomerSale(tx){
  if(!CLOUD.token||!CLOUD.bizId||!tx||!tx.customerId)return;
  /* Let the sale insert (and its trigger) land first, then re-read the balance
     and points the database arrived at. */
  setTimeout(function(){loadCloudCustomers();},2000);
}

/* ==================================================================== *
 * PREPARATION — raw ingredients and the recipes that consume them.
 *
 * Ingredients are held locally so the till keeps deducting stock when the
 * connection drops; the cloud copy is a mirror, pushed on a best effort.
 * This used to read recipes straight from Supabase on every sale, which
 * meant an offline till silently stopped tracking ingredient usage.
 * ==================================================================== */

function ingById(id){
  for(var i=0;i<S.ings.length;i++)if(S.ings[i].id===id)return S.ings[i];
  return null;
}
function ingLevel(i){
  var st=+i.stock||0, lo=(i.low===undefined||i.low===null)?0:+i.low;
  if(st<=0)return 'out';
  if(lo>0&&st<=lo)return 'low';
  return 'ok';
}
function lowIngs(){return S.ings.filter(function(i){return ingLevel(i)==='low';});}
function outIngs(){return S.ings.filter(function(i){return ingLevel(i)==='out';});}
function recipesFor(name){return S.recipes.filter(function(r){return r.prod===name;});}

// Rounds away binary-float drift so 0.1 + 0.2 never shows as 0.30000000000000004.
function ingRound(n){return Math.round((+n||0)*1000)/1000;}
function ingQtyStr(n,unit){
  var v=ingRound(n);
  return (Number.isInteger(v)?v:v.toFixed(2).replace(/0$/,''))+(unit?' '+unit:'');
}

// How many of a product the current ingredient stock can still produce.
// null = this product has no recipe, so its own stock count governs it.
function buildable(prodName){
  var rs=recipesFor(prodName);
  if(!rs.length)return null;
  var min=Infinity, counted=false;
  for(var k=0;k<rs.length;k++){
    var per=+rs[k].qty||0;
    if(per<=0)continue;              // a zero-quantity line consumes nothing
    var ing=ingById(rs[k].ingId);
    if(!ing)return 0;                // ingredient deleted — cannot be made
    counted=true;
    min=Math.min(min,Math.floor((+ing.stock||0)/per));
  }
  return counted?Math.max(0,min):null;
}

/* Applies a sale (dir = -1) or a void (dir = +1) to ingredient stock.
   Returns the ingredients it touched so the caller can mirror them up. */
/* Returns the deltas actually applied, as [{id,delta}], for the same reason
   applyStockDelta does: the clamp at zero means a sale that ran an
   ingredient down to nothing moved it by less than the recipe called for,
   and a void that added the full recipe amount back would invent stock.
   Pass that list back as `applied` on the void to reverse it exactly. */
function consumeIngredients(items,dir,applied){
  if(!S.ings.length)return [];
  var touched={},deltas=[];
  if(applied&&applied.length&&dir>0){
    applied.forEach(function(a){
      var ing=ingById(a.id);
      if(!ing)return;
      ing.stock=Math.max(0,ingRound((+ing.stock||0)-(+a.delta||0)));
      touched[ing.id]=ing;
    });
  } else {
    /* v7.8 CHANGE (Feature 3): the `!S.recipes.length` half of this guard was
       removed. Modifier seasonings are carried on the sale item itself and
       have no recipe row, so a shop that uses flavours but has never built a
       recipe was returning here and deducting nothing at all. recipesFor()
       already yields an empty list when there are no recipes, so dropping the
       short-circuit costs one no-op loop and nothing else. */
    if(!Array.isArray(items))return [];
    items.forEach(function(it){
      var sold=+it.qty||0;
      if(sold<=0)return;
      /* Shared bookkeeping for both the recipe lines and the modifier lines
         below, so a seasoning that appears in both is summed into one delta
         and a later void reverses it exactly once. */
      var take=function(ing,per){
        if(!ing||per<=0)return;
        var before=+ing.stock||0;
        ing.stock=Math.max(0,ingRound(before+dir*per*sold));
        var moved=ingRound(ing.stock-before);
        var prev=null;
        for(var k=0;k<deltas.length;k++)if(deltas[k].id===ing.id){prev=deltas[k];break;}
        if(prev)prev.delta=ingRound(prev.delta+moved);
        else deltas.push({id:ing.id,delta:moved});
        touched[ing.id]=ing;
      };
      recipesFor(it.name).forEach(function(r){
        take(ingById(r.ingId),+r.qty||0);
      });
      /* === NEW: Feature 3 — flavour seasonings, resolved on the line at
         checkout and carried on the sale item. Matched on name because a
         modifier has no recipe row. Like the recipe mirror above this is
         optimistic only: arroyo_apply_stock in the database is the single
         writer and refreshStockFromCloud() corrects any drift, which is also
         why no unit conversion is attempted here. An unknown ingredient name
         is skipped rather than blocking the sale. === */
      (it.modIngs||[]).forEach(function(r){
        var want=arroyoNorm(r.name);
        if(!want)return;
        var ing=null;
        for(var q=0;q<S.ings.length;q++){
          if(arroyoNorm(S.ings[q].name)===want){ing=S.ings[q];break;}
        }
        take(ing,+r.qty||0);
      });
    });
  }
  var list=Object.keys(touched).map(function(k){return touched[k];});
  if(list.length){save();pushIngStock(list);}
  return deltas;
}

/* v7.5 FIX: this used to PATCH an absolute ingredient figure after every
   sale. Two tills selling at the same moment each read the same starting
   level, each subtracted its own sale and each wrote the result, so one
   sale's consumption was silently lost — the single biggest cause of
   ingredient counts that did not match the shelf. It also skipped any
   ingredient that had never been pushed, without saying so.

   The database now deducts ingredients from the sale row via `recipes`
   (arroyo_apply_stock in setup.sql), which is one writer and therefore
   cannot lose an update. This reads the result back instead of writing. */
async function pushIngStock(list){
  scheduleStockRefresh();
}

/* Product stock moved by a sale or a void. applyStockDelta() only touches the
   local copy, and the full push in saveProductsToCloud() may not run for
   hours — so the Dashboard's Inventory page sat on whatever stock figure was
   current at the last full sync. This PATCHes just the stock column (and
   variants, which carry their own per-variant stock) so the back office sees
   the movement straight away.

   Matched on local_id, the same key saveProductsToCloud() merges on. Only the
   stock columns are written, so nothing the Dashboard owns is overwritten. */
async function pushProductStock(items){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(!items||!items.length)return;
  // Collapse to one PATCH per product, however many cart lines touched it.
  var seen={},list=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var p=S.prods.find(function(x){return it.id!==undefined?x.id===it.id:x.name===it.name;});
    if(!p||p.id===undefined||p.id===null)continue;
    if(seen[p.id])continue;
    seen[p.id]=true;list.push(p);
  }
  if(!list.length)return;
  /* v7.5 FIX: this wrote an absolute stock number while the INSERT trigger on
     `sales` was deducting the same sale server-side. The two raced: if the
     PATCH landed first the trigger deducted a second time, so the item went
     down by twice what was sold; if it landed second it overwrote the
     trigger's work and masked any sale another till had just made. Either
     way the count was wrong, and which way round it went varied with the
     network.

     Deduction is the database's job now, done once from the sale row.
     Nothing is written here — the till re-reads the figure the database
     arrived at. The local copy has already been adjusted optimistically by
     applyStockDelta(), so the screen is right immediately either way. */
  scheduleStockRefresh();
}
/* The unit cost column is named cost_per_unit — that is what the Dashboard
   writes and what its COGS, margin and P&L figures read. This used to send a
   plain `cost`, which PostgREST rejects as an unknown column, so every write
   fell through to the lean payload below and unit, low_threshold and cost
   never reached the Dashboard at all. */
/* One write attempt. On failure the body is read and kept, so a caller can
   report *why* instead of the old bare `return` that discarded everything. */
async function prepAttempt(method,url,body,last){
  /* `Prefer: return=representation` is now always sent. Without it a PATCH
     against an id that no longer exists in the cloud comes back 200 with an
     empty body, which the old code read as success — so a local row holding
     a stale cloudId reported "synced" on every attempt while never actually
     writing anything. Callers can now see that no row came back and fall
     back to an INSERT. */
  var hdrs={...cloudHeaders(),'Prefer':'return=representation'};
  var r=await fetch(SUPA_URL+url,{method:method,headers:hdrs,body:JSON.stringify(body)});
  if(r.ok){
    var rows=null;
    try{rows=await r.clone().json();}catch(e){}
    return {ok:true,res:r,rows:rows,empty:Array.isArray(rows)&&rows.length===0};
  }
  var t='';
  try{t=await r.text();}catch(e){}
  last.status=r.status;last.msg=(t||'').slice(0,200);
  return {ok:false,res:r,body:t};
}
function prepIsDuplicate(last){
  return last.status===409||String(last.msg||'').indexOf('23505')>-1||
         String(last.msg||'').toLowerCase().indexOf('duplicate key')>-1;
}

async function saveIngToCloud(ing){
  if(!CLOUD.token||!CLOUD.bizId)return {ok:false,msg:'not signed in to the cloud'};
  if(!navigator.onLine)return {ok:false,msg:'device is offline'};
  var full={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock,unit:ing.unit||'',
            cost_per_unit:+ing.cost||0,low_threshold:+ing.low||0};
  // Middle tier: drop only the cost column. The old code jumped straight to
  // name+stock, silently throwing away the unit and the low-stock threshold.
  var mid={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock,unit:ing.unit||'',low_threshold:+ing.low||0};
  var lean={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock};
  /* v7.7.1 FIX: the same absolute-write fault as products, and worse, because
     pushPrepData() loops EVERY ingredient rather than only the dirty ones - so
     one full sync wrote this till's ingredient levels over the server's,
     undoing recipe consumption recorded by every other till. An UPDATE never
     carries stock now. An INSERT still does: a row the cloud has never held
     needs its opening level from somewhere. */
  var stripStock=function(o){var c=Object.assign({},o);delete c.stock;return c;};
  var last={status:0,msg:''};
  try{
    if(ing.cloudId!==null&&ing.cloudId!==undefined){
      var u='/rest/v1/ingredients?id=eq.'+encodeURIComponent(ing.cloudId);
      var a=await prepAttempt('PATCH',u,stripStock(full),last);
      if(!a.ok)a=await prepAttempt('PATCH',u,stripStock(mid),last);
      if(!a.ok)a=await prepAttempt('PATCH',u,stripStock(lean),last);
      /* An empty result means the id is stale — the row was removed on the
         Dashboard, or this device is holding an id from another business.
         Drop it and fall through to an INSERT rather than reporting a
         success that wrote nothing. */
      if(a.ok&&a.empty){ing.cloudId=null;save();}
      else if(a.ok){ing.syncDirty=false;save();return {ok:true};}
      else return {ok:false,status:last.status,msg:last.msg};
    }
    var c=await prepAttempt('POST','/rest/v1/ingredients',full,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/ingredients',mid,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/ingredients',lean,last);
    if(!c.ok){
      /* A duplicate name means the row is already up there under an id this
         device never recorded. Claim that id rather than reporting a failure
         and leaving every recipe that points here permanently blocked. */
      if(prepIsDuplicate(last)){
        try{
          var f=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId+'&name=eq.'+encodeURIComponent(ing.name),{headers:cloudHeaders()});
          if(f.ok){
            var ex=await f.json();
            if(Array.isArray(ex)&&ex[0]&&ex[0].id!=null){ing.cloudId=ex[0].id;ing.syncDirty=false;save();return {ok:true,adopted:true};}
          }
        }catch(e){}
      }
      return {ok:false,status:last.status,msg:last.msg||'write rejected'};
    }
    var rows=c.rows;
    if(rows===null||rows===undefined){try{rows=await c.res.json();}catch(e){}}
    if(Array.isArray(rows)&&rows[0]&&rows[0].id!==undefined){ing.cloudId=rows[0].id;ing.syncDirty=false;save();return {ok:true};}
    return {ok:false,status:0,msg:'saved but the server returned no id'};
  }catch(e){return {ok:false,status:0,msg:(e&&e.message)||'network error'};}
}

/* A recipe line can only be written once its ingredient holds a cloud id.
   Every caller used to fire saveRecipeToCloud() straight after creating a
   brand-new ingredient, while that ingredient's own POST was still in
   flight — so the recipe came back "blocked", the result was thrown away
   unread, and the line never reached the Dashboard. This resolves the
   ingredient first and reports honestly. */
async function ensureIngCloudId(ing){
  if(!ing)return false;
  if(ing.cloudId!==null&&ing.cloudId!==undefined)return true;
  var r=await saveIngToCloud(ing);
  return !!(r&&r.ok&&ing.cloudId!==null&&ing.cloudId!==undefined);
}

async function delIngFromCloud(ing){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(ing.cloudId===null||ing.cloudId===undefined)return;
  try{
    var ch=cloudHeaders(), cid=encodeURIComponent(ing.cloudId);
    // Recipe lines first, or they would point at an ingredient that is gone.
    await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId+'&ingredient_id=eq.'+cid,{method:'DELETE',headers:ch});
    await fetch(SUPA_URL+'/rest/v1/ingredients?id=eq.'+cid,{method:'DELETE',headers:ch});
  }catch(e){}
}

async function saveRecipeToCloud(r){
  if(!CLOUD.token||!CLOUD.bizId)return {ok:false,msg:'not signed in to the cloud'};
  if(!navigator.onLine)return {ok:false,msg:'device is offline'};
  var ing=ingById(r.ingId);
  if(!ing)return {ok:false,msg:'its ingredient no longer exists on this device'};
  /* Push the ingredient up first if it has never been written. Previously
     this returned "blocked" and gave up, which is why a recipe added in the
     same breath as a new ingredient could never sync — nothing ever came
     back to retry it. */
  if(ing.cloudId===null||ing.cloudId===undefined){
    var okIng=await ensureIngCloudId(ing);
    if(!okIng)return {ok:false,blocked:true,msg:'is waiting on ingredient "'+(ing.name||'?')+'" to sync first'};
  }
  /* ingredient_name is denormalised alongside ingredient_id — the Dashboard
     always writes it, so a row created here without it left a null the
     Dashboard's recipe list and reports read as blank. */
  var row={biz_id:CLOUD.bizId,product_name:r.prod,ingredient_id:ing.cloudId,
           ingredient_name:ing.name||'',qty_used:+r.qty||0};
  var lean={biz_id:CLOUD.bizId,product_name:r.prod,ingredient_id:ing.cloudId,qty_used:+r.qty||0};
  var last={status:0,msg:''};
  try{
    if(r.cloudId!==null&&r.cloudId!==undefined){
      var u='/rest/v1/recipes?id=eq.'+encodeURIComponent(r.cloudId);
      var a=await prepAttempt('PATCH',u,row,last);
      if(!a.ok)a=await prepAttempt('PATCH',u,lean,last);
      /* Empty result = the line is gone from the cloud (commonly removed on
         the Dashboard). Forget the id and insert it again instead of
         reporting a silent success forever. */
      if(a.ok&&a.empty){r.cloudId=null;save();}
      else if(a.ok){r.syncDirty=false;save();return {ok:true};}
      else return {ok:false,status:last.status,msg:last.msg};
    }
    var c=await prepAttempt('POST','/rest/v1/recipes',row,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/recipes',lean,last);
    if(!c.ok){
      // Same line already up there (usually added from the Dashboard) — claim
      // its id instead of failing forever.
      if(prepIsDuplicate(last)){
        try{
          var f=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId
            +'&product_name=eq.'+encodeURIComponent(r.prod)
            +'&ingredient_id=eq.'+encodeURIComponent(ing.cloudId),{headers:cloudHeaders()});
          if(f.ok){
            var ex=await f.json();
            if(Array.isArray(ex)&&ex[0]&&ex[0].id!=null){r.cloudId=ex[0].id;r.syncDirty=false;save();return {ok:true,adopted:true};}
          }
        }catch(e){}
      }
      return {ok:false,status:last.status,msg:last.msg||'write rejected'};
    }
    var rows=c.rows;
    if(rows===null||rows===undefined){try{rows=await c.res.json();}catch(e){}}
    if(Array.isArray(rows)&&rows[0]&&rows[0].id!==undefined){r.cloudId=rows[0].id;r.syncDirty=false;save();return {ok:true};}
    return {ok:false,status:0,msg:'saved but the server returned no id'};
  }catch(e){return {ok:false,status:0,msg:(e&&e.message)||'network error'};}
}

async function delRecipeFromCloud(r){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(r.cloudId===null||r.cloudId===undefined)return;
  try{
    await fetch(SUPA_URL+'/rest/v1/recipes?id=eq.'+encodeURIComponent(r.cloudId),{method:'DELETE',headers:cloudHeaders()});
  }catch(e){}
}

/* ==================================================================== *
 * PREP SYNC RETRY
 *
 * Ingredients and recipe lines used to be written with a bare
 * `saveRecipeToCloud(r)` — no await, no look at the result. Anything that
 * failed (offline, expired session, ingredient not yet in the cloud) was
 * gone: nothing recorded the failure, so nothing ever tried again, and the
 * till kept showing "Recipe line added" while the Dashboard stayed empty.
 *
 * Every local write now marks the row dirty and clears the mark only once
 * the cloud has confirmed it. Anything still dirty is retried on reconnect,
 * on sign-in and on a slow timer, and the Prep tab shows the outstanding
 * count so a failure is visible instead of silent.
 * ==================================================================== */
function markIngDirty(ing){if(ing)ing.syncDirty=true;}
function markRecipeDirty(r){if(r)r.syncDirty=true;}

function prepPendingCount(){
  var n=0;
  (S.ings||[]).forEach(function(i){if(i.syncDirty||i.cloudId===null||i.cloudId===undefined)n++;});
  (S.recipes||[]).forEach(function(r){if(r.syncDirty||r.cloudId===null||r.cloudId===undefined)n++;});
  return n;
}

/* Writes one ingredient and reports the outcome to the person at the till. */
async function syncIngNow(ing,quiet){
  markIngDirty(ing);save();
  if(!CLOUD.token||!CLOUD.bizId){if(!quiet)toast('Saved on this device — sign in to sync');return false;}
  if(!navigator.onLine){if(!quiet)toast('Saved offline — will sync when back online');return false;}
  var res=await saveIngToCloud(ing);
  if(res&&res.ok){if(!quiet)toast('Ingredient synced');render();return true;}
  if(!quiet)toast('Sync failed: '+((res&&res.msg)||'unknown')+' — will retry');
  render();
  return false;
}

/* Writes one recipe line, pulling its ingredient up first if it has never
   been synced. This is the path the recipe modal now awaits. */
async function syncRecipeNow(r,quiet){
  markRecipeDirty(r);save();
  if(!CLOUD.token||!CLOUD.bizId){if(!quiet)toast('Saved on this device — sign in to sync');return false;}
  if(!navigator.onLine){if(!quiet)toast('Saved offline — will sync when back online');return false;}
  var res=await saveRecipeToCloud(r);
  if(res&&res.ok){if(!quiet)toast('Recipe synced to Dashboard');render();return true;}
  if(!quiet)toast('Recipe sync failed: '+((res&&res.msg)||'unknown')+' — will retry');
  render();
  return false;
}

var PREP_RETRY_RUNNING=false;
/* Retries everything still outstanding. Ingredients go first — a recipe line
   cannot be written until the ingredient it points at has an id. */
async function retryPrepSync(log){
  if(PREP_RETRY_RUNNING)return {ings:0,recipes:0,failed:0};
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return {ings:0,recipes:0,failed:0};
  var dirtyIngs=(S.ings||[]).filter(function(i){return i.syncDirty||i.cloudId===null||i.cloudId===undefined;});
  var dirtyRecs=(S.recipes||[]).filter(function(r){return r.syncDirty||r.cloudId===null||r.cloudId===undefined;});
  if(!dirtyIngs.length&&!dirtyRecs.length)return {ings:0,recipes:0,failed:0};
  PREP_RETRY_RUNNING=true;
  var stat={ings:0,recipes:0,failed:0};
  try{
    for(var i=0;i<dirtyIngs.length;i++){
      var ri=await saveIngToCloud(dirtyIngs[i]);
      if(ri&&ri.ok)stat.ings++;else stat.failed++;
    }
    for(var j=0;j<dirtyRecs.length;j++){
      var rr=await saveRecipeToCloud(dirtyRecs[j]);
      if(rr&&rr.ok)stat.recipes++;else stat.failed++;
    }
    save();
    if(log)log('Retried prep data: '+stat.ings+' ingredient(s), '+stat.recipes+' recipe line(s)'+(stat.failed?', '+stat.failed+' still pending':''),stat.failed===0);
  }catch(e){}
  PREP_RETRY_RUNNING=false;
  return stat;
}

/* Pulls whatever the Dashboard has, matching cloud rows to local ones by
   stored cloud id first and by name second, so an ingredient typed on this
   till and the same ingredient created on the Dashboard converge instead
   of appearing twice. */
async function loadIngredientsFromCloud(){
  if(!CLOUD.token||!CLOUD.bizId)return;
  var ch=cloudHeaders(), ingRows=null, recRows=null;
  try{
    var r1=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r1.ok)ingRows=await r1.json();
  }catch(e){}
  try{
    var r2=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r2.ok)recRows=await r2.json();
  }catch(e){}
  if(!Array.isArray(ingRows))return;

  ingRows.forEach(function(row){
    if(row.id===undefined||row.id===null)return;
    var local=null;
    for(var i=0;i<S.ings.length;i++){
      var x=S.ings[i];
      if(x.cloudId!==null&&x.cloudId!==undefined&&String(x.cloudId)===String(row.id)){local=x;break;}
    }
    if(!local){
      for(var j=0;j<S.ings.length;j++){
        var y=S.ings[j];
        if((y.cloudId===null||y.cloudId===undefined)&&String(y.name||'').trim().toLowerCase()===String(row.name||'').trim().toLowerCase()){local=y;break;}
      }
    }
    if(!local){
      local={id:S.ingNid++,cloudId:row.id,name:row.name||'Ingredient',unit:'',stock:0,low:0,cost:0};
      S.ings.push(local);
    }
    local.cloudId=row.id;
    /* A row still waiting to be pushed keeps its local values. Overwriting it
       from the cloud here used to quietly undo whatever the till had just
       typed, which looked exactly like "the edit didn't save". */
    if(local.syncDirty)return;
    if(row.name)local.name=row.name;
    if(row.stock!==undefined&&row.stock!==null)local.stock=ingRound(row.stock);
    if(row.unit!==undefined&&row.unit!==null)local.unit=row.unit;
    /* Read cost_per_unit — the column the Dashboard writes. Older rows may
       still carry a plain `cost`, so accept either and prefer the new one. */
    var rowCost=(row.cost_per_unit!==undefined&&row.cost_per_unit!==null)?row.cost_per_unit
               :((row.cost!==undefined&&row.cost!==null)?row.cost:null);
    if(rowCost!==null)local.cost=+rowCost||0;
    if(row.low_threshold!==undefined&&row.low_threshold!==null)local.low=+row.low_threshold||0;
  });

  if(Array.isArray(recRows))recRows.forEach(function(row){
    if(row.id===undefined||row.id===null)return;
    var ing=null;
    for(var i=0;i<S.ings.length;i++){
      var x=S.ings[i];
      if(x.cloudId!==null&&x.cloudId!==undefined&&String(x.cloudId)===String(row.ingredient_id)){ing=x;break;}
    }
    if(!ing)return;
    var ex=null;
    for(var j=0;j<S.recipes.length;j++){
      var r=S.recipes[j];
      if((r.cloudId!==null&&r.cloudId!==undefined&&String(r.cloudId)===String(row.id))||
         (r.prod===row.product_name&&r.ingId===ing.id)){ex=r;break;}
    }
    if(!ex){ex={id:S.recipeNid++,cloudId:row.id,prod:row.product_name,ingId:ing.id,qty:0};S.recipes.push(ex);}
    ex.cloudId=row.id;
    // Same rule as ingredients: an unpushed local edit wins over the cloud.
    if(ex.syncDirty)return;
    ex.prod=row.product_name;
    ex.ingId=ing.id;
    ex.qty=+row.qty_used||0;
  });
  save();
}
async function loadCloudData(silent){
  if(!CLOUD.token||!CLOUD.bizId)return;
  if(!silent)toast('Syncing from cloud...');
  /* Learn about deletions other tills made before reading sales, or this
     device would pull them down and then push them back up again. */
  await loadTombstonesFromCloud();
  try{
    const ch=cloudHeaders();
    /* These limits have to be at least as generous as the ones reconcileSales
       and reconcileExpenses read with (10000). They used to be 500 and 200, so
       a full sync pushed everything up and then pulled back only the newest
       slice — older sales stayed safe in the cloud but vanished from this
       device's History, which reads as data loss to whoever is at the till. */
    const [sales,expenses,prods]=await Promise.all([
      fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId+'&order=date.desc&limit=10000',{headers:ch}).then(r=>r.json()),
      fetch(SUPA_URL+'/rest/v1/expenses?biz_id=eq.'+CLOUD.bizId+'&order=date.desc&limit=10000',{headers:ch}).then(r=>r.json()),
      fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId,{headers:ch}).then(r=>r.json()),
    ]);
    if(Array.isArray(sales)){
      /* salePayload sends queue_no / queue_status / queue_day up, but nothing
         read them back, so every full sync silently stripped the queue
         numbers off this device's sales. */
      /* The cloud has no `receipt` column, so a pull would blank the receipt
         text for sales this device took. Keep whatever is already held
         locally for the same txn_id. The breakdown no longer depends on it,
         but the original slip is still worth not throwing away. */
      const oldReceipts={};
      (S.sales||[]).forEach(function(o){if(o&&o.id&&o.receipt)oldReceipts[o.id]=o.receipt;});
      /* v7.5 FIX: this replaces S.sales wholesale, which is exactly how a
         deleted sale came back to life. If the cloud delete had not gone
         through yet — offline till, failed request, another device that has
         not synced — the rows were simply handed back. Tombstoned txn_ids
         are dropped here and, belt and braces, the cloud rows are deleted
         again so the next pull is clean. */
      const _tomb=tombMap();
      const _resurrected=sales.filter(function(s){return _tomb[String(s.txn_id)];});
      const _keep=sales.filter(function(s){return !_tomb[String(s.txn_id)];});
      if(_resurrected.length){
        console.warn('[Arroyo] '+_resurrected.length+' deleted sale(s) still in the cloud — re-deleting');
        deleteSalesByIdFromCloud(_resurrected.map(function(s){return s.txn_id;}));
      }
      S.sales=_keep.map(s=>({id:s.txn_id,date:s.date,total:s.total,method:s.method,items:s.items||[],cashier:s.cashier||'',ref:s.ref||'',voided:s.voided||false,receipt:s.receipt||oldReceipts[s.txn_id]||'',disc:s.discount||0,voidedBy:s.voided_by||'',voidedAt:s.voided_at||'',queueNo:s.queue_no||0,queueStatus:s.queue_status||'',queueDay:s.queue_day||null}));
      S.salesTotal=S.sales.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0);
    }
    if(Array.isArray(expenses)){S.expenses=expenses.map(e=>({id:e.id,name:e.name,amount:e.amount,cat:e.cat,date:e.date}));}
    if(Array.isArray(prods)&&prods.length>0){
      /* This pull replaces S.prods outright, and the old line read
         img: p.img || null - so every product photo on the device was
         blanked whenever the cloud row had none, exactly the way the pull
         used to blank receipts.

         Worse, it was self-reinforcing: once the pull had emptied the local
         photos, the next push wrote those nulls back over the cloud copies,
         so the images were destroyed on both sides.

         There is no "remove photo" control anywhere in the POS, so an empty
         image is never a deliberate removal - it only ever means "this side
         has nothing to offer". Treat every empty form the same way
         (undefined = no column, null = empty column, '' = blank string) and
         keep whatever this device already holds. Keyed on the same local_id
         the push merges on. */
      const oldImgs={};
      (S.prods||[]).forEach(function(o){if(o&&o.id!==undefined&&o.img)oldImgs[o.id]=o.img;});
      let imgGaps=0;
      S.prods=prods.map(function(p){
        const lid=p.local_id||p.id;
        let img=p.img;
        if(img===undefined||img===null||img===''){
          img=oldImgs[lid]||null;
          if(img)imgGaps++;
        }
        return {id:lid,name:p.name,price:p.price,cat:p.cat,icon:p.icon||'ITEM',
          stock:p.stock,variants:p.variants||[],img:img,
          salePct:p.sale_pct||0,saleAmt:p.sale_amt||0,barcode:p.barcode||''};   /* NEW: Feature 1 */
      });
      if(imgGaps>0){
        console.warn('[Arroyo] '+imgGaps+' product photo(s) kept from this device - '
          +'the cloud has none for them. Push products from Settings to restore them '
          +'for the Dashboard and other tills.');
      }
      const cs=[...new Set(S.prods.map(p=>p.cat))];S.cats=['All',...cs];
      // Keep the local id counter ahead of every id that exists (incl. ones
      // the Dashboard created) or new POS products will collide on local_id.
      const maxId=S.prods.reduce(function(mx,p){return Math.max(mx,parseInt(p.id)||0);},0);
      if(S.nid<=maxId)S.nid=maxId+1;
    }
    save();if(!silent)toast('Cloud sync complete');
  }catch(e){if(!silent)toast('Sync error — using local data');}
  await loadSettingsFromCloud();
  await loadCloudCustomers();
  await loadAttEmployees();
  await loadIngredientsFromCloud();
  /* Push anything the till created while it was signed out or offline. The
     pull above only brings the Dashboard's copy down; without this a locally
     created recipe would keep losing to it. */
  await retryPrepSync();
}
async function saveProductsToCloud(){
  if(!CLOUD.token||!CLOUD.bizId)return false;
  // Safety: never wipe cloud products if local is empty — pull instead
  if(S.prods.length===0){
    await loadCloudData(true);
    return true;
  }
  // Always ensure auth before writing — handles expired JWT and refresh token, shows re-auth if needed
  const authOk=await ensureAuth();
  if(!authOk){console.error('saveProductsToCloud: auth failed — aborting');return false;}
  try{
    let ch=cloudHeaders();
    // --- SMART MERGE (replaces wipe+repost) ---
    // Fetch current cloud products so we can diff instead of overwrite.
    // This preserves any edits made from the Dashboard.
    /* null means "this run never learned what the cloud holds"; [] means the
       cloud genuinely holds nothing. Conflating the two was the bug: a failed
       fetch left an empty array, every local product then looked new, and the
       loop below posted a second copy of all of them. */
    let cloudProds=null;
    try{
      const fetchRes=await fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId,{headers:ch});
      if(fetchRes.ok){
        const body=await fetchRes.json();
        if(Array.isArray(body))cloudProds=body;
        else console.warn('[Arroyo] saveProductsToCloud: cloud fetch returned non-array');
      } else {
        console.warn('[Arroyo] saveProductsToCloud: cloud fetch failed',fetchRes.status);
      }
    }catch(e){console.warn('[Arroyo] saveProductsToCloud: could not fetch cloud products',e);}

    /* No fallback wipe+repost here. Deleting every cloud product on the
       strength of a read that just failed would also delete anything the
       Dashboard added and this device has not pulled yet. Report the failure
       and let the next sync try again — the local copy is untouched. */
    if(cloudProds===null){
      console.error('saveProductsToCloud: could not read cloud products — aborting rather than overwriting');
      return false;
    }

    // Build lookup maps: local_id → cloud row (uuid), local_id → local prod
    const cloudByLocalId={};
    cloudProds.forEach(function(cp){if(cp.local_id!=null)cloudByLocalId[cp.local_id]=cp;});
    const localIds=new Set(S.prods.map(function(p){return p.id;}));

    // 1. DELETE cloud rows whose local_id no longer exists in POS
    const toDelete=cloudProds.filter(function(cp){return cp.local_id!=null&&!localIds.has(cp.local_id);});
    for(const cp of toDelete){
      try{
        await fetch(SUPA_URL+'/rest/v1/products?id=eq.'+cp.id,{method:'DELETE',headers:ch});
      }catch(e){console.warn('[Arroyo] saveProductsToCloud: delete failed for',cp.id,e);}
    }

    // 2. PATCH existing or POST new for each local product
    /* Only thrown network errors were caught here; an HTTP rejection (bad
       column, RLS denial, constraint violation) was never looked at, so this
       function returned true no matter what and the sync log always said
       "Products pushed". Count real outcomes instead. */
    let pFail=0,lastErr='';
    for(const p of S.prods){
      const existing=cloudByLocalId[p.id];
      /* v7.7.1 FIX: `stock` and `variants` are deliberately NOT in this row.
         v7.5 stopped the checkout path from writing a stock number, but this
         sync path kept sending one, so "Sync everything now" (or any product
         edit, or a settings save) stamped this device's local count over the
         figure the database had worked out - erasing every deduction another
         till had made since this device last pulled. Stock is the database's
         number; it is only ever sent below, on the INSERT of a product the
         cloud has never seen. */
      const row={biz_id:CLOUD.bizId,local_id:p.id,name:p.name,price:p.price,cat:p.cat,icon:p.icon,sale_pct:p.salePct||0,sale_amt:p.saleAmt||0,barcode:p.barcode||null};   /* NEW: Feature 1 */
      /* Only send img when this device actually has one. The old row always
         carried `img: p.img || null`, so a till with no photo for a product
         overwrote the cloud copy with null - which is how 28 products ended
         up with no image anywhere. The Dashboard already omits img from its
         PATCH for exactly this reason; do the same.

         Safe because the POS has no "remove photo" control: an empty local
         img always means "nothing to contribute", never "clear it". If a
         removal feature is ever added it must send img:null explicitly
         rather than relying on this. */
      if(p.img)row.img=p.img;
      try{
        let res;
        if(existing){
          // PATCH — only fields POS owns; preserve dashboard-only fields that POS doesn't touch
          res=await fetch(SUPA_URL+'/rest/v1/products?id=eq.'+existing.id,{method:'PATCH',headers:{...ch,'Prefer':'return=representation'},body:JSON.stringify(row)});
        }else{
          // POST — new product added on POS
          /* A product the cloud has never held has no stock figure to protect,
             so the opening count does go up with the INSERT. */
          const newRow=Object.assign({},row,{stock:p.stock,variants:p.variants||[]});
          res=await fetch(SUPA_URL+'/rest/v1/products',{method:'POST',headers:{...ch,'Prefer':'return=representation'},body:JSON.stringify(newRow)});
        }
        if(!res.ok){
          pFail++;
          try{lastErr=(await res.text()||'').slice(0,200);}catch(e){}
          console.warn('[Arroyo] saveProductsToCloud: '+(existing?'PATCH':'POST')+' rejected for local_id',p.id,res.status,lastErr);
        }
      }catch(e){pFail++;lastErr=(e&&e.message)||'network error';console.warn('[Arroyo] saveProductsToCloud: upsert failed for local_id',p.id,e);}
    }
    console.log('[Arroyo] saveProductsToCloud: smart merge complete. local='+S.prods.length+' cloud_before='+cloudProds.length+' failed='+pFail);
    if(pFail>0){console.error('saveProductsToCloud: '+pFail+' product(s) rejected. Last error: '+lastErr);return false;}
    return true;
  }catch(e){console.error('saveProductsToCloud error:',e);return false;}
}

       'the device that last saved had no logo', which is not the same as
       'this business has no logo' \u2014 treating the two alike is what erased it. */
    if(settings.biz_logo)S.bizLogo=settings.biz_logo;
    else if(!S.logoCleared){
      /* Cloud has lost it. Fall back to whatever this build was deployed
         with, and push it back up so the next device gets it too. */
      if(!S.bizLogo&&PREFILL.bizLogo)S.bizLogo=PREFILL.bizLogo;
      if(S.bizLogo)setTimeout(function(){try{saveSettingsToCloud();}catch(e){}},1200);
    }else{S.bizLogo=null;}
    if(settings.cashiers&&settings.cashiers.length>0)S.cashiers=settings.cashiers;
    if(settings.cashier_nid)S.cashierNid=settings.cashier_nid;
    save();
  }catch(e){}
}
/* ==================================================================== *
 * FULL SYNC — push everything this till holds up to the Dashboard.
 *
 * The per-action pushes already queue on failure, but a queue lives in
 * localStorage and can be cleared, and a sale recorded before a device was
 * ever signed in has nothing to queue against. So rather than trusting the
 * queue alone, this reconciles: it reads what the cloud already has and
 * sends only what is missing. Running it twice is harmless.
 * ==================================================================== */

function chunkList(arr,n){
  const out=[];
  for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));
  return out;
}

// Ingredients and recipes made on this device carry no cloud id until they
// are pushed, so they are what a full sync has to chase.
function unsyncedPrepCount(){
  let n=0;
  S.ings.forEach(function(i){if(i.cloudId===null||i.cloudId===undefined)n++;});
  S.recipes.forEach(function(r){if(r.cloudId===null||r.cloudId===undefined)n++;});
  return n;
}

async function reconcileSales(log){
  const stat={pushed:0,failed:0,voidsFixed:0,readOk:false};
  let rows=null;
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId+'&select=txn_id,voided&limit=10000',
      {headers:cloudHeaders()});
    if(r.ok)rows=await r.json();
  }catch(e){}
  if(!Array.isArray(rows)){
    log('Could not read cloud sales - skipped the sales check',false);
    return stat;
  }
  stat.readOk=true;

  const cloudVoid={};
  rows.forEach(function(x){cloudVoid[String(x.txn_id)]=!!x.voided;});

  /* v7.5 FIX: the second resurrection route. Anything the cloud is missing
     was treated as a sale that had failed to upload and was posted again —
     including every sale that had just been deliberately deleted. A
     tombstoned txn_id is a deletion, not a gap, so it is never re-pushed and
     any straggler still held locally is dropped here. */
  const _tombR=tombMap();
  const _localGhosts=S.sales.filter(function(s){return _tombR[String(s.id)];});
  if(_localGhosts.length){
    S.sales=S.sales.filter(function(s){return !_tombR[String(s.id)];});
    S.salesTotal=S.sales.filter(function(s){return !s.voided;})
      .reduce(function(a,s){return a+(+s.total||0);},0);
    save();
    log('Dropped '+_localGhosts.length+' locally held sale(s) that were deleted elsewhere',true);
  }
  const missing=S.sales.filter(function(s){
    return !(String(s.id) in cloudVoid)&&!_tombR[String(s.id)];});
  // A void recorded here while the cloud copy still reads as a live sale
  // would otherwise overstate takings on the Dashboard.
  const staleVoids=S.sales.filter(function(s){
    return s.voided&&(String(s.id) in cloudVoid)&&cloudVoid[String(s.id)]===false;
  });

  if(!missing.length){
    log('All '+S.sales.length+' local sales are already on the Dashboard',true);
  } else {
    log('Found '+missing.length+' sale(s) missing from the Dashboard...');
    const batches=chunkList(missing.map(function(s){return salePayload(s,CLOUD.bizId);}),50);
    for(let b=0;b<batches.length;b++){
      let ok=false;
      try{
        const r=await fetch(SUPA_URL+'/rest/v1/sales',
          {method:'POST',headers:cloudHeaders(),body:JSON.stringify(batches[b])});
        ok=r.ok;
      }catch(e){}
      if(ok){stat.pushed+=batches[b].length;continue;}
      // One bad row fails a whole batch, so fall back to a row at a time.
      for(let i=0;i<batches[b].length;i++){
        try{
          const r2=await fetch(SUPA_URL+'/rest/v1/sales',
            {method:'POST',headers:cloudHeaders(),body:JSON.stringify(batches[b][i])});
          if(r2.ok||r2.status===409)stat.pushed++;else stat.failed++;
        }catch(e){stat.failed++;}
      }
    }
    log('Pushed '+stat.pushed+' sale(s)'+(stat.failed?', '+stat.failed+' failed':''),stat.failed===0);
  }

  for(let i=0;i<staleVoids.length;i++){
    const s=staleVoids[i];
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+encodeURIComponent(s.id)+'&biz_id=eq.'+CLOUD.bizId,
        {method:'PATCH',headers:cloudHeaders(),
         body:JSON.stringify({voided:true,voided_by:s.voidedBy||'',voided_at:s.voidedAt||new Date().toISOString()})});
      if(r.ok)stat.voidsFixed++;
    }catch(e){}
  }
  if(stat.voidsFixed)log('Marked '+stat.voidsFixed+' sale(s) as voided on the Dashboard',true);
  return stat;
}

async function reconcileExpenses(log){
  const stat={pushed:0,failed:0,readOk:false};
  if(!S.expenses.length){stat.readOk=true;log('No expenses to check',true);return stat;}
  let rows=null;
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/expenses?biz_id=eq.'+CLOUD.bizId+'&select=name,amount,date&limit=10000',
      {headers:cloudHeaders()});
    if(r.ok)rows=await r.json();
  }catch(e){}
  if(!Array.isArray(rows)){
    log('Could not read cloud expenses - skipped the expenses check',false);
    return stat;
  }
  stat.readOk=true;
  // Expenses share no stable id between device and cloud, so match on the
  // exact creation timestamp plus name. Skipping a genuine duplicate is far
  // less damaging than posting the same expense twice.
  const key=function(n,d){return String(n||'')+'|'+String(d||'');};
  const have={};
  rows.forEach(function(x){have[key(x.name,x.date)]=true;});
  const missing=S.expenses.filter(function(e){return !have[key(e.name,e.date)];});
  if(!missing.length){log('All '+S.expenses.length+' expense(s) are already on the Dashboard',true);return stat;}

  log('Found '+missing.length+' expense(s) missing...');
  for(let i=0;i<missing.length;i++){
    const e=missing[i];
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/expenses',{method:'POST',headers:cloudHeaders(),
        body:JSON.stringify({biz_id:CLOUD.bizId,name:e.name,amount:e.amount,cat:e.cat,date:e.date})});
      if(r.ok)stat.pushed++;else stat.failed++;
    }catch(err){stat.failed++;}
  }
  log('Pushed '+stat.pushed+' expense(s)'+(stat.failed?', '+stat.failed+' failed':''),stat.failed===0);
  return stat;
}

/* Claims the cloud ids for prep rows that are already up there.

   This has to run before anything is written. pushPrepData() used to POST
   straight away, and the only code that ever matched a local ingredient to an
   existing cloud row by name was loadIngredientsFromCloud() — which runs at
   the *end* of a full sync, after the push. So an ingredient created on the
   Dashboard, or one whose id was lost when an earlier push died halfway,
   arrived here with no cloudId, POSTed a second copy, and where the table has
   a unique index on (biz_id, name) was rejected outright. Either way it came
   away without an id, and since a recipe line cannot be written until its
   ingredient has one, a single stuck ingredient silently blocked every recipe
   that used it. That is the "failed" the sync log was reporting.

   Only ids are taken here — stock, cost, unit and quantities are untouched —
   so this stays safe to run before an upload: nothing local is overwritten. */
async function adoptPrepCloudIds(log){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return false;
  var ch=cloudHeaders(), ingRows=null, recRows=null;
  try{
    var r1=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r1.ok)ingRows=await r1.json();
  }catch(e){}
  try{
    var r2=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r2.ok)recRows=await r2.json();
  }catch(e){}
  if(!Array.isArray(ingRows)){
    if(log)log('Could not read the Dashboard\u2019s ingredient list \u2014 pushing without it',false);
    return false;
  }
  var norm=function(v){return String(v||'').trim().toLowerCase();};
  var adopted=0;
  var byName={};
  ingRows.forEach(function(row){if(row&&row.id!=null)byName[norm(row.name)]=row.id;});
  S.ings.forEach(function(i){
    if(i.cloudId!==null&&i.cloudId!==undefined)return;
    var hit=byName[norm(i.name)];
    if(hit!=null){i.cloudId=hit;adopted++;}
  });
  if(Array.isArray(recRows)){
    var recKey={};
    recRows.forEach(function(row){
      if(row&&row.id!=null)recKey[norm(row.product_name)+'|'+String(row.ingredient_id)]=row.id;
    });
    S.recipes.forEach(function(r){
      if(r.cloudId!==null&&r.cloudId!==undefined)return;
      var ing=ingById(r.ingId);
      if(!ing||ing.cloudId===null||ing.cloudId===undefined)return;
      var hit=recKey[norm(r.prod)+'|'+String(ing.cloudId)];
      if(hit!=null){r.cloudId=hit;adopted++;}
    });
  }
  if(adopted){
    save();
    if(log)log('Matched '+adopted+' entr'+(adopted===1?'y':'ies')+' that already existed on the Dashboard',true);
  }
  return true;
}

async function pushPrepData(log){
  const stat={ings:0,recipes:0,ingFail:0,recFail:0,blocked:0};
  if(!S.ings.length&&!S.recipes.length){log('No ingredients or recipes to push',true);return stat;}
  // Claim any ids that already exist up there before writing anything.
  await adoptPrepCloudIds(log);
  // Ingredients first: a recipe cannot be written until the ingredient it
  // points at has a cloud id to reference.
  for(let i=0;i<S.ings.length;i++){
    const ing=S.ings[i];
    const res=await saveIngToCloud(ing);
    if(res&&res.ok)stat.ings++;
    else{
      stat.ingFail++;
      log('Ingredient \u201c'+(ing.name||'?')+'\u201d failed'
        +(res&&res.status?' ('+res.status+')':'')
        +(res&&res.msg?': '+res.msg:''),false);
    }
  }
  if(S.ings.length)log('Pushed '+stat.ings+' of '+S.ings.length+' ingredient(s)',stat.ingFail===0);
  for(let j=0;j<S.recipes.length;j++){
    const rec=S.recipes[j];
    const res=await saveRecipeToCloud(rec);
    if(res&&res.ok)stat.recipes++;
    else if(res&&res.blocked){
      stat.blocked++;
      log('Recipe for \u201c'+(rec.prod||'?')+'\u201d '+res.msg,false);
    } else {
      stat.recFail++;
      log('Recipe for \u201c'+(rec.prod||'?')+'\u201d failed'
        +(res&&res.status?' ('+res.status+')':'')
        +(res&&res.msg?': '+res.msg:''),false);
    }
  }
  if(S.recipes.length)log('Pushed '+stat.recipes+' of '+S.recipes.length+' recipe line(s)',(stat.recFail+stat.blocked)===0);
  return stat;
}

/* Runs the whole push. log(msg, ok) receives progress; ok is true for a
   success line, false for a failure, undefined for plain progress. */
async function syncEverything(log){
  log=log||function(){};
  if(!CLOUD.token||!CLOUD.bizId){
    log('Not signed in. Open Admin and sign in to the cloud first.',false);
    return {ok:false,reason:'signed-out'};
  }
  if(!navigator.onLine){
    log('This device is offline. Reconnect and try again - nothing is lost in the meantime.',false);
    return {ok:false,reason:'offline'};
  }

  log('Checking session...');
  const authed=await ensureAuth();
  if(!authed){log('Session could not be renewed.',false);return {ok:false,reason:'auth'};}
  log('Session OK',true);

  const pending=queueCount();
  if(pending>0){
    log('Pushing '+pending+' queued item(s)...');
    await flushSyncQueue(log);
  } else {
    log('Nothing waiting in the offline queue',true);
  }

  const sales=await reconcileSales(log);
  const exps=await reconcileExpenses(log);
  const failed=sales.failed+exps.failed;
  // A failed *read* is as dangerous as a failed write: it means this run
  // never established what the Dashboard already holds, so it cannot know
  // whether the local records are safely up there. Pulling on that basis
  // could replace them with an empty or partial result.
  const blind=!sales.readOk||!exps.readOk;

  /* Anything that downloads has to wait until every upload has landed.
     loadCloudData() replaces S.sales and S.expenses outright, and
     saveProductsToCloud() quietly falls back to a full download when this
     device has no products — so both are off limits while records are still
     unsent, or the pull would erase exactly what failed to go up.
     Pushing settings and prep data is still safe: neither reads anything
     back. A stale local copy is recoverable; a deleted sale is not. */
  if(failed>0||blind){
    if(failed>0)log('Finished with '+failed+' item(s) still unsent.',false);
    await saveSettingsToCloud();
    await pushPrepData(log);
    log('Held back the download so nothing on this device is overwritten. Try again in a moment.','warn');
    save();
    return {ok:false,sales:sales,expenses:exps,reason:failed>0?'partial':'unverified'};
  }

  log('Pushing '+S.prods.length+' product(s)...');
  const prodOk=await saveProductsToCloud();
  log(prodOk?'Products pushed':'Products failed to push',prodOk);

  const setOk=await saveSettingsToCloud();
  log(setOk?'Shop settings pushed':'Settings failed to push (non-critical)',setOk);

  const prep=await pushPrepData(log);
  /* Anything still without a cloud id after the push did not land. The old
     code reported {ok:prodOk} only, so a run that failed to push a single
     ingredient or recipe still told the user "Sync complete". */
  const prepLeft=unsyncedPrepCount();
  if(prepLeft>0)log(prepLeft+' ingredient/recipe entr'+(prepLeft===1?'y':'ies')+' still not on the Dashboard',false);

  log('Pulling the latest back from the Dashboard...');
  await loadCloudData(true);
  save();
  const allOk=prodOk&&prepLeft===0;
  log(allOk?'Everything on this device is now on the Dashboard.'
           :'Finished, but some items did not go up — run this again in a moment.',allOk);
  return {ok:allOk,sales:sales,expenses:exps,prep:prep,settings:setOk,prepLeft:prepLeft,reason:allOk?'':'partial'};
}

// Everything the deployer pre-configured is applied here, so the client
// never sees the business-type chooser or the setup wizard.
function applyPrefill(){
  if(!PREFILL.bizType)return false;
  S.biz=PREFILL.bizType;
  if(PREFILL.bizName)S.bizName=PREFILL.bizName;
  if(PREFILL.themeColor)S.themeColor=PREFILL.themeColor;
  if(PREFILL.bizLogo)S.bizLogo=PREFILL.bizLogo;
  if(PREFILL.dailyGoal)S.dailyGoal=PREFILL.dailyGoal;
  /* v7.1.2 FIX: the admin password chosen in the deployer never reached the
     POS lock, so every client build silently kept the factory PIN 1234 while
     the handover sheet said otherwise. Only applied while the PIN is still
     the default, so an owner who has changed it is never reset. */
  if(PREFILL.adminPass&&S.pass==='1234')S.pass=PREFILL.adminPass;
  if(!S.prods||!S.prods.length){
    /* NEW: products typed into the deployer win over the built-in sample.
       An empty box still falls back, so older builds behave as before. */
    var _seed=(PREFILL.starterProducts&&PREFILL.starterProducts.length)
      ? PREFILL.starterProducts : (DP[PREFILL.bizType]||DP.custom||[]);
    S.prods=JSON.parse(JSON.stringify(_seed));
    const cs=[...new Set(S.prods.map(function(p){return p.cat;}))];
    S.cats=['All'].concat(cs);
    S.nid=S.prods.length+1;
  }
  S.wizardDone=true;
  S.screen='pos';
  return true;
}

async function checkForUpdate(){
  try{
    const r=await fetch(VERSION_URL+'?t='+Date.now());
    if(!r.ok)return{status:'error',msg:'Could not reach update server.'};
    const data=await r.json();
    const latest=data.version||'0';
    const current=CR.ver;
    if(latest===current)return{status:'latest',version:latest};
    // Compare versions
    const parts=function(v){return v.split('.').map(Number);};
    const lp=parts(latest),cp=parts(current);
    let newer=false;
    for(let i=0;i<Math.max(lp.length,cp.length);i++){
      const l=lp[i]||0,c=cp[i]||0;
      if(l>c){newer=true;break;}
      if(l<c){break;}
    }
    if(newer)return{status:'available',version:latest,notes:data.notes||''};
    return{status:'latest',version:latest};
  }catch(e){return{status:'error',msg:'Network error. Check your connection.'};}
}

async function applyUpdate(){
  try{
    toast('Downloading update...');
    const [posRes,dashRes]=await Promise.all([
      fetch(UPDATE_URL+'?t='+Date.now()),
      fetch(DASH_UPDATE_URL+'?t='+Date.now()),
    ]);
    if(!posRes.ok||!dashRes.ok){toast('Download failed. Try again.');return false;}
    const [posHtml,dashHtml]=await Promise.all([posRes.text(),dashRes.text()]);
    // Save dashboard update for when dashboard is next opened
    try{localStorage.setItem('arroyo_dash_update',dashHtml);}catch(e){}
    // Save POS update as fallback (used by load() on next boot if write fails)
    try{localStorage.setItem('arroyo_pos_update',posHtml);}catch(e){}
    toast('Update ready! Applying...');
    // Apply POS update immediately — document.write must be called directly
    // from the user gesture context, NOT inside setTimeout (breaks iOS Safari)
    try{
      document.open('text/html');
      document.write(posHtml);
      document.close();
    }catch(e){
      // Fallback for browsers that block document.write: force reload
      // load() will pick up arroyo_pos_update from localStorage on next boot
      window.location.reload(true);
    }
    return true;
  }catch(e){toast('Update failed: '+e.message);return false;}
}

function load(){
  // Apply any pending update downloaded by applyUpdate()
  try{
    const pending=localStorage.getItem('arroyo_pos_update');
    if(pending){localStorage.removeItem('arroyo_pos_update');document.open('text/html');document.write(pending);document.close();return;}
  }catch(e){}
  try{
    const d=JSON.parse(localStorage.getItem('arroyo_pos')||'{}');
    if(d.installed)S.installed=true;
    if(d.wizardDone)S.wizardDone=true;
    if(d.biz){
      Object.assign(S,{
        biz:d.biz,bizName:d.bizName,prods:d.prods||[],cats:d.cats||[],
        pass:d.pass||'1234',nid:d.nid||10,sales:d.sales||[],
        salesTotal:d.salesTotal||0,screen:'pos'
      });
    }
    if(d.themeColor){S.themeColor=d.themeColor;applyTheme(d.themeColor);}
    if(d.requireRef!==undefined)S.requireRef=d.requireRef;
    /* Only accept a value the grid knows how to apply, so an old or hand-edited
       save cannot leave the POS with an ordering it cannot render. */
    if(d.sort==='name'||d.sort==='price-asc'||d.sort==='price-desc')S.sort=d.sort;
    if(d.bizLogo)S.bizLogo=d.bizLogo;
    if(d.logoCleared){S.logoCleared=true;S.bizLogo=null;}
    /* Redeploying with a logo now reaches a device that is already set up. */
    else if(!S.bizLogo&&PREFILL.bizLogo)S.bizLogo=PREFILL.bizLogo;
    if(d.dailyGoal)S.dailyGoal=d.dailyGoal;
    if(d.expenses)S.expenses=d.expenses;
    if(d.expenseNid)S.expenseNid=d.expenseNid;
    if(d.cashiers)S.cashiers=d.cashiers;
    if(d.cashierNid)S.cashierNid=d.cashierNid;
    if(d.activeCashier)S.activeCashier=d.activeCashier;
    if(d.shiftStart)S.shiftStart=d.shiftStart;
    if(d.openShift)S.openShift=d.openShift;
    if(Array.isArray(d.shiftLog))S.shiftLog=d.shiftLog;
    if(d.shiftNid)S.shiftNid=d.shiftNid;
    S.shiftLog.forEach(function(x){if((parseInt(x.id)||0)>=S.shiftNid)S.shiftNid=(parseInt(x.id)||0)+1;});
    if(Array.isArray(d.ings))S.ings=d.ings;
    if(d.ingNid)S.ingNid=d.ingNid;
    if(Array.isArray(d.recipes))S.recipes=d.recipes;
    if(d.recipeNid)S.recipeNid=d.recipeNid;
    // Guard the id counters: a hand-edited or partially-restored payload can
    // leave them behind the highest id, which would hand out duplicates.
    S.ings.forEach(function(i){if((parseInt(i.id)||0)>=S.ingNid)S.ingNid=(parseInt(i.id)||0)+1;});
    S.recipes.forEach(function(r){if((parseInt(r.id)||0)>=S.recipeNid)S.recipeNid=(parseInt(r.id)||0)+1;});
    // Restore cloud session
    const ct=localStorage.getItem('arroyo_cloud');
    if(ct){try{const c=JSON.parse(ct);CLOUD.user=c.user;CLOUD.token=c.token;CLOUD.refresh=c.refresh||null;CLOUD.bizId=c.bizId;S.cloudEmail=c.email||'';S.cloudBizName=c.bizName||'';}catch(e){}}
  }catch(e){}
  // Nothing saved yet on this device: use what the deployer baked in
  if(!S.biz)applyPrefill();
  applyTheme(S.themeColor);
}

/* ==================================================================== *
 * PHOTO HANDLING
 *
 * Uploads used to be stored exactly as the camera produced them — a phone
 * photo is several megabytes once base64-encoded, and localStorage holds
 * roughly five in total for the whole app. Two unprocessed photos could
 * fill it, at which point save() started throwing and the till silently
 * stopped persisting sales. Every picture is now scaled down to something
 * a 3-column grid can actually use before it is ever stored.
 *
 * Aspect ratio is preserved rather than cropped: a tall bottle and a wide
 * tray both keep all of themselves, and the CSS letterboxes them into the
 * card. Nothing is cut off and nothing is stretched.
 * ==================================================================== */
const IMG_MAX_EDGE=512;     // ample for a product tile on a 2x phone screen
const IMG_LOGO_EDGE=256;
const IMG_QUALITY=0.82;

// base64 characters -> approximate kilobytes of real data
function imgKB(chars){return Math.max(1,Math.round((chars||0)*0.75/1024));}

function processImage(file,maxEdge){
  return new Promise(function(resolve,reject){
    if(!file)return reject(new Error('No file chosen'));
    if(!/^image\//.test(file.type||''))return reject(new Error('That file is not an image'));
    const reader=new FileReader();
    reader.onerror=function(){reject(new Error('Could not read that file'));};
    reader.onload=function(ev){
      const src=String(ev.target.result||'');
      const img=new Image();
      img.onerror=function(){reject(new Error('That image could not be opened'));};
      img.onload=function(){
        const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h)return reject(new Error('That image has no size'));
        // Shrink the longest edge to the limit. Never scale a small picture
        // up — that adds bytes without adding any detail.
        const scale=Math.min(1,(maxEdge||IMG_MAX_EDGE)/Math.max(w,h));
        const tw=Math.max(1,Math.round(w*scale)), th=Math.max(1,Math.round(h*scale));
        let out;
        try{
          const c=document.createElement('canvas');
          c.width=tw;c.height=th;
          const ctx=c.getContext('2d');
          if(!ctx)throw new Error('no 2d context');
          ctx.imageSmoothingEnabled=true;
          if('imageSmoothingQuality' in ctx)ctx.imageSmoothingQuality='high';
          // White underlay so a transparent PNG does not turn black once
          // it is flattened into a JPEG.
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,tw,th);
          ctx.drawImage(img,0,0,tw,th);
          out=c.toDataURL('image/jpeg',IMG_QUALITY);
        }catch(e){return reject(new Error('This browser could not resize that image'));}
        // A already-tiny source can come out larger after re-encoding, so
        // keep whichever is smaller. Processing never makes things worse.
        const best=(out&&out.length<src.length)?out:src;
        resolve({data:best,w:tw,h:th,before:src.length,after:best.length});
      };
      img.src=src;
    };
    reader.readAsDataURL(file);
  });
}

function save(){
  try{
    localStorage.setItem('arroyo_pos',JSON.stringify({
      biz:S.biz,bizName:S.bizName,prods:S.prods,cats:S.cats,
      pass:S.pass,nid:S.nid,sales:S.sales,salesTotal:S.salesTotal,
      themeColor:S.themeColor,requireRef:S.requireRef,installed:S.installed,wizardDone:S.wizardDone,
      sort:S.sort,
      bizLogo:S.bizLogo,logoCleared:!!S.logoCleared,dailyGoal:S.dailyGoal,
      expenses:S.expenses,expenseNid:S.expenseNid,
      cashiers:S.cashiers,cashierNid:S.cashierNid,
      activeCashier:S.activeCashier,shiftStart:S.shiftStart,
      openShift:S.openShift,shiftLog:S.shiftLog,shiftNid:S.shiftNid,
      ings:S.ings,ingNid:S.ingNid,recipes:S.recipes,recipeNid:S.recipeNid
    }));
    if(CLOUD.token)localStorage.setItem('arroyo_cloud',JSON.stringify({user:CLOUD.user,token:CLOUD.token,refresh:CLOUD.refresh,bizId:CLOUD.bizId,email:S.cloudEmail,bizName:S.cloudBizName}));
    /* v7.7.4: mirror the cashier and shift ids into their own key on every
       save. Hooked here rather than at each of the four places a drawer can
       open or close, because that list has grown before and a missed site
       would silently leave a stale session behind. */
    if(typeof sessionWrite==='function')sessionWrite();
  }catch(e){
    /* A full quota used to be swallowed here, so the till looked like it
       was working while nothing was actually being written — sales would
       disappear on the next refresh. Say so instead. */
    const full=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);
    console.error('[Arroyo] save failed:',e);
    if(full&&typeof toast==='function'){
      toast('Device storage is full — remove a product photo, then sync');
    }
  }
}

function applyTheme(hex){
  if(!hex||hex.length!==7)return;
  try{
    var R=parseInt(hex.slice(1,3),16),G=parseInt(hex.slice(3,5),16),B=parseInt(hex.slice(5,7),16);
    if(isNaN(R)||isNaN(G)||isNaN(B))return;
    // The picked colour used to become the page background directly. No text
    // can reach a readable ratio on a bright fill — white on #2f81f7 is 3.4:1 —
    // so the fine print went invisible. Keep the client's HUE for the surfaces,
    // force it into a legible dark band, and use the exact colour as the accent.
    var mx=Math.max(R,G,B)/255, mn=Math.min(R,G,B)/255, d=mx-mn;
    var H=0, S=0, Lc=(mx+mn)/2;
    if(d){
      S=Lc>0.5?d/(2-mx-mn):d/(mx+mn);
      var rr=R/255,gg=G/255,bb=B/255;
      H=(mx===rr)?((gg-bb)/d+(gg<bb?6:0)):(mx===gg)?((bb-rr)/d+2):((rr-gg)/d+4);
      H/=6;
    }
    var hsl=function(h,s,l){
      s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
      var f=function(n){
        var k=(n+h*12)%12;
        return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(Math.min(k-3,9-k),1));
      };
      var to=function(v){return Math.round(v*255).toString(16).padStart(2,'0');};
      return '#'+to(f(0))+to(f(8))+to(f(4));
    };
    var Sb=Math.min(S,0.42);             // keep the hue, drop neon saturation
    var bg0=hsl(H,Sb,0.055), bg1=hsl(H,Sb,0.095), bg2=hsl(H,Sb,0.135), bg3=hsl(H,Sb,0.175);
    // Muted tones mix from the text colour toward the surface, so contrast stays
    // proportional instead of relying on fixed greys.
    var b0=[parseInt(bg0.slice(1,3),16),parseInt(bg0.slice(3,5),16),parseInt(bg0.slice(5,7),16)];
    var mix=function(t,f2){
      var to=function(v){return Math.round(v).toString(16).padStart(2,'0');};
      return '#'+to(t[0]+(b0[0]-t[0])*f2)+to(t[1]+(b0[1]-t[1])*f2)+to(t[2]+(b0[2]-t[2])*f2);
    };
    var T=[244,244,238];
    // The accent carries white button text, so lift it if it is too dark for that.
    var lin=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
    var lum=function(c){return 0.2126*lin(c[0])+0.7152*lin(c[1])+0.0722*lin(c[2]);};
    // Accent buttons carry white text, so walk the lightness down until white
    // clears 3.5:1. A bright yellow otherwise gives 2.1:1 and the button label
    // disappears; this turns it into a deep amber of the same hue instead.
    var acS=Math.max(S,0.35), acL=Math.max(0.30,Math.min(0.58,Lc)), ac=hsl(H,acS,acL);
    var wOn=function(c){
      var v=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
      return 1.05/(lum(v)+0.05);
    };
    var guard=0;
    while(wOn(ac)<3.5&&acL>0.22&&guard++<24){ acL-=0.02; ac=hsl(H,acS,acL); }
    var root=document.documentElement;
    root.style.setProperty('--bg0',bg0);
    root.style.setProperty('--bg1',bg1);
    root.style.setProperty('--bg2',bg2);
    root.style.setProperty('--bg3',bg3);
    root.style.setProperty('--t1','#f4f4ee');
    root.style.setProperty('--t2',mix(T,0.30));
    root.style.setProperty('--t3',mix(T,0.50));
    root.style.setProperty('--b1','rgba(255,255,255,0.13)');
    root.style.setProperty('--b2','rgba(255,255,255,0.24)');
    root.style.setProperty('--ac',ac);
    root.style.setProperty('--ac2',hsl(H,Math.max(S,0.35),0.20));
    var mt=document.querySelector('meta[name="theme-color"]');
    if(mt)mt.setAttribute('content',bg1);
  }catch(e){}
}


/* `(+n).toFixed(2)` printed "NaN" for undefined, '' or any non-numeric
   value, so a single missing field showed the cashier "PHP NaN" on a price,
   total or drawer figure. Fall back to zero instead of rendering NaN. */
function fmt(n){var v=Number(n);if(!isFinite(v))v=0;return CUR+v.toFixed(2);}

/* Escapes text before it goes anywhere near innerHTML. There was already an
   esc() in this file, but it lives inside the queue IIFE further down and was
   never reachable from the render functions up here — product names, cashier
   names, expense descriptions and category labels are all operator-supplied
   and were being concatenated into markup unescaped. A product named
   Tom & Jerry's rendered wrong; anything with a tag in it rendered worse. */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  const tc=document.getElementById('toasts');
  if(tc){tc.appendChild(t);setTimeout(()=>t.remove(),2200);}
}

function todaySales(){
  const td=new Date().toDateString();
  return S.sales.filter(s=>!s.voided&&new Date(s.date).toDateString()===td).reduce((a,s)=>a+s.total,0);
}
function lowStockItems(){return S.prods.filter(p=>p.stock!==999&&p.stock>0&&p.stock<=5);}
function outStockItems(){return S.prods.filter(p=>p.stock!==999&&p.stock<=0);}

// Roll parent stock up from variants so cards/alerts/scanner stay accurate
function syncParentStock(p){
  if(!p||!p.variants||!p.variants.length)return;
  if(p.variants.some(function(v){return v.stock===999;})){p.stock=999;return;}
  p.stock=p.variants.reduce(function(a,v){return a+(parseInt(v.stock)||0);},0);
}
// Apply a stock movement for one line item.
// delta < 0 = sale, delta > 0 = void/restore.
// Accepts cart items (matched by id) and tx.items (matched by name).
/* Returns the delta actually applied, which is not always the delta asked
   for: the clamp at zero swallows the remainder on an oversell. Selling 5
   against a stock of 3 moves stock by -3, not -5, so a void that blindly
   added 5 back left stock at 5 - inventory invented out of nothing. Callers
   record this figure on the sale line and replay it, negated, on a void. */
function applyStockDelta(it,delta){
  const p=S.prods.find(function(x){return it.id!==undefined?x.id===it.id:x.name===it.name;});
  if(!p)return 0;
  if(it.variantLabel&&p.variants&&p.variants.length){
    const v=p.variants.find(function(x){return x.label===it.variantLabel;});
    if(v){
      if(v.stock===999)return 0;
      const before=parseInt(v.stock)||0;
      v.stock=Math.max(0,before+delta);
      syncParentStock(p);
      return v.stock-before;
    }
    // Variant was deleted since the sale — fall back to parent stock
  }
  if(p.stock===999)return 0;
  const before=p.stock;
  p.stock=Math.max(0,p.stock+delta);
  return p.stock-before;
}

function exportCSV(sales){
  const rows=[['TXN ID','Date','Time','Cashier','Items','Total','Method','Ref','Voided']];
  sales.forEach(s=>{
    rows.push([s.id,new Date(s.date).toLocaleDateString('en-PH'),new Date(s.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
      /* NEW 7.8.2 — add-ons now appear in the export, so a line billed above
         menu price can be explained from the spreadsheet alone. */
      s.cashier||'',s.items.map(i=>arroyoItemName(i,true)+' x'+i.qty).join('; '),
      s.total.toFixed(2),s.method,s.ref||'',s.voided?'YES':'NO']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='arroyo-pos-'+new Date().toISOString().slice(0,10)+'.csv';
  a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);toast('CSV exported!');
}

/* ══ v7.7.4 CART STOCK CEILING ══════════════════════════════════════════
   FIVE different places could add to the cart and not one of them compared
   the resulting quantity against stock, so a product with 5 on the shelf
   could be sold 6, 7, twenty times over. Nothing complained at the time:
   the oversell only surfaced at checkout, where applyStockDelta() clamps at
   zero — the sale was recorded in full, the stock line read 0, and the
   difference between what was sold and what existed was invisible.

   The five paths were the product tile, the variant picker, the barcode
   scanner, the cart's own + button, and addToCart()/chgQty(). Those last
   two were DEAD CODE — defined, never called — which is the trap here: the
   obvious-looking place to add the cap was the one place that could not
   have any effect. They are deleted below rather than fixed, so the next
   person to read this file cannot make the same mistake.

   availUnits() is now the single answer to "how many of this can still be
   sold", and cartAdd()/cartSetQty() are the only two ways the cart is
   allowed to change. 999 means unlimited and stays uncapped by design. */
/* ==================== NEW: Feature 2/3/4/5 — CONFIG ====================
   Everything the shop owner is expected to edit lives in this one block.
   Nothing below reads from Supabase, so the config is safe to change and
   redeploy without touching the database.

   FUTURE VARIANTS (not yet implemented — owner to configure manually):
   - Mini Corndog / Regular Corndog: qty (3pc / 6pc / 12pc)?
   - Munchkins with Marshmallow: qty variant?
   - Pastillas De Leche: qty variant?
   - Hot Drinks (Brewed Coffee, Espresso, etc.): size variant (solo/double)?
   - Streetfood Platter: composition variant (what's included)?
   - Hawaiian Pizza / Ham & Cheese Pizza: slice count variant?
   - Blue Lemonade (standalone): size variant?
   Hot Drinks deliberately get no sugar/add-on prompt: the menu sells them
   plain and the owner asked for size first, which needs a size field the
   POS does not have yet.
======================================================================== */

/* FEATURE 2 — QR payment image.
   THE SHOP OWNER SETS THEIR QR HERE. Either a hosted image URL
   ('https://.../gcash-qr.png') or a data: URI pasted straight in. An empty
   string is valid: the QR payment method still records the sale and still
   stays out of the cash drawer, it just shows a "no image configured" note
   instead of a picture. A data: URI is the safer choice for a shop with
