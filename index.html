<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#f5f0e8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Pawffinated"/>
<meta name="description" content="Universal Point of Sale by Reymar Arroyo"/>
<link rel="manifest" href="manifest.json"/><link rel="apple-touch-icon" href="icon-192.png"/>
<title>Pawffinated POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0.1)}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg0);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:fixed;top:0;left:0}
input,select,textarea{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}

/* CSS VARIABLES */
:root{
  --bg0:#111110;--bg1:#1c1c1a;--bg2:#262624;--bg3:#2e2e2c;
  --t1:#f0f0ec;--t2:#a8a8a2;--t3:#666660;
  --b1:rgba(255,255,255,0.10);--b2:rgba(255,255,255,0.18);
  --ac:#378add;--ac2:#0c447c;
  --sg:#27500a;--st:#c0dd97;
  --wg:#633806;--wt:#fac775;
  --dg:#791f1f;--dt:#f09595;--df:#e24b4a;
  --pg:#3c3489;--pt:#afa9ec;
  --r:12px;
}

/* APP SHELL */
#app{height:100dvh;width:100vw;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg0)}

/* TOP NAV */
.topnav{background:var(--bg1);border-bottom:1px solid var(--b1);flex-shrink:0;display:flex;flex-direction:column}
.topnav-brand{display:flex;align-items:center;padding:10px 14px 0;gap:8px}
.brand-name{font-size:calc(16px * var(--fs,1));font-weight:700;flex:1}
.brand-tag{font-size:calc(10px * var(--fs,1));font-weight:600;padding:3px 8px;border-radius:20px;background:var(--ac2);color:var(--ac)}
.net-status-wrap{display:flex;align-items:center;gap:5px;font-size:calc(10px * var(--fs,1));font-weight:700;color:var(--t3)}
.topnav-tabs{display:flex;overflow-x:auto;padding:0 4px}
.topnav-tabs::-webkit-scrollbar{height:0}
.tab{flex:1;min-width:60px;padding:10px 8px;font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;text-align:center;letter-spacing:0.3px;white-space:nowrap}
.tab.on{color:var(--t1);border-bottom-color:var(--ac)}

/* BIZ SCREEN */
.biz-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:20px;overflow-y:auto}
.biz-logo{font-size:calc(30px * var(--fs,1));font-weight:800;letter-spacing:-1px}
.biz-sub{font-size:calc(14px * var(--fs,1));color:var(--t2)}
.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px}
.biz-card{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:22px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;-webkit-tap-highlight-color:rgba(55,138,221,0.2)}
.biz-card:active{background:var(--bg3);transform:scale(0.96)}
.biz-ico{font-size:calc(12px * var(--fs,1));font-weight:800;color:var(--t2);background:var(--bg3);padding:8px 12px;border-radius:8px;letter-spacing:0.5px}
.biz-lbl{font-size:calc(13px * var(--fs,1));font-weight:600;text-align:center}
.biz-note{font-size:calc(12px * var(--fs,1));color:var(--t3);text-align:center;max-width:300px;line-height:1.7}

/* SCREEN CONTENT */
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg0);color:var(--t1);min-height:0}

/* POS */
.pos-search{padding:10px 12px;flex-shrink:0}
.pos-search input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(15px * var(--fs,1));outline:none}
.pos-cats{display:flex;gap:7px;padding:0 12px 10px;overflow-x:auto;flex-shrink:0}
.pos-cats::-webkit-scrollbar{height:0}
.cat{padding:8px 16px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:calc(13px * var(--fs,1));font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* Sort control. Deliberately lighter than the category pills: category is
   the primary filter and should stay the louder of the two. */
.pos-sort{display:flex;align-items:center;gap:6px;padding:0 12px 10px;overflow-x:auto;flex-shrink:0}
.pos-sort-l{font-size:calc(11px * var(--fs,1));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);flex-shrink:0;margin-right:2px}
.sortb{padding:6px 12px;border-radius:16px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:calc(12px * var(--fs,1));font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sortb.on{background:var(--t1);color:var(--bg0);border-color:var(--t1)}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px 100px;overflow-y:auto;flex:1;align-content:start}
.pcard{background:var(--bg2);border:1.5px solid var(--b1);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;position:relative;overflow:hidden}.pcard::before{content:'';display:block;padding-top:100%}.pcard-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.pcard:active{background:var(--bg3);transform:scale(0.94)}
.pico{font-size:calc(10px * var(--fs,1));font-weight:800;color:var(--t2);background:var(--bg3);padding:5px 8px;border-radius:6px;letter-spacing:0.5px}
.pname{font-size:calc(11px * var(--fs,1));font-weight:600;line-height:1.2}
.pprice{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--ac)}
.pstock{font-size:calc(9px * var(--fs,1));color:var(--t3)}
.pcard.low .pstock{color:var(--wt)}
.pcard.out{opacity:0.3;pointer-events:none}

/* CART FAB */
.cart-fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px;background:var(--ac);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;border:none;cursor:pointer;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.cart-fab:active{opacity:0.85}
.fab-info{flex:1;text-align:left}
.fab-count{font-size:calc(12px * var(--fs,1));color:rgba(255,255,255,0.75);margin-bottom:2px}
.fab-total{font-size:calc(18px * var(--fs,1));font-weight:800;color:#fff}
.fab-lbl{font-size:calc(13px * var(--fs,1));font-weight:700;color:#fff;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:10px}

/* CART SCREEN */
.cart-hd{display:flex;align-items:center;padding:12px 14px;gap:10px;border-bottom:1px solid var(--b1);flex-shrink:0}
.cart-back{padding:10px 16px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(14px * var(--fs,1));font-weight:600;cursor:pointer}
.cart-back:active{background:var(--bg3)}
.cart-title{font-size:calc(17px * var(--fs,1));font-weight:700;flex:1}
.cart-clear{font-size:calc(13px * var(--fs,1));color:var(--dt);background:none;border:none;cursor:pointer;padding:8px 10px;font-weight:600}
.cart-items{flex:1;overflow-y:auto;padding:0 14px;min-height:0}
.cart-empty{text-align:center;color:var(--t3);font-size:calc(14px * var(--fs,1));padding:48px 0}
.ci{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--b1)}
.ci-info{flex:1}
.ci-name{font-size:calc(15px * var(--fs,1));font-weight:600}
.ci-price{font-size:calc(13px * var(--fs,1));color:var(--t2);margin-top:2px}
.ci-qty{display:flex;align-items:center;gap:10px}
.qb{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(20px * var(--fs,1));font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qb:active{background:var(--bg3)}
.qnum{font-size:calc(16px * var(--fs,1));font-weight:700;min-width:24px;text-align:center}
.ci-sub{font-size:calc(16px * var(--fs,1));font-weight:700;color:var(--ac);min-width:70px;text-align:right;flex-shrink:0}
.cart-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--b1);flex-shrink:0;background:var(--bg1);position:sticky;bottom:0;z-index:10}
.disc-row{display:flex;gap:8px;margin-bottom:8px}
.disc-row input{flex:1;padding:9px 10px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(14px * var(--fs,1));outline:none}
.disc-row select{padding:9px 8px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(14px * var(--fs,1));outline:none}
.sum{display:flex;justify-content:space-between;font-size:calc(13px * var(--fs,1));color:var(--t2);padding:3px 0}
.sum-total{display:flex;justify-content:space-between;font-size:calc(18px * var(--fs,1));font-weight:800;padding:8px 0 10px;border-top:1px solid var(--b1);margin-top:4px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.pbtn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(14px * var(--fs,1));font-weight:700;cursor:pointer;text-align:center;display:block;width:100%}
.pbtn:active{background:var(--bg3);transform:scale(0.97)}
.pbtn.big{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac);font-size:calc(16px * var(--fs,1));font-weight:800;padding:18px;border-radius:14px}
.pbtn.big:active{opacity:0.85}

/* INVENTORY */
/* The Attendance panel has always set className='card', but no such rule
   existed — that block was rendering completely unstyled. */
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:14px;padding:14px;margin:0 14px}
.panel-hd{padding:14px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-hd h2{font-size:calc(18px * var(--fs,1));font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;flex-shrink:0}
.stat{background:var(--bg2);border-radius:12px;padding:12px}
.stat-l{font-size:calc(10px * var(--fs,1));color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat-v{font-size:calc(20px * var(--fs,1));font-weight:800}
.inv-list{flex:1;overflow-y:auto}
.inv-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--b1)}
.inv-ico{font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t2);background:var(--bg2);padding:8px 10px;border-radius:8px;min-width:44px;text-align:center;flex-shrink:0}
.inv-info{flex:1;overflow:hidden}
.inv-name{font-size:calc(15px * var(--fs,1));font-weight:600}
.inv-cat{font-size:calc(12px * var(--fs,1));color:var(--t3);margin-top:2px}
.inv-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.inv-price{font-size:calc(15px * var(--fs,1));font-weight:700;color:var(--ac)}
.badge{padding:4px 10px;border-radius:20px;font-size:calc(11px * var(--fs,1));font-weight:700}
.b-ok{background:var(--sg);color:var(--st)}
.b-low{background:var(--wg);color:var(--wt)}
.b-out{background:var(--dg);color:var(--dt)}
.acts{display:flex;gap:6px}
.act{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--b1);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:calc(11px * var(--fs,1));font-weight:700}
.act:active{background:var(--bg2)}
.act.del:active{background:var(--dg);color:var(--dt)}
.add-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--ac);border:none;color:#fff;font-size:calc(28px * var(--fs,1));cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.4);z-index:400}
.add-fab:active{opacity:0.85}

/* HISTORY */
.hist-bar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--b1);overflow-x:auto;flex-shrink:0}
.hist-bar::-webkit-scrollbar{height:0}
.hpill{padding:8px 14px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:calc(13px * var(--fs,1));font-weight:600;cursor:pointer;white-space:nowrap}
.hpill.on{background:var(--t1);color:var(--bg0);border-color:var(--t1)}
.hist-list{flex:1;overflow-y:auto;padding:12px 16px}
.hist-empty{text-align:center;color:var(--t3);font-size:calc(14px * var(--fs,1));padding:48px 0}
.day-lbl{font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;padding:6px 0 4px}
.day-sub{font-size:calc(12px * var(--fs,1));color:var(--t2);margin-bottom:8px}
.txcard{background:var(--bg2);border:1.5px solid var(--b1);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.txcard:active{background:var(--bg3)}
.txl{flex:1;overflow:hidden}
.txid{font-size:calc(10px * var(--fs,1));color:var(--t3);font-weight:700;margin-bottom:3px}
.txitems{font-size:calc(14px * var(--fs,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txtime{font-size:calc(12px * var(--fs,1));color:var(--t2);margin-top:3px}
.txr{text-align:right;flex-shrink:0}
.txtot{font-size:calc(16px * var(--fs,1));font-weight:800}
.txm{font-size:calc(11px * var(--fs,1));font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:3px}
.mCash{background:var(--sg);color:var(--st)}
.mCard{background:var(--ac2);color:var(--ac)}
.mGCash{background:var(--pg);color:var(--pt)}
.mUtang{background:var(--wg);color:var(--wt)}
.mTransfer{background:var(--wg);color:var(--wt)}

/* ADMIN */
.admin-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.asec{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.asec-t{font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px}
.arow{display:flex;flex-direction:column;gap:6px}
.arow label{font-size:calc(13px * var(--fs,1));color:var(--t2);font-weight:600}
.arow input,.arow select{padding:12px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg1);color:var(--t1);font-size:calc(15px * var(--fs,1));outline:none;width:100%}
.abtnrow{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.abtn{padding:11px 18px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg1);color:var(--t1);font-size:calc(14px * var(--fs,1));font-weight:600;cursor:pointer}
.abtn:active{background:var(--bg3)}
.abtn.pri{background:var(--t1);color:var(--bg0);border-color:var(--t1)}
.asec.danger{border-color:var(--dg)}
.asec.danger .asec-t{color:var(--dt)}
.asec.creator{border-color:var(--pg)}
.asec.creator .asec-t{color:var(--pt)}
.cp-row{display:flex;gap:8px;flex-wrap:wrap}
.cp{padding:10px 14px;border-radius:20px;border:none;font-size:calc(12px * var(--fs,1));font-weight:700;cursor:pointer;color:#fff}
.cp:active{opacity:0.8;transform:scale(0.96)}
.cp.light{color:#333}

/* ABOUT */
.about-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.about-card{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.av{width:60px;height:60px;border-radius:50%;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:calc(20px * var(--fs,1));font-weight:800;color:var(--ac)}
.divl{width:100%;height:1px;background:var(--b1)}
.cr{display:flex;align-items:center;gap:12px;width:100%;font-size:calc(14px * var(--fs,1));color:var(--t2)}
.cico{font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);min-width:22px}

/* LOCK */
.lock-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg0)}
.lock-card{background:#1c1c1a;border:2px solid rgba(255,255,255,0.18);border-radius:24px;padding:32px 24px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.4);color:#f0f0ec}
.lock-ico{font-size:calc(13px * var(--fs,1));font-weight:700;color:#a8a8a2;background:#2e2e2c;padding:10px 16px;border-radius:12px;letter-spacing:1px}
.lock-card h2{font-size:calc(20px * var(--fs,1));font-weight:700}
.lock-card p{font-size:calc(14px * var(--fs,1));color:var(--t2)}
.lock-inp{width:100%;padding:16px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.18);background:#111110;color:#f0f0ec;font-size:calc(20px * var(--fs,1));text-align:center;letter-spacing:6px;outline:none}
.lock-inp:focus{border-color:var(--ac)}
.lock-btn{width:100%;padding:16px;border-radius:12px;border:none;background:#378add;color:#fff;font-size:calc(16px * var(--fs,1));font-weight:700;cursor:pointer}
.lock-btn:active{opacity:0.85}
.lock-err{font-size:calc(13px * var(--fs,1));color:#f09595;min-height:18px}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--bg1);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 0 16px}
.mdrag{width:40px;height:4px;background:var(--b2);border-radius:4px;margin:14px auto 2px;flex-shrink:0}
.mbody{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.mtitle{font-size:calc(19px * var(--fs,1));font-weight:700}
.mbadge{font-size:calc(11px * var(--fs,1));font-weight:700;padding:4px 10px;border-radius:20px;background:var(--pg);color:var(--pt);display:inline-block}
.mf{display:flex;flex-direction:column;gap:6px}
.mf label{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.3px}
.mf input,.mf select{padding:13px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:calc(15px * var(--fs,1));width:100%;outline:none}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtns button{padding:12px 18px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);cursor:pointer;font-size:calc(14px * var(--fs,1));font-weight:600}
.mbtns button:active{background:var(--bg3)}
.mbtns .mpri{background:var(--ac);color:#fff;border-color:var(--ac)}
.mbtns .mdel{color:var(--dt);margin-right:auto}
.rbox{font-family:monospace;font-size:calc(12px * var(--fs,1));background:var(--bg0);border-radius:12px;padding:14px;white-space:pre;overflow-x:auto;line-height:1.9;border:1px solid var(--b1)}

/* CASH */
.cash-disp{background:var(--bg0);border-radius:14px;padding:18px;text-align:center}
.cash-lbl{font-size:calc(11px * var(--fs,1));font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.cash-amt{font-size:calc(36px * var(--fs,1));font-weight:800}

<style>
/* ══════════════════════════════════════════════════════════════════════════
   PRODUCT GRID GEOMETRY — TILES SIZED BY THEIR CONTENT, LIST SCROLLS
   Loaded last, so it settles tile geometry after every earlier layer. It sets
   only structure: shape, height and scrolling. Colour, radius, padding, fonts
   and image treatment stay with each theme's own design layer above.

   How this block got here
   -----------------------
   The original fault was that tile HEIGHT was `padding-top:100%` of tile
   WIDTH, and the track was `minmax(Npx, 1fr)`. Width therefore followed the
   container, and the container narrowed the moment a scrollbar appeared, so
   adding the eleventh product made every tile shorter. The item COUNT was
   driving the tile SIZE.

   The first fix forced a square: `aspect-ratio: 1/1` plus an absolutely
   positioned `.pcard-inner`. That stopped the count mattering, but traded one
   fixed shape for another — and a square is not tall enough for everything a
   tile must show. A product with a photo, a two-line name, a struck-through
   price, a sale price, a stock line and a variant count needs roughly 170px
   of height; a square tile on a 320-360px phone is 140-160px. The surplus was
   clipped by `overflow:hidden`, and what survived was whatever sat in the
   vertical middle — usually just the icon chip. Two further problems:
   `aspect-ratio` is ignored by older Android WebViews, which collapsed the
   tiles to nothing at all; and while `.pcard-inner` was `position:absolute`
   the tile had no in-flow child, so its contents could never influence its
   height no matter what else was tuned.

   What this does instead
   ----------------------
   · `.pcard-inner` is back IN FLOW. Everything else depends on this.
   · `min-height: var(--tile-h)` is a floor, not a ceiling: short tiles stay
     uniform, a tile needing more room takes it.
   · `align-items: stretch` makes every tile in a row match the tallest one in
     that row, so rows stay tidy without capping anything.
   · `align-content: start` keeps rows at their natural height — they are
     never compressed to make the list fit. Overflow scrolls, as intended.
   · `scrollbar-gutter: stable` reserves the scrollbar lane up front, so four
     products and four hundred give identical tile geometry.
   · No `aspect-ratio` anywhere.
   · `.pname` clamps at two lines instead of being cut mid-letter, which also
     bounds how tall any one tile can become.
   ══════════════════════════════════════════════════════════════════════════ */

/* --tile-min decides the column count (auto-fill counts repetitions with it).
   --tile-max caps tile width on a large monitor. --tile-h is the height floor:
   photo + two-line name + price + stock + variant line. */
:root { --tile-min: 150px; --tile-max: 210px; --tile-h: 176px; --tile-img: 56px; }

/* Small phones: 320px wide less padding leaves about 292px, where a 150px
   minimum would fit only ONE column. Hence this breakpoint. */
@media (max-width:359px)  { :root { --tile-min: 126px; --tile-max: 180px; --tile-h: 166px; --tile-img: 48px; } }
@media (min-width:480px)  { :root { --tile-min: 140px; --tile-max: 192px; --tile-h: 184px; --tile-img: 60px; } }
@media (min-width:820px)  { :root { --tile-min: 152px; --tile-max: 200px; --tile-h: 192px; --tile-img: 64px; } }
@media (min-width:1280px) { :root { --tile-min: 164px; --tile-max: 216px; --tile-h: 200px; --tile-img: 68px; } }

.prod-grid{
  grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr)) !important;
  grid-auto-rows: auto !important;
  align-content: start !important;    /* rows keep their height; never squeezed */
  align-items: stretch !important;    /* tiles in one row match each other */
  justify-items: stretch !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;      /* the -1.5px keyline overlap must not make an h-scrollbar */
  min-height: 0;                      /* a flex child must be allowed to scroll, not grow */
  scrollbar-gutter: stable both-edges;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* Pre-scrollbar-gutter engines: a permanently present scrollbar is just as
   stable, and costs one thin lane that was going to appear anyway. */
@supports not (scrollbar-gutter: stable){
  .prod-grid{ overflow-y: scroll !important; }
}

/* The padding-top ratio hack is what coupled height to width. */
.pcard::before{ content: none !important; display: none !important; }

.pcard{
  width: 100% !important;
  max-width: var(--tile-max) !important;
  margin-left: auto !important;       /* centred inside a wider track */
  margin-right: auto !important;
  height: auto !important;
  aspect-ratio: auto !important;      /* explicitly undo the square */
  min-height: var(--tile-h) !important;
  align-self: stretch !important;
  display: flex !important;
  flex-direction: column !important;
  overflow: hidden;                   /* clips the photo to the tile radius */
}

/* THE important line. While this was absolute the tile had no in-flow child,
   so its height could not respond to its contents at all. Padding, gap,
   alignment and everything visual are deliberately NOT set here — they belong
   to the theme layer above, which already has opinions about them. */
.pcard-inner{
  position: static !important;
  inset: auto !important;
  flex: 1 1 auto !important;
  width: 100% !important;
  height: auto !important;
  display: flex !important;
  flex-direction: column !important;
  box-sizing: border-box !important;
  min-width: 0 !important;
}

/* .sale-badge lives inside .pcard-inner and is absolutely positioned. With the
   inner no longer positioned it anchors to .pcard, which is position:relative
   already — same placement, and it still takes no room in the flow. */

/* A cap, not a size. One theme gives the photo a fixed 52px square, the other
   lets it fill the tile width and flex; both are fine, but neither may grow
   tall enough to push the price and stock lines out of the tile. */
.pimg{
  max-height: var(--tile-img) !important;
  min-height: 0 !important;
}

/* Two lines, then an ellipsis. A cut-off name reads as a rendering fault, and
   an unbounded one would make a single tile far taller than its row. */
.pname{
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}
</style>
<!-- ══════════════════════════════════════════════════════════════════════════
     TEXT SIZE — A GLOBAL FONT SCALE WITH A − / + CONTROL IN THE HEADER

     Every font-size in the app is written as calc(Npx * var(--fs,1)), so one
     variable on <html> moves all of them together. Only type scales: padding,
     tile geometry and touch targets stay where they are, which is why this is
     a font scale rather than a browser-style zoom. The two printed documents
     (receipt, sales report) were deliberately left at fixed pixels — they are
     laid out against a paper width and must not follow the screen.

     The setting is per device, not per business: it belongs to the tablet on
     the counter and the cashier reading it, so it lives in localStorage under
     arroyo_fontscale and survives sign-out, factory reset of business data,
     and app updates.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
:root{--fs:1}

/* The brand name has to be able to give up room now that two more controls
   share the header; without min-width:0 a flex child refuses to shrink below
   its text and pushes the row wide. */
.brand-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fsz{display:flex;align-items:center;gap:1px;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--b1);border-radius:20px;padding:2px}
.fsz button{width:27px;height:27px;padding:0;border:none;border-radius:50%;
  background:transparent;color:var(--t2);font-size:15px;font-weight:800;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;-webkit-tap-highlight-color:transparent}
.fsz button:active{background:var(--bg3);color:var(--t1);transform:scale(0.92)}
.fsz button[disabled]{opacity:0.3;cursor:default}
.fsz .fsz-v{min-width:32px;text-align:center;cursor:pointer;
  font-size:10px;font-weight:700;color:var(--t3);letter-spacing:0.2px;user-select:none}
/* On a narrow phone the percentage is the first thing to go. */
@media(max-width:400px){.fsz .fsz-v{display:none}}
</style>

<script>
(function(){
  var KEY='arroyo_fontscale';
  var MIN=0.8, MAX=1.6, STEP=0.1;

  function clamp(v){
    v=Math.round(v*100)/100;
    return v<MIN?MIN:(v>MAX?MAX:v);
  }
  function read(){
    try{
      var v=parseFloat(localStorage.getItem(KEY));
      return isFinite(v)&&v>0?clamp(v):1;
    }catch(e){return 1;}
  }
  var scale=read();

  function paint(){
    document.documentElement.style.setProperty('--fs',String(scale));
    var pct=Math.round(scale*100)+'%';
    var i,n=document.querySelectorAll('.fsz');
    for(i=0;i<n.length;i++){
      var v=n[i].querySelector('.fsz-v'),
          d=n[i].querySelector('[data-fsz="-"]'),
          u=n[i].querySelector('[data-fsz="+"]');
      if(v)v.textContent=pct;
      if(d)d.disabled=(scale<=MIN+0.001);
      if(u)u.disabled=(scale>=MAX-0.001);
    }
  }
  function set(v){
    scale=clamp(v);
    try{localStorage.setItem(KEY,String(scale));}catch(e){}
    paint();
  }

  /* Public, so the header can rebuild the control on every render and the
     Admin screen (or anything else later) can drive the same setting. */
  window.fontScaleGet=function(){return scale;};
  window.fontScaleSet=set;
  window.fontScaleStep=function(dir){set(scale+dir*STEP);};

  window.buildFsCtl=function(){
    var w=document.createElement('div');
    w.className='fsz';
    w.title='Text size';

    var minus=document.createElement('button');
    minus.type='button';
    minus.setAttribute('data-fsz','-');
    minus.setAttribute('aria-label','Smaller text');
    minus.textContent='\u2212';
    minus.onclick=function(e){e.stopPropagation();set(scale-STEP);};

    var val=document.createElement('div');
    val.className='fsz-v';
    val.title='Tap to reset to 100%';
    val.onclick=function(e){e.stopPropagation();set(1);};

    var plus=document.createElement('button');
    plus.type='button';
    plus.setAttribute('data-fsz','+');
    plus.setAttribute('aria-label','Larger text');
    plus.textContent='+';
    plus.onclick=function(e){e.stopPropagation();set(scale+STEP);};

    w.appendChild(minus);w.appendChild(val);w.appendChild(plus);
    /* Fill in the percentage and the disabled states for this fresh copy. */
    setTimeout(paint,0);
    return w;
  };

  /* Apply the saved size before first paint so the app never flashes at 100%
     and then jump. */
  paint();
})();
</script>
</head>

function authErrText(res,fallback){
  /* GoTrue answers in several shapes depending on version and endpoint:
       {error:'invalid_grant', error_description:'Invalid login credentials'}
       {code:400, msg:'Invalid login credentials', error_code:'invalid_credentials'}
       {error:{message:'...'}}   {message:'...'}

  if(!res)return fallback;
  var m=(res.error&&res.error.message)||res.error_description||res.msg||res.message||
        (typeof res.error==='string'?res.error:'')||'';
  var code=String(res.error_code||res.code||res.error||'');
  if(/email_not_confirmed|not confirmed/i.test(m+code))
    return 'This email has not been confirmed yet. Open the confirmation link Supabase sent, or turn off email confirmation in Supabase \u2192 Authentication \u2192 Providers.';
  if(/invalid[_ ]?(login|grant|credentials)/i.test(m+code))
    return 'Wrong email or password. This is the account created on the POS \u2014 not the admin password.';
  return m||fallback;
}

/* ── PIN BACK-OFF ─────────────────────────────────────────────────────
   Every PIN gate used to accept unlimited instant guesses: 500 wrong
   attempts went through in 9ms. Five free tries, then a doubling wait
   capped at 30s. Deliberately NOT a hard lockout \u2014 a till that cannot
   be opened is worse than one that can be guessed slowly. Counters live
   in localStorage so reloading the page does not clear the penalty. */
var LOCK_KEY='arroyo_lock_fail';
function lockAll(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}');}catch(e){return {};}}
function lockPut(o){try{localStorage.setItem(LOCK_KEY,JSON.stringify(o));}catch(e){}}
function lockWaitMs(key){
  var s=lockAll()[key];
  if(!s||!s.n||s.n<5)return 0;
  var wait=Math.min(30000,1000*Math.pow(2,s.n-5));
  var left=(s.t||0)+wait-Date.now();
  return left>0?left:0;
}
function lockFail(key){
  var all=lockAll(),s=all[key]||{n:0};
  s.n=(s.n||0)+1;s.t=Date.now();all[key]=s;lockPut(all);
  return lockWaitMs(key);
}
function lockClear(key){var all=lockAll();delete all[key];lockPut(all);}
/* Shows the countdown on an error element and re-enables the button. */
function lockCountdown(key,errEl,btnEl,label){
  var t=setInterval(function(){
    var ms=lockWaitMs(key);
    if(ms<=0){clearInterval(t);if(errEl)errEl.textContent='';if(btnEl)btnEl.disabled=false;return;}
    if(errEl)errEl.textContent=(label||'Too many wrong attempts.')+' Try again in '+Math.ceil(ms/1000)+'s.';
    if(btnEl)btnEl.disabled=true;
  },250);
}

// Global 401/403 handler — auto-refresh token, then show inline re-auth if needed
async function ensureAuth(){
  if(!CLOUD.token)return false;
  // Try a quick token check
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+CLOUD.token}});
    if(r.ok)return true;
    // Handle 401 (expired) AND 403 (forbidden/invalid) — both mean token is bad
    if(r.status===401||r.status===403){
      // Try refresh token first
      if(CLOUD.refresh){
        console.log('[Arroyo] Token invalid ('+r.status+') — attempting refresh...');
        const ok=await refreshSession();
        if(ok){
          console.log('[Arroyo] Token refreshed via ensureAuth');
          return true;
        }
      }
      // Refresh failed or no refresh token — show inline re-auth
      console.log('[Arroyo] Refresh failed — showing re-auth modal');
      return await showReAuthModal();
    }
  }catch(e){console.warn('[Arroyo] ensureAuth network error:',e);}
  return true; // Network error — let the actual call fail with its own error
}

// ── OFFLINE SYNC QUEUE ──────────────────────────────────────────
// Saves failed syncs to localStorage and retries when internet returns.
// Queue format: [{type:'sale'|'expense'|'void', data:{...}, ts:timestamp}]

function queueLoad(){
  try{return JSON.parse(localStorage.getItem('arroyo_sync_queue')||'[]');}catch(e){return[];}
}
function queueSave(q){
  try{localStorage.setItem('arroyo_sync_queue',JSON.stringify(q));}catch(e){}
}
function queueAdd(type,data){
  const q=queueLoad();
  // Deduplicate: don't queue the same txn_id or expense+date twice
  if(type==='sale'&&q.some(x=>x.type==='sale'&&x.data.txn_id===data.txn_id))return;
  if(type==='void'&&q.some(x=>x.type==='void'&&x.data.txn_id===data.txn_id))return;
  // v7.1.2 FIX: only the latest queue status per sale is worth replaying.
  if(type==='qstatus'){const ix=q.findIndex(x=>x.type==='qstatus'&&x.data.txn_id===data.txn_id);if(ix>-1)q.splice(ix,1);}
  q.push({type,data,ts:Date.now()});
  queueSave(q);
  console.log('[Arroyo] Queued offline '+type+':',data.txn_id||data.name||'');
}
function queueCount(){return queueLoad().length;}

/* ==================================================================== *
 * v7.5 FIX PACK — three faults that all had the same root cause:
 * two writers disagreeing about who owns a number.
 *
 *  A) STOCK.  The till deducted locally and PATCHed an absolute figure,
 *     while an INSERT trigger on `sales` deducted the same sale again
 *     server-side. Whichever write landed last won, so a busy day drifted
 *     and two tills selling at once lost one sale's worth of stock every
 *     time. Deduction now happens once, in the database, from the sale
 *     row itself. The till still deducts its own copy for instant
 *     feedback and offline work, but it no longer writes a stock number —
 *     it re-reads the authoritative one.
 *
 *  B) DELETED SALES CAME BACK.  Two separate resurrection routes:
 *     loadCloudData() replaces S.sales wholesale from the cloud, and
 *     reconcileSales() re-uploads any local sale the cloud is missing. So
 *     a delete that only touched one side was always undone by the next
 *     sync. Deletions are now recorded as tombstones, kept on the device
 *     and in Supabase, and both routes honour them.
 *
 *  C) ATTENDANCE.  Starting a shift and clocking in were unrelated
 *     actions, so the Dashboard's hours were whatever staff remembered to
 *     tap. Opening a drawer now clocks the cashier in and closing it
 *     clocks them out.
 * ==================================================================== */

/* ---- A deletion is remembered, not just performed ------------------ */
function tombLoad(){
  try{return JSON.parse(localStorage.getItem('arroyo_deleted_sales')||'[]');}catch(e){return [];}
}
function tombSave(list){
  try{localStorage.setItem('arroyo_deleted_sales',JSON.stringify(list.slice(-20000)));}catch(e){}
}
function tombMap(){
  if(tombMap._c&&tombMap._n===tombMap._len)return tombMap._c;
  var l=tombLoad(),m={};
  for(var i=0;i<l.length;i++)m[String(l[i])]=true;
  tombMap._c=m;tombMap._len=l.length;tombMap._n=l.length;
  return m;
}
function tombAdd(ids){
  if(!ids||!ids.length)return [];
  var list=tombLoad(),have={},fresh=[];
  for(var i=0;i<list.length;i++)have[String(list[i])]=true;
  ids.forEach(function(id){
    var k=String(id||'');
    if(k&&!have[k]){have[k]=true;list.push(k);fresh.push(k);}
  });
  if(fresh.length){tombSave(list);tombMap._c=null;tombMap._len=-1;}
  return fresh;
}
function tombHas(id){return !!tombMap()[String(id)];}

/* Tombstones go up too, so a till that did not perform the deletion stops
   re-uploading its own copy of those sales. Without this the sales came
   back from whichever device was not looking. */
async function pushTombstones(ids,who){
  if(!ids||!ids.length)return false;
  var rows=ids.map(function(id){
    return {biz_id:CLOUD.bizId||null,txn_id:String(id),deleted_by:who||''};
  });
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine){queueAdd('saleTomb',{rows:rows});return false;}
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/deleted_sales?on_conflict=biz_id,txn_id',
      {method:'POST',headers:Object.assign({},cloudHeaders(),{'Prefer':'resolution=ignore-duplicates'}),
       body:JSON.stringify(rows)});
    if(!r.ok){queueAdd('saleTomb',{rows:rows});return false;}
    return true;
  }catch(e){queueAdd('saleTomb',{rows:rows});return false;}
}

/* Deletes named sales from the cloud, chunked so a long list cannot blow
   the URL length limit. Anything that fails is queued rather than lost. */
async function deleteSalesByIdFromCloud(ids){
  if(!ids||!ids.length)return {ok:true};
  var flat=ids.map(String);
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine){
    queueAdd('saleDel',{ids:flat});
    return {ok:false,queued:true,msg:'saved — the cloud copy is deleted on the next sync'};
  }
  var bad=0,msg='';
  for(var i=0;i<flat.length;i+=60){
    var slice=flat.slice(i,i+60).map(function(x){return '"'+x.split('"').join('')+'"';});
    var f='biz_id=eq.'+CLOUD.bizId+'&txn_id=in.('+encodeURIComponent(slice.join(','))+')';
    try{
      var r=await fetch(SUPA_URL+'/rest/v1/sales?'+f,{method:'DELETE',headers:cloudHeaders()});
      if(!r.ok){bad++;try{msg=((await r.text())||'').slice(0,140);}catch(e){}}
    }catch(e){bad++;msg=(e&&e.message)||'network error';}
  }
  if(bad){queueAdd('saleDel',{ids:flat});return {ok:false,queued:true,msg:msg||'delete rejected'};}
  return {ok:true};
}

/* The single entry point for removing sales for good: tombstone, delete the
   cloud rows, publish the tombstones, then drop the local copies. Every
   caller goes through here so no path can delete on one side only. */
async function purgeSales(sales,who){
  var ids=(sales||[]).map(function(s){return s&&s.id;}).filter(Boolean);
  if(!ids.length)return {ok:true,count:0};
  tombAdd(ids);
  /* v7.7.1 FIX: order matters. The AFTER DELETE trigger writes the tombstone
     itself if one is not already there, and it can only see OLD.cashier - the
     cashier who made the sale, not whoever deleted it. Publishing first means
     the real actor's row exists before the delete lands, the trigger's
     ON CONFLICT DO NOTHING leaves it alone, and audit_log names the right
     person. A tombstone for a sale that then fails to delete is harmless: it
     only ever prevents a resurrection. */
  await pushTombstones(ids,who);
  var del=await deleteSalesByIdFromCloud(ids);
  var gone={};ids.forEach(function(i){gone[String(i)]=true;});
  S.sales=(S.sales||[]).filter(function(s){return !gone[String(s.id)];});
  S.salesTotal=(S.sales||[]).filter(function(s){return !s.voided;})
    .reduce(function(a,s){return a+(+s.total||0);},0);
  save();
  return {ok:del.ok,queued:!!del.queued,count:ids.length,msg:del.msg};
}

/* ---- Shift <-> attendance ------------------------------------------ */
function todayKeyLocal(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
    +'-'+String(d.getDate()).padStart(2,'0');
}

/* A cashier may have been typed in by hand and carry no employees row id,
   so fall back to the cloud list and then to a name lookup. */
async function resolveEmployeeId(cashier){
  if(!cashier)return null;
  if(cashier.supaId)return cashier.supaId;
  var hit=(S.cloudAttEmployees||[]).find(function(e){return e.name===cashier.name;});
  if(hit&&hit.id)return hit.id;
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return null;
  try{
    var r=await fetch(SUPA_URL+'/rest/v1/employees?biz_id=eq.'+CLOUD.bizId
      +'&name=eq.'+encodeURIComponent(cashier.name||'')+'&select=id&limit=1',{headers:cloudHeaders()});
    if(!r.ok)return null;
    var rows=await r.json();
    return (Array.isArray(rows)&&rows[0])?rows[0].id:null;
  }catch(e){return null;}
}

function markCashierClockedIn(name,on){
  var e=(S.cloudAttEmployees||[]).find(function(x){return x.name===name;});
  if(!e)return;
  e.clockedIn=!!on;
  e.timeIn=on?new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
  save();
}

async function attClockIn(cashier){
  if(!cashier)return;
  var today=todayKeyLocal();
  var empId=await resolveEmployeeId(cashier);
  var payload={biz_id:CLOUD.bizId||null,employee_id:empId||null,
    employee_name:cashier.name||'',time_in:new Date().toISOString(),date:today};
  if(!empId){
    /* No employees row to attribute the hours to. Queue it so it lands once
       the cashier exists on the Dashboard, rather than dropping it. */
    queueAdd('attIn',payload);return {ok:false,queued:true};
  }
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine){queueAdd('attIn',payload);return {ok:false,queued:true};}
  try{
    var c=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId
      +'&employee_id=eq.'+empId+'&date=eq.'+today+'&time_out=is.null&select=id&limit=1',
      {headers:cloudHeaders()});
    if(c.ok){
      var open=await c.json();
      /* Already clocked in — a second shift on the same day must not open a
         second overlapping record, or hours are counted twice. */
      if(Array.isArray(open)&&open.length){markCashierClockedIn(cashier.name,true);return {ok:true,already:true};}
    }
    var r=await fetch(SUPA_URL+'/rest/v1/attendance',
      {method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload)});
    if(!r.ok){
      var tt='';try{tt=(await r.text()||'').slice(0,160);}catch(e){}
      /* The partial unique index refusing a second open record is the right
         answer, not a write to retry forever. */
      if(r.status===409||tt.indexOf('23505')>-1){markCashierClockedIn(cashier.name,true);return {ok:true,already:true};}
      queueAdd('attIn',payload);return {ok:false,queued:true,msg:tt};
    }
    markCashierClockedIn(cashier.name,true);
    return {ok:true};
  }catch(e){queueAdd('attIn',payload);return {ok:false,queued:true};}
}

/* Shared by the live path and the offline replay. */
async function attCloseOpenRecord(empId,dayKeyStr,whenISO){
  if(!empId)return true;
  var r=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId
    +'&employee_id=eq.'+empId+'&date=eq.'+dayKeyStr
    +'&time_out=is.null&order=time_in.desc&limit=1',{headers:cloudHeaders()});
  if(!r.ok)return false;
  var rows=await r.json();
  if(!Array.isArray(rows)||!rows.length)return true;   /* nothing open: done */
  var tin=new Date(rows[0].time_in).getTime();
  var tout=new Date(whenISO||new Date().toISOString()).getTime();
  if(!isFinite(tin)||!isFinite(tout))return true;
  var hrs=Math.max(0,Math.round((tout-tin)/36000)/100);
  var p=await fetch(SUPA_URL+'/rest/v1/attendance?id=eq.'+rows[0].id,
    {method:'PATCH',headers:cloudHeaders(),
     body:JSON.stringify({time_out:new Date(tout).toISOString(),hours_worked:hrs})});
  return p.ok;
}

async function attClockOut(cashier){
  if(!cashier)return;
  var today=todayKeyLocal();
  var empId=await resolveEmployeeId(cashier);
  var payload={biz_id:CLOUD.bizId||null,employee_id:empId||null,
    employee_name:cashier.name||'',time_out:new Date().toISOString(),date:today};
  if(!empId||!CLOUD.token||!CLOUD.bizId||!navigator.onLine){queueAdd('attOut',payload);return;}
  try{
    var ok=await attCloseOpenRecord(empId,today,payload.time_out);
    if(!ok)queueAdd('attOut',payload);
    else markCashierClockedIn(cashier.name,false);
  }catch(e){queueAdd('attOut',payload);}

/* The Dashboard's Cash drawer page only ever saw closed shifts, so a drawer
   in progress was invisible and an abandoned one left no trace at all. The
   row is written when the drawer opens and completed when it is counted. */
/* v7.7.1 FIX: this was the only write in the app with no failure path -
   `if(!r.ok)return;` and an empty catch. A rejected drawer-open vanished
   without a queue entry, a retry or a word to anyone, while the modal had
   already announced "Shift started - clocked in". It now returns a result and
   queues on failure like every other write, and shift_uid goes up so the
   database can compute the drawer figures itself. */
async function pushOpenShiftToCloud(sh){
  if(!sh)return {ok:false};
  var body={biz_id:CLOUD.bizId,cashier:sh.cashier||'',employee_id:sh.supaId||null,
    shift_uid:sh.shiftUid||null,
    started_at:sh.startedAt,ended_at:null,
    opening_float:+sh.openingFloat||0,note:sh.note||''};
  var lean={biz_id:CLOUD.bizId,cashier:sh.cashier||'',shift_uid:sh.shiftUid||null,
    started_at:sh.startedAt,ended_at:null,opening_float:+sh.openingFloat||0};
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine){
    queueAdd('shiftOpen',{shiftUid:sh.shiftUid||'',body:body});
    return {ok:false,queued:true};
  }
  try{
    var hh=Object.assign({},cloudHeaders(),{'Prefer':'return=representation'});
    var r=await fetch(SUPA_URL+'/rest/v1/shifts',{method:'POST',headers:hh,body:JSON.stringify(body)});
    if(!r.ok)r=await fetch(SUPA_URL+'/rest/v1/shifts',{method:'POST',headers:hh,body:JSON.stringify(lean)});
    if(!r.ok){
      var t='';try{t=(await r.text()||'').slice(0,160);}catch(e){}
      /* A unique violation means this cashier already has an open drawer in the
         database - which is the constraint doing its job, not a lost write. */
      if(r.status===409||t.indexOf('23505')>-1)return {ok:false,duplicate:true,msg:t};
      queueAdd('shiftOpen',{shiftUid:sh.shiftUid||'',body:body});
      return {ok:false,queued:true,status:r.status,msg:t};
    }
    var rows=await r.json();
    if(Array.isArray(rows)&&rows[0]&&rows[0].id){
      if(S.openShift&&S.openShift.id===sh.id){S.openShift.cloudId=rows[0].id;save();}
      sh.cloudId=rows[0].id;
    }
    return {ok:true};
  }catch(e){
    queueAdd('shiftOpen',{shiftUid:sh.shiftUid||'',body:body});
    return {ok:false,queued:true,msg:(e&&e.message)||'network error'};
  }
}

/* ══ v7.7.4 SESSION RESTORE FROM THE CLOUD (req 9) ══════════════════════
   An open drawer was restored from localStorage and nowhere else. Clear the
   site data, reinstall the PWA, get a new device, or have the browser evict
   storage under pressure, and the cashier was sent back to the login screen
   while Supabase still held their shift open with ended_at NULL. From there
   the only two outcomes were both wrong: start a second drawer (refused by
   shifts_one_open_per_cashier, so the till said "started" while the cloud
   disagreed), or leave the original open for autoCloseStaleShifts() to
   guess at hours later.

   The open row is the authoritative record, so it is consulted on boot and
   adopted. The cashier ID and shift ID are also mirrored into their own
   localStorage keys, so a partially corrupt arroyo_pos blob does not take
   the session with it. */
var SESS_KEY='arroyo_session';
function sessionWrite(){
  try{
    if(S.openShift&&S.activeCashier){
      localStorage.setItem(SESS_KEY,JSON.stringify({
        cashierId:S.activeCashier.id!==undefined?S.activeCashier.id:null,
        cashierName:S.activeCashier.name||'',
        shiftUid:S.openShift.shiftUid||'',
        cloudId:S.openShift.cloudId||null,
        startedAt:S.openShift.startedAt||''}));
    } else localStorage.removeItem(SESS_KEY);
  }catch(e){}
}
function sessionRead(){
  try{var v=JSON.parse(localStorage.getItem(SESS_KEY)||'null');return (v&&typeof v==='object')?v:null;}
  catch(e){return null;}
}
/* Finds the local cashier record a cloud shift belongs to. Matches on the
   Supabase employee id first — names are not unique and can be edited — and
   falls back to the name for drawers opened before supaId was stored. */
function cashierForShiftRow(row){
  var list=S.cashiers||[];
  var byId=row.employee_id?list.find(function(c){return c.supaId&&c.supaId===row.employee_id;}):null;
  if(byId)return byId;
  return list.find(function(c){return c.name===row.cashier;})||null;
}
async function restoreOpenShiftFromCloud(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return false;
  /* A good local copy wins: it may hold a float or note not yet uploaded. */
  if(S.openShift&&S.activeCashier)return false;
  var sess=sessionRead();
  try{
    var url=SUPA_URL+'/rest/v1/shifts?biz_id=eq.'+CLOUD.bizId
      +'&ended_at=is.null&order=started_at.desc&limit=5'
      +'&select=id,cashier,employee_id,shift_uid,started_at,opening_float,note';
    var r=await fetch(url,{headers:cloudHeaders()});
    if(!r.ok)return false;
    var rows=await r.json();
    if(!Array.isArray(rows)||!rows.length)return false;
    /* Several tills can each have a drawer open. Prefer the one this device
       last had, then the one whose cashier exists locally. */
    var row=null;
    if(sess&&sess.shiftUid)row=rows.find(function(x){return x.shift_uid===sess.shiftUid;})||null;
    if(!row)row=rows.find(function(x){return !!cashierForShiftRow(x);})||null;
    if(!row)return false;
    var c=cashierForShiftRow(row);
    if(!c)return false;
    S.openShift={
      id:S.shiftNid++,cashier:row.cashier||c.name,
      cashierId:c.id!==undefined?c.id:null,
      shiftUid:row.shift_uid||(row.cashier+'#'+row.started_at),
      supaId:row.employee_id||c.supaId||null,
      cloudId:row.id||null,
      startedAt:row.started_at,
      openingFloat:Math.round((+row.opening_float||0)*100)/100,
      note:row.note||'',endedAt:null,cloudSynced:true
    };
    S.activeCashier=c;S.shiftStart=row.started_at;S.alertDismissed=false;
    /* The drawer is open in the cloud, so the attendance row should be open
       too. attClockIn() already resumes an existing open record rather than
       inserting a second, so this is safe to call on every restore. */
    try{await attClockIn(c);}catch(e){}
    save();sessionWrite();
    toast('Welcome back '+c.name+' \u00b7 shift resumed');
    return true;
  }catch(e){return false;}
}

async function flushSyncQueue(logFn){
  const q=queueLoad();
  if(!q.length)return 0;
  if(!CLOUD.token||!CLOUD.bizId){
    if(logFn)logFn('Skipping queue flush — not connected');
    return 0;
  }
  if(logFn)logFn('Flushing '+q.length+' offline item(s)...');
  const failed=[];
  let pushed=0;
  for(const item of q){
    // Inject current bizId for items queued while offline (bizId was null)
    if(!item.data.biz_id&&CLOUD.bizId)item.data.biz_id=CLOUD.bizId;
    try{
      let ok=false;
      if(item.type==='sale'){
        const r=await fetch(SUPA_URL+'/rest/v1/sales',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(item.data)});
        /* A duplicate txn_id is already-done, not a failure. 23505 is the
           Postgres unique-violation *code*, never an HTTP status, so the old
           check could never fire; PostgREST reports it as 409, or as a 400
           carrying the code in the body. */
        ok=r.ok||r.status===409;
        if(!ok&&r.status>=400&&r.status<500){
          try{const b=await r.text();if(b&&b.indexOf('23505')>-1)ok=true;}catch(e){}
        }
      } else if(item.type==='expense'){
        const r=await fetch(SUPA_URL+'/rest/v1/expenses',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(item.data)});
        ok=r.ok;
      } else if(item.type==='expenseDel'){
        const r=await fetch(SUPA_URL+'/rest/v1/expenses?'+item.data.filter,{method:'DELETE',headers:cloudHeaders()});
        ok=r.ok;
      } else if(item.type==='void'){
        const r=await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+item.data.txn_id+'&biz_id=eq.'+CLOUD.bizId,{method:'PATCH',headers:{...cloudHeaders(),'Prefer':'return=representation'},body:JSON.stringify({voided:true,voided_by:item.data.voided_by||'',voided_at:item.data.voided_at||new Date().toISOString()})});
        ok=r.ok;
      } else if(item.type==='saleDel'){
        /* A deletion made while the till was offline. Without this branch the
           local rows were gone but the cloud copy survived, so the next pull
           brought every one of them straight back. */
        const dIds=(item.data.ids||[]).map(String);
        ok=true;
        for(let di=0;di<dIds.length&&ok;di+=60){
          const sl=dIds.slice(di,di+60).map(function(x){return '"'+x.split('"').join('')+'"';});
          const rr=await fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId
            +'&txn_id=in.('+encodeURIComponent(sl.join(','))+')',
            {method:'DELETE',headers:cloudHeaders()});
          if(!rr.ok)ok=false;
        }
      } else if(item.type==='saleTomb'){
        const trows=(item.data.rows||[]).map(function(x){
          return {biz_id:CLOUD.bizId,txn_id:String(x.txn_id),deleted_by:x.deleted_by||''};});
        if(!trows.length)ok=true;
        else{
          const rt=await fetch(SUPA_URL+'/rest/v1/deleted_sales?on_conflict=biz_id,txn_id',
            {method:'POST',headers:Object.assign({},cloudHeaders(),{'Prefer':'resolution=ignore-duplicates'}),
             body:JSON.stringify(trows)});
          ok=rt.ok;
        }
      } else if(item.type==='attIn'){
        /* Re-resolve the employee: the row may not have existed when the
           clock-in was queued. */
        let eid=item.data.employee_id;
        if(!eid)eid=await resolveEmployeeId({name:item.data.employee_name});
        if(!eid)ok=false;
        else{
          const dk=item.data.date||todayKeyLocal();
          const ck=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId
            +'&employee_id=eq.'+eid+'&date=eq.'+dk+'&time_out=is.null&select=id&limit=1',
            {headers:cloudHeaders()});
          let dup=false;
          if(ck.ok){const oj=await ck.json();dup=Array.isArray(oj)&&oj.length>0;}
          if(dup)ok=true;
          else{
            const ra=await fetch(SUPA_URL+'/rest/v1/attendance',{method:'POST',headers:cloudHeaders(),
              body:JSON.stringify({biz_id:CLOUD.bizId,employee_id:eid,
                employee_name:item.data.employee_name||'',time_in:item.data.time_in,date:dk})});
            ok=ra.ok;
          }
        }
      } else if(item.type==='attOut'){
        let eid2=item.data.employee_id;
        if(!eid2)eid2=await resolveEmployeeId({name:item.data.employee_name});
        if(!eid2)ok=false;
        else ok=await attCloseOpenRecord(eid2,item.data.date||todayKeyLocal(),item.data.time_out);
      } else if(item.type==='shiftOpen'){
        /* v7.7.1: a drawer opened while the till was offline. If the database
           already holds an open drawer for this cashier the constraint refuses
           it, and that is a success as far as the queue is concerned. */
        const sb=Object.assign({},item.data.body||{},{biz_id:CLOUD.bizId});
        const rs=await fetch(SUPA_URL+'/rest/v1/shifts',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(sb)});
        ok=rs.ok||rs.status===409;
        if(!ok&&rs.status>=400&&rs.status<500){
          try{const bt=await rs.text();if(bt&&bt.indexOf('23505')>-1)ok=true;}catch(e){}
        }
      } else if(item.type==='qstatus'){
        /* v7.1.2 FIX: marking an order Ready while the till was offline used
           to be dropped on the floor, so the wall screen never called the
           number even after the connection came back. */
        const r=await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+encodeURIComponent(item.data.txn_id)+'&biz_id=eq.'+CLOUD.bizId,{method:'PATCH',headers:cloudHeaders(),body:JSON.stringify({queue_status:item.data.queue_status})});
        ok=r.ok;
      }
      if(ok){pushed++;}else{failed.push(item);}
    }catch(e){failed.push(item);}
  }
  queueSave(failed);
  if(logFn){
    if(pushed>0)logFn('Pushed '+pushed+' offline item(s) ✓',true);
    if(failed.length>0)logFn(failed.length+' item(s) still pending (will retry next sync)',null);
  }
  console.log('[Arroyo] Queue flush: pushed='+pushed+' failed='+failed.length);
  return pushed;
}

// Single definition of the sales row shape. Both the per-sale push and the
// bulk reconciliation use it, so the two cannot drift apart.
function salePayload(tx,bizId){
  /* v7.7.1: shift_uid and customer_id are new. The till has always stamped a
     shift id on the sale locally but never sent it, so the server could not
     attribute a sale to a drawer - which is why cash_sales, expected_cash and
     variance all had to be worked out on the device and taken on trust.
     customer_id lets the database apply the utang charge and the loyalty
     points in the same transaction as the sale, and reverse them on a void or
     a delete, instead of two unchecked client PATCHes that nothing undid. */
  /* === NEW: Feature 1 — disc_type. `discount` has always been sent as a
     peso figure (damt() resolves the percentage before it gets here), but
     the TYPE was dropped, so a P20 sale and a 20% sale on a P100 order both
     arrived as 20 and no report could tell them apart. === */
  return {biz_id:bizId||null,txn_id:tx.id,date:tx.date,total:tx.total,method:tx.method,
    items:tx.items,discount:tx.disc||0,disc_type:tx.discType||'',
    cashier:tx.cashier||'',ref:tx.ref||'',
    voided:tx.voided||false,queue_no:tx.queueNo||null,queue_status:tx.queueStatus||'',
    queue_day:tx.queueDay||null,shift_uid:tx.shiftId||null,
    customer_id:tx.customerId||null};
}

async function syncSaleToCloud(tx){
  if(!CLOUD.token||!CLOUD.bizId){
    // Not connected — queue for later
    queueAdd('sale',salePayload(tx,null));
    return;
  }
  const payload=salePayload(tx,CLOUD.bizId);
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/sales',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload)});
    if(!r.ok&&r.status!==409){
      // Failed — add to queue
      queueAdd('sale',payload);
      console.warn('[Arroyo] Sale sync failed, queued:',tx.id);
    } else {
      /* The row is in, so the deduction trigger has run. Read back what it
         worked out rather than trusting this device's arithmetic. */
      scheduleStockRefresh();
    }
  }catch(e){
    // Network error — queue it
    queueAdd('sale',payload);
    console.warn('[Arroyo] Sale sync offline, queued:',tx.id);
  }
}

async function syncExpenseDeleteToCloud(exp){
  // Cloud rows use a uuid id; rows created offline still carry a local
  // integer id, so fall back to matching on the business + fields.
  const isUuid=typeof exp.id==='string'&&exp.id.indexOf('-')>-1;
  /* The fallback branch matches on fields rather than a key, so it has to be
     narrow enough to identify one row. biz_id+name+date alone would delete
     every expense sharing a name on the same day — two "Milk delivery" rows
     booked that morning, and both vanish. Including the amount makes a
     collision much less likely; a true duplicate is indistinguishable anyway. */
  const filter=isUuid
    ?'id=eq.'+encodeURIComponent(exp.id)
    :'biz_id=eq.'+CLOUD.bizId+'&name=eq.'+encodeURIComponent(exp.name)
      +'&date=eq.'+encodeURIComponent(exp.date)
      +'&amount=eq.'+encodeURIComponent(exp.amount);
  if(!CLOUD.token||!CLOUD.bizId){queueAdd('expenseDel',{filter:filter});return;}
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/expenses?'+filter,{method:'DELETE',headers:cloudHeaders()});
    if(!r.ok)queueAdd('expenseDel',{filter:filter});
  }catch(e){queueAdd('expenseDel',{filter:filter});}
}
/* ==================================================================== *
 * DELETE A DAY'S SALES
 *
 * Built for clearing out test data. Deliberately day-scoped and password
 * gated: the existing "Clear sales data" button wipes S.sales locally but
 * never touches the cloud, so everything it deleted came straight back on
 * the next pull. These delete the cloud rows too.
 *
 * Boundaries are worked out from the local day, not from a UTC slice of the
 * timestamp — at GMT+9 an evening sale carries a UTC date of the following
 * day, so a naive `date=like.2026-08-28*` filter would delete the wrong
 * transactions and miss the ones actually on screen.
 * ==================================================================== */
function dayBounds(key){
  const parts=String(key||'').split('-');
  const y=+parts[0],mo=+parts[1]-1,d=+parts[2];
  const start=new Date(y,mo,d,0,0,0,0);
  const end=new Date(y,mo,d+1,0,0,0,0);
  return {startISO:start.toISOString(),endISO:end.toISOString()};
}

// What a given day holds, so the confirmation can state it plainly.
function daySummaryFor(key){
  const sales=(S.sales||[]).filter(function(s){return dayKey(s.date)===key;});
  const exps=(S.expenses||[]).filter(function(e){return dayKey(e.date)===key;});
  const live=sales.filter(function(s){return !s.voided;});
  return {
    sales:sales, expenses:exps,
    count:sales.length, voided:sales.length-live.length,
    total:live.reduce(function(a,s){return a+(+s.total||0);},0),
    expTotal:exps.reduce(function(a,e){return a+(+e.amount||0);},0),
    items:live.reduce(function(a,s){return a+(s.items||[]).reduce(function(x,i){return x+(+i.qty||0);},0);},0)
  };
}
